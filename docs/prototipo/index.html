si regolare manualmente o automaticamente a seconda del tipo di lavorazione da eseguire; e\nb) potersi regolare facilmente senza l'uso di un attrezzo.", "pages": [55, 55], "tags": ["generale"], "always": false, "standards": ["EN ISO 14120:2015", "EN ISO 14119:2025 + A11:2026", "EN ISO 13857:2019", "EN ISO 13855:2024"]}, {"id": "MR-III-1.4.3", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.4. Caratteristiche richieste per i ripari ed i dispositivi di protezione", "ref": "All. III, punto 1.4.3", "title": "Requisiti particolari per i dispositivi di protezione", "text": "I dispositivi di protezione devono essere progettati e incorporati nel sistema di comando in modo tale che:\na) la messa in moto degli elementi mobili non sia possibile fintantoché l'operatore può raggiungerli;\nb) le persone non possano accedere agli elementi mobili in movimento; e\nc) la mancanza o il guasto di uno dei loro elementi impedisca l'avviamento o provochi l'arresto degli elementi mobili.\nLa loro regolazione deve richiedere un intervento volontario.", "pages": [55, 55], "tags": ["generale"], "always": false, "standards": ["EN ISO 14120:2015", "EN ISO 14119:2025 + A11:2026", "EN ISO 13857:2019", "EN ISO 13855:2024"]}, {"id": "MR-III-1.5.1", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.5. Rischi dovuti ad altre cause", "ref": "All. III, punto 1.5.1", "title": "Energia elettrica", "text": "Se sono alimentati con energia elettrica, le macchine o i prodotti correlati devono essere progettati, costruiti ed equipaggiati in modo da prevenire o da consentire di prevenire tutti i pericoli dovuti all'energia elettrica.\nGli obiettivi di sicurezza fissati dalla direttiva 2014/35/UE si applicano alle macchine o ai prodotti correlati. Tuttavia, gli obblighi concernenti la valutazione della conformità e l'immissione sul mercato o la messa in servizio di macchine o di prodotti correlati in relazione ai pericoli dovuti all'energia elettrica sono disciplinati esclusivamente dal presente regolamento.", "pages": [55, 55], "tags": ["generale"], "always": false, "standards": ["EN 60204-1:2018", "EN IEC 60204-11:2019"]}, {"id": "MR-III-1.5.2", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.5. Rischi dovuti ad altre cause", "ref": "All. III, punto 1.5.2", "title": "Elettricità statica", "text": "Le macchine o i prodotti correlati devono essere progettati e costruiti in modo da evitare o da ridurre la formazione di cariche elettrostatiche potenzialmente pericolose e/o devono essere muniti di mezzi che consentano di scaricarle.", "pages": [56, 56], "tags": ["generale"], "always": false, "standards": ["IEC TS 60079-32-1"]}, {"id": "MR-III-1.5.3", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.5. Rischi dovuti ad altre cause", "ref": "All. III, punto 1.5.3", "title": "Alimentazione diversa dall'energia elettrica", "text": "Se sono alimentati da fonti di energia diverse da quella elettrica, le macchine o i prodotti correlati devono essere progettati, costruiti ed equipaggiati in modo da prevenire tutti i rischi che possono derivare da tali fonti di energia.", "pages": [56, 56], "tags": ["generale"], "always": false, "standards": ["EN ISO 4413:2010", "EN ISO 4414:2010"]}, {"id": "MR-III-1.5.4", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.5. Rischi dovuti ad altre cause", "ref": "All. III, punto 1.5.4", "title": "Errori di montaggio", "text": "Gli errori commessi al montaggio o al rimontaggio di taluni pezzi, che potrebbero essere all'origine di rischi, devono essere resi impossibili dalla progettazione e dalla costruzione degli stessi oppure mediante indicazioni figuranti sui pezzi o sui loro carter. Le stesse indicazioni devono figurare sugli elementi mobili o sui loro carter, qualora occorra conoscere il senso del moto per evitare rischi.\nSe del caso, nelle istruzioni per l'uso devono figurare informazioni supplementari su tali rischi.\nSe l'origine dei rischi può essere dovuta ad un collegamento difettoso, la progettazione o le indicazioni figuranti sugli elementi da collegare e, se del caso, sui mezzi di collegamento devono rendere impossibili i raccordi errati.", "pages": [56, 56], "tags": ["generale"], "always": false, "standards": []}, {"id": "MR-III-1.5.5", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.5. Rischi dovuti ad altre cause", "ref": "All. III, punto 1.5.5", "title": "Temperature estreme", "text": "Devono essere adottate opportune misure per evitare qualsiasi rischio di lesioni causate dal contatto o dalla vicinanza con parti della macchina o del prodotto correlato o materiali a temperatura elevata o molto bassa.\nDevono inoltre essere adottate le misure necessarie per evitare i rischi di proiezione di materiali molto caldi o molto freddi o per proteggere da tali rischi.", "pages": [56, 56], "tags": ["generale"], "always": false, "standards": ["EN ISO 13732-1:2008", "EN ISO 13732-3:2008"]}, {"id": "MR-III-1.5.6", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.5. Rischi dovuti ad altre cause", "ref": "All. III, punto 1.5.6", "title": "Incendio", "text": "Le macchine o i prodotti correlati devono essere progettati e costruiti in modo da evitare qualsiasi rischio d'incendio o di surriscaldamento presentato dalla macchina stessa o dal prodotto correlato stesso o da gas, liquidi, polveri, vapori od altre sostanze, prodotti o utilizzati dalla macchina o dal prodotto correlato.", "pages": [56, 56], "tags": ["generale"], "always": false, "standards": ["EN ISO 19353:2019"]}, {"id": "MR-III-1.5.7", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.5. Rischi dovuti ad altre cause", "ref": "All. III, punto 1.5.7", "title": "Esplosione", "text": "Le macchine o i prodotti correlati devono essere progettati e costruiti in modo da evitare qualsiasi rischio di esplosione presentato dalla macchina stessa o dal prodotto correlato stesso o da gas, liquidi, polveri, vapori od altre sostanze prodotti o utilizzati dalla macchina o dal prodotto correlato.\nLe macchine o i prodotti correlati devono essere conformi, per quanto riguarda i rischi di esplosione dovuti all'utilizzo in atmosfera potenzialmente esplosiva, alla specifica normativa di armonizzazione dell'Unione.", "pages": [56, 56], "tags": ["generale"], "always": false, "standards": ["EN 1127-1:2019"]}, {"id": "MR-III-1.5.8", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.5. Rischi dovuti ad altre cause", "ref": "All. III, punto 1.5.8", "title": "Rumore", "text": "Le macchine o i prodotti correlati devono essere progettati e costruiti in modo tale che i rischi dovuti all'emissione di rumore aereo siano ridotti al livello minimo, tenuto conto del progresso tecnico e della possibilità di disporre di mezzi atti a limitare il rumore, in particolare alla fonte.\nIl livello dell'emissione di rumore può essere valutato in riferimento ai dati comparativi di emissione di macchine o prodotti correlati simili.", "pages": [56, 56], "tags": ["generale"], "always": false, "standards": ["EN ISO 11688-1:2009", "EN ISO 3744:2026", "EN ISO 3746:2010", "EN ISO 11201:2010"]}, {"id": "MR-III-1.5.9", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.5. Rischi dovuti ad altre cause", "ref": "All. III, punto 1.5.9", "title": "Vibrazioni", "text": "Le macchine o i prodotti correlati devono essere progettati e costruiti in modo tale che i rischi dovuti alle vibrazioni trasmesse dalle stesse o dagli stessi siano ridotti al livello minimo, tenuto conto del progresso tecnico e della disponibilità di mezzi atti a ridurre le vibrazioni, in particolare alla fonte.\nIl livello dell'emissione di vibrazioni può essere valutato in riferimento ai dati comparativi di emissione di macchine o prodotti correlati simili.", "pages": [56, 56], "tags": ["generale"], "always": false, "standards": ["EN 1299:1997+A1:2008", "EN ISO 20643:2008 + A1:2012", "EN 1032:2003+A1:2008"]}, {"id": "MR-III-1.5.10", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.5. Rischi dovuti ad altre cause", "ref": "All. III, punto 1.5.10", "title": "Radiazione", "text": "Le emissioni indesiderabili di radiazioni da parte delle macchine o dei prodotti correlati devono essere eliminate o ridotte a livelli che non producono effetti negativi sulle persone. Ogni emissione di radiazioni ionizzanti funzionali deve essere ridotta al livello minimo sufficiente per il corretto funzionamento della macchina o del prodotto correlato durante la regolazione, il funzionamento e la pulizia. Qualora sussistano rischi si devono prendere le necessarie misure di protezione. Ogni emissione di radiazioni non ionizzanti funzionali durante la regolazione, il funzionamento e la pulizia deve essere ridotta a livelli che non producono effetti negativi sulle persone.", "pages": [57, 57], "tags": ["generale"], "always": false, "standards": ["EN 12198-1:2000+A1:2008", "EN 12198-2:2002+A1:2008", "EN 12198-3:2002+A1:2008"]}, {"id": "MR-III-1.5.11", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.5. Rischi dovuti ad altre cause", "ref": "All. III, punto 1.5.11", "title": "Radiazioni esterne", "text": "Le macchine o i prodotti correlati devono essere progettati e costruiti in modo tale che il loro funzionamento non sia perturbato dalle radiazioni esterne.", "pages": [57, 57], "tags": ["generale"], "always": false, "standards": []}, {"id": "MR-III-1.5.12", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.5. Rischi dovuti ad altre cause", "ref": "All. III, punto 1.5.12", "title": "Radiazioni laser", "text": "In caso di impiego di dispositivi laser, deve essere preso in considerazione quanto segue:\na) i dispositivi laser montati su macchine o su prodotti correlati devono essere progettati e costruiti in modo da evitare qualsiasi radiazione involontaria;\nb) i dispositivi laser montati su macchine o su prodotti correlati devono essere protetti in modo tale che né le radiazioni utili, né le radiazioni prodotte da riflessione o da diffusione e le radiazioni secondarie possano nuocere alla salute;\nc) i dispositivi ottici per l'osservazione o la regolazione di dispositivi laser montati su macchine o su prodotti correlati devono essere tali che le radiazioni laser non creino alcun rischio per la salute.", "pages": [57, 57], "tags": ["generale"], "always": false, "standards": ["EN ISO 11553-1:2020 + A11:2020", "EN ISO 11553-2:2008"]}, {"id": "MR-III-1.5.13", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.5. Rischi dovuti ad altre cause", "ref": "All. III, punto 1.5.13", "title": "Emissioni di materie e sostanze pericolose", "text": "Le macchine o i prodotti correlati devono essere progettati e costruiti in modo tale da evitare i rischi di inalazione, ingestione, contatto con la pelle, gli occhi e le mucose e di penetrazione attraverso la pelle delle materie e sostanze pericolose prodotte. Se il pericolo non può essere eliminato, la macchina o il prodotto correlato devono essere equipaggiati in modo che le materie e sostanze pericolose possano essere contenute, captate, aspirate, precipitate mediante vaporizzazione di acqua, filtrate o trattate con un altro metodo altrettanto efficace. Qualora il processo non sia totalmente chiuso durante il normale funzionamento della macchina o del prodotto correlato, i dispositivi di contenimento, captazione, filtrazione, separazione o aspirazione devono essere situati in modo da produrre il massimo effetto.", "pages": [57, 57], "tags": ["generale"], "always": false, "standards": ["EN ISO 14123-1:2015", "EN ISO 14123-2:2015", "EN 1093-1:2008"]}, {"id": "MR-III-1.5.14", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.5. Rischi dovuti ad altre cause", "ref": "All. III, punto 1.5.14", "title": "Rischio di restare imprigionati in una macchina", "text": "Le macchine o i prodotti correlati devono essere progettati, costruiti o dotati di mezzi che consentano di evitare che una persona resti chiusa all'interno o, se ciò non fosse possibile, devono essere dotati di mezzi per chiedere aiuto.", "pages": [57, 57], "tags": ["generale"], "always": false, "standards": ["EN 547-1:1996+A1:2008"]}, {"id": "MR-III-1.5.15", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.5. Rischi dovuti ad altre cause", "ref": "All. III, punto 1.5.15", "title": "Rischio di scivolamento, inciampo o caduta", "text": "Le parti della macchina o del prodotto correlato sulle quali è previsto lo spostamento o lo stazionamento delle persone devono essere progettate e costruite in modo da evitare che esse scivolino, inciampino o cadano su tali parti o fuori di esse. Se opportuno, dette parti devono essere dotate di mezzi di presa fissi rispetto all'utilizzatore che gli consentano di mantenere la stabilità.", "pages": [57, 57], "tags": ["generale"], "always": false, "standards": ["EN ISO 14122-1:2016", "EN ISO 14122-2:2016", "EN ISO 14122-3:2016"]}, {"id": "MR-III-1.5.16", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.5. Rischi dovuti ad altre cause", "ref": "All. III, punto 1.5.16", "title": "Fulmini", "text": "Le macchine o i prodotti correlati che necessitano di protezione dagli effetti di fulmini durante l'uso devono essere equipaggiati in modo da scaricare al suolo le eventuali scariche elettriche.", "pages": [57, 57], "tags": ["generale"], "always": false, "standards": ["EN 62305 (serie)"]}, {"id": "MR-III-1.6.1", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.6. Manutenzione", "ref": "All. III, punto 1.6.1", "title": "Manutenzione delle macchine o dei prodotti correlati", "text": "I punti di regolazione e di manutenzione devono essere situati fuori dalle zone pericolose. Gli interventi di regolazione, di manutenzione, di riparazione e di pulizia devono poter essere eseguiti quando la macchina o il prodotto correlato sono fermi.\nSe per motivi tecnici non è possibile soddisfare una delle precedenti condizioni, devono essere adottate misure per garantire che dette operazioni possano essere eseguite in condizioni di sicurezza (cfr. punto 1.2.5).\nPer le macchine automatizzate e, se del caso, per altre macchine o altri prodotti correlati, deve essere previsto un dispositivo di connessione che consenta di montare un dispositivo di diagnosi di ricerca delle avarie.\nGli elementi delle macchine automatizzate o dei prodotti correlati che devono essere sostituiti frequentemente devono essere facilmente smontabili e rimontabili in condizioni di sicurezza. L'accesso a tali elementi deve consentire di svolgere questi compiti con i mezzi tecnici necessari secondo il metodo operativo previsto.", "pages": [57, 58], "tags": ["generale"], "always": false, "standards": ["EN ISO 14118:2018", "EN ISO 14122-1:2016"]}, {"id": "MR-III-1.6.2", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.6. Manutenzione", "ref": "All. III, punto 1.6.2", "title": "Accesso alle postazioni di lavoro e ai punti d'intervento utilizzati per la manutenzione", "text": "Le macchine o i prodotti correlati devono essere progettati e costruiti in modo da permettere l'accesso in condizioni di sicurezza a tutte le zone in cui è necessario intervenire durante il funzionamento, la regolazione e la manutenzione della macchina o del prodotto correlato.\nNel caso di macchine o di prodotti correlati nei quali le persone devono entrare per azionarli, effettuarne la regolazione, la manutenzione o la pulizia, gli accessi a tali macchine o prodotti correlati devono essere dimensionati e adattati per l'uso di attrezzature di soccorso in modo tale da rendere possibile un soccorso di emergenza alle persone.", "pages": [58, 58], "tags": ["generale"], "always": false, "standards": ["EN ISO 14122-1:2016", "EN ISO 14122-2:2016", "EN ISO 14122-3:2016", "EN ISO 14122-4:2016"]}, {"id": "MR-III-1.6.3", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.6. Manutenzione", "ref": "All. III, punto 1.6.3", "title": "Isolamento dalle fonti di energia", "text": "Le macchine o i prodotti correlati devono essere muniti di dispositivi che consentono di isolarli da ciascuna delle loro fonti di energia. Tali dispositivi devono essere identificati chiaramente. Essi devono poter essere bloccati, qualora la riconnessione possa rappresentare un pericolo per le persone. I dispositivi devono inoltre poter essere bloccati nel caso in cui l'operatore non possa verificare l'effettivo costante isolamento da tutte le posizioni cui ha accesso.\nNel caso di macchine o di prodotti correlati che possono essere alimentati ad energia elettrica mediante una spina ad innesto, è sufficiente la rimozione della spina, qualora l'operatore possa verificare da tutte le posizioni cui ha accesso, che la spina resti disinserita.\nL'eventuale energia residua o immagazzinata dopo l'isolamento della macchina o del prodotto correlato deve poter essere dissipata senza rischio per le persone.\nIn deroga al requisito dei commi precedenti, taluni circuiti possono non essere separati dalla loro fonte di energia onde consentire, ad esempio, il supporto di pezzi, la tutela di informazioni, l'illuminazione delle parti interne, ecc. In questo caso devono essere adottate misure particolari per garantire la sicurezza degli operatori.", "pages": [58, 58], "tags": ["generale"], "always": false, "standards": ["EN ISO 14118:2018", "EN 60204-1:2018", "EN ISO 4413:2010", "EN ISO 4414:2010"]}, {"id": "MR-III-1.6.4", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.6. Manutenzione", "ref": "All. III, punto 1.6.4", "title": "Intervento dell'operatore", "text": "La macchina o il prodotto correlato devono essere progettati, costruiti ed equipaggiati in modo tale da limitare la necessità d'intervento dell’operatore. L'intervento di un operatore, ogniqualvolta non possa essere evitato, deve poter essere effettuato facilmente e in condizioni di sicurezza.", "pages": [58, 58], "tags": ["generale"], "always": false, "standards": ["EN 614-1:2006+A1:2009"]}, {"id": "MR-III-1.6.5", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.6. Manutenzione", "ref": "All. III, punto 1.6.5", "title": "Pulizia delle parti interne", "text": "La macchina o il prodotto correlato devono essere progettati e costruiti in modo che la pulizia delle parti interne che hanno contenuto sostanze o miscele pericolose sia possibile senza penetrare in tali parti interne; anche un eventuale svuotamento completo deve poter essere compiuto dall'esterno. Se è impossibile evitare di penetrarvi, la macchina o il prodotto correlato devono essere progettati e costruiti in modo da consentire di effettuare la pulizia in condizioni di sicurezza.", "pages": [58, 58], "tags": ["generale"], "always": false, "standards": []}, {"id": "MR-III-1.7.1", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.7. Informazioni", "ref": "All. III, punto 1.7.1", "title": "Informazioni e avvertenze sulla macchina o sul prodotto correlato", "text": "Le informazioni e le avvertenze sulla macchina o sul prodotto correlato dovrebbero essere fornite preferibilmente in forma di simboli o pittogrammi facilmente comprensibili.\nLe informazioni e le avvertenze scritte o verbali devono essere espresse in una lingua stabilita dallo Stato membro interessato, facilmente comprensibile dagli utilizzatori finali.", "pages": [58, 58], "tags": ["generale"], "always": false, "standards": ["EN 61310-1:2008", "EN 894-2:1997+A1:2008"]}, {"id": "MR-III-1.7.1.1", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.7. Informazioni", "ref": "All. III, punto 1.7.1.1", "title": "Informazioni e dispositivi di informazione", "text": "Le informazioni necessarie alla guida di una macchina o di un prodotto correlato devono essere fornite in forma chiara e facilmente comprensibile. Non devono essere in quantità tale da sovraccaricare l'operatore.\nLe unità di visualizzazione o qualsiasi altro mezzo di comunicazione interattiva tra l'operatore e la macchina o il prodotto correlato devono essere di facile comprensione e impiego.", "pages": [59, 59], "tags": ["generale"], "always": false, "standards": ["EN 61310-1:2008", "EN 894-2:1997+A1:2008", "EN ISO 9241-110:2020"]}, {"id": "MR-III-1.7.1.2", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.7. Informazioni", "ref": "All. III, punto 1.7.1.2", "title": "Dispositivi di allarme", "text": "Quando la sicurezza e la salute delle persone possono essere messe in pericolo da un'avaria nel funzionamento di una macchina o di un prodotto correlato non sorvegliati, tale macchina o prodotto correlato devono essere attrezzati in modo da emettere un segnale di avvertenza sonoro o luminoso adeguato.\nSe la macchina o il prodotto correlato sono muniti di dispositivi di avvertenza, questi ultimi devono poter essere compresi senza ambiguità e facilmente percepiti. Devono essere adottate misure opportune per consentire all'operatore di verificare la costante efficienza di tali dispositivi di avvertenza.\nDevono essere applicate le disposizioni degli atti giuridici specifici dell'Unione concernenti i colori e i segnali di sicurezza.", "pages": [59, 59], "tags": ["generale"], "always": false, "standards": ["EN 981:1996+A1:2008", "EN 842:1996+A1:2008", "EN ISO 7731:2008", "EN 61310-1:2008"]}, {"id": "MR-III-1.7.2", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.7. Informazioni", "ref": "All. III, punto 1.7.2", "title": "Avvertenze in merito ai rischi residui", "text": "Nel caso in cui permangano dei rischi, malgrado siano state adottate le misure di protezione integrate nella progettazione, le protezioni e le misure di protezione complementari, devono essere previste le necessarie avvertenze, compresi i dispositivi di avvertenza.", "pages": [59, 59], "tags": ["generale"], "always": false, "standards": ["EN ISO 7010:2020", "ISO 3864-2:2016", "EN 61310-1:2008"]}, {"id": "MR-III-1.7.3-c1", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.7. Informazioni", "ref": "All. III, punto 1.7.3, comma 1", "title": "Marcatura delle macchine o dei prodotti correlati — comma 1", "text": "Oltre ai requisiti di marcatura di cui agli articoli 10 e 24, le macchine o i prodotti correlati devono recare una marcatura visibile, leggibile e indelebile.", "pages": [59, 59], "tags": ["generale"], "always": true, "standards": ["EN 61310-2:2008", "EN 60204-1:2018"]}, {"id": "MR-III-1.7.3-c2", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.7. Informazioni", "ref": "All. III, punto 1.7.3, comma 2", "title": "Marcatura delle macchine o dei prodotti correlati — comma 2", "text": "Le macchine o i prodotti correlati di cui ai capi da 2 a 6 del presente allegato devono recare una marcatura conforme ai requisiti supplementari indicati in tali capi.", "pages": [59, 59], "tags": ["generale"], "always": true, "standards": ["EN 61310-2:2008", "EN 60204-1:2018"]}, {"id": "MR-III-1.7.3-c3", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.7. Informazioni", "ref": "All. III, punto 1.7.3, comma 3", "title": "Marcatura delle macchine o dei prodotti correlati — comma 3", "text": "Inoltre la macchina o un prodotto correlato progettati e costruiti per l'utilizzo in atmosfera esplosiva devono recare l'apposita marcatura.", "pages": [59, 59], "tags": ["generale"], "always": true, "standards": ["EN 61310-2:2008", "EN 60204-1:2018"]}, {"id": "MR-III-1.7.3-c4", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.7. Informazioni", "ref": "All. III, punto 1.7.3, comma 4", "title": "Marcatura delle macchine o dei prodotti correlati — comma 4", "text": "Le macchine o i prodotti correlati devono altresì recare indicazioni complete riguardanti il proprio tipo, nonché le indicazioni indispensabili alla sicurezza di utilizzo. Tali informazioni sono soggette ai requisiti di cui al punto 1.7.1.", "pages": [59, 59], "tags": ["generale"], "always": true, "standards": ["EN 61310-2:2008", "EN 60204-1:2018"]}, {"id": "MR-III-1.7.3-c5", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.7. Informazioni", "ref": "All. III, punto 1.7.3, comma 5", "title": "Marcatura delle macchine o dei prodotti correlati — comma 5", "text": "Se un elemento della macchina o di un prodotto correlato deve essere movimentato durante l'utilizzazione con mezzi di sollevamento, la sua massa deve essere indicata in modo leggibile, indelebile e non ambiguo.", "pages": [59, 59], "tags": ["generale"], "always": true, "standards": ["EN 61310-2:2008", "EN 60204-1:2018"]}, {"id": "MR-III-1.7.4", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.7. Informazioni", "ref": "All. III, punto 1.7.4", "title": "Istruzioni per l'uso", "text": "In aggiunta agli obblighi di cui all'articolo 10, paragrafo 7, le istruzioni per l'uso sono redatte come segue.\nIn deroga all'articolo 10, paragrafo 7, le istruzioni per la manutenzione destinate ad essere usate da personale specializzato incaricato dal fabbricante o dal suo mandatario possono essere fornite in una sola lingua ufficiale dell'Unione compresa da detto personale.", "pages": [59, 59], "tags": ["generale"], "always": true, "standards": ["EN ISO 20607:2019", "EN IEC 82079-1:2020"]}, {"id": "MR-III-1.7.4.1", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.7. Informazioni", "ref": "All. III, punto 1.7.4.1", "title": "Principi generali di redazione delle istruzioni per l'uso", "text": "a) Il contenuto delle istruzioni per l'uso non deve riguardare soltanto l'uso previsto della macchina o del prodotto correlato, ma deve tener conto anche dell'uso scorretto ragionevolmente prevedibile.\nb) In caso di macchine o di prodotti correlati destinati all'utilizzazione da parte di operatori non professionali, la redazione e la presentazione delle istruzioni per l'uso devono tenere conto del livello di formazione generale e della perspicacia che ci si può ragionevolmente aspettare da tali operatori.", "pages": [59, 59], "tags": ["generale"], "always": true, "standards": ["EN ISO 20607:2019", "EN IEC 82079-1:2020"]}, {"id": "MR-III-1.7.4.2-a", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.7. Informazioni", "ref": "All. III, punto 1.7.4.2, lettera a)", "title": "Contenuto delle istruzioni per l'uso — lett. a)", "text": "1. Le istruzioni per l'uso devono contenere, se del caso, almeno le informazioni seguenti:\na) la ragione sociale e l’indirizzo completo del fabbricante e, se del caso, del suo mandatario;", "pages": [60, 60], "tags": ["generale"], "always": true, "standards": ["EN ISO 20607:2019", "EN IEC 82079-1:2020"]}, {"id": "MR-III-1.7.4.2-b", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.7. Informazioni", "ref": "All. III, punto 1.7.4.2, lettera b)", "title": "Contenuto delle istruzioni per l'uso — lett. b)", "text": "1. Le istruzioni per l'uso devono contenere, se del caso, almeno le informazioni seguenti:\nb) la designazione della macchina o del prodotto correlato, come indicato sulla macchina stessa o sul prodotto correlato stesso, eccetto il numero di serie (cfr. punto 1.7.3);", "pages": [60, 60], "tags": ["generale"], "always": true, "standards": ["EN ISO 20607:2019", "EN IEC 82079-1:2020"]}, {"id": "MR-III-1.7.4.2-c", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.7. Informazioni", "ref": "All. III, punto 1.7.4.2, lettera c)", "title": "Contenuto delle istruzioni per l'uso — lett. c)", "text": "1. Le istruzioni per l'uso devono contenere, se del caso, almeno le informazioni seguenti:\nc) la dichiarazione di conformità UE o l'indirizzo internet o il codice ottico dove è possibile accedere alla dichiarazione di conformità UE, conformemente all'articolo 10, paragrafo 8;", "pages": [60, 60], "tags": ["generale"], "always": true, "standards": ["EN ISO 20607:2019", "EN IEC 82079-1:2020"]}, {"id": "MR-III-1.7.4.2-d", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.7. Informazioni", "ref": "All. III, punto 1.7.4.2, lettera d)", "title": "Contenuto delle istruzioni per l'uso — lett. d)", "text": "1. Le istruzioni per l'uso devono contenere, se del caso, almeno le informazioni seguenti:\nd) una descrizione generale della macchina o del prodotto correlato;", "pages": [60, 60], "tags": ["generale"], "always": true, "standards": ["EN ISO 20607:2019", "EN IEC 82079-1:2020"]}, {"id": "MR-III-1.7.4.2-e", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.7. Informazioni", "ref": "All. III, punto 1.7.4.2, lettera e)", "title": "Contenuto delle istruzioni per l'uso — lett. e)", "text": "1. Le istruzioni per l'uso devono contenere, se del caso, almeno le informazioni seguenti:\ne) i disegni, i diagrammi, le descrizioni e le spiegazioni necessari per l'uso, la manutenzione e la riparazione della macchina o del prodotto correlato e per verificarne il corretto funzionamento;", "pages": [60, 60], "tags": ["generale"], "always": true, "standards": ["EN ISO 20607:2019", "EN IEC 82079-1:2020"]}, {"id": "MR-III-1.7.4.2-f", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.7. Informazioni", "ref": "All. III, punto 1.7.4.2, lettera f)", "title": "Contenuto delle istruzioni per l'uso — lett. f)", "text": "1. Le istruzioni per l'uso devono contenere, se del caso, almeno le informazioni seguenti:\nf) una descrizione della o delle postazioni di lavoro che possono essere occupate dagli operatori;", "pages": [60, 60], "tags": ["generale"], "always": true, "standards": ["EN ISO 20607:2019", "EN IEC 82079-1:2020"]}, {"id": "MR-III-1.7.4.2-g", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.7. Informazioni", "ref": "All. III, punto 1.7.4.2, lettera g)", "title": "Contenuto delle istruzioni per l'uso — lett. g)", "text": "1. Le istruzioni per l'uso devono contenere, se del caso, almeno le informazioni seguenti:\ng) una descrizione dell'uso previsto della macchina o del prodotto correlato;", "pages": [60, 60], "tags": ["generale"], "always": true, "standards": ["EN ISO 20607:2019", "EN IEC 82079-1:2020"]}, {"id": "MR-III-1.7.4.2-h", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.7. Informazioni", "ref": "All. III, punto 1.7.4.2, lettera h)", "title": "Contenuto delle istruzioni per l'uso — lett. h)", "text": "1. Le istruzioni per l'uso devono contenere, se del caso, almeno le informazioni seguenti:\nh) le avvertenze concernenti i modi nei quali la macchina o il prodotto correlato non devono essere usati e che potrebbero, in base all'esperienza, presentarsi;", "pages": [60, 60], "tags": ["generale"], "always": true, "standards": ["EN ISO 20607:2019", "EN IEC 82079-1:2020"]}, {"id": "MR-III-1.7.4.2-i", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.7. Informazioni", "ref": "All. III, punto 1.7.4.2, lettera i)", "title": "Contenuto delle istruzioni per l'uso — lett. i)", "text": "1. Le istruzioni per l'uso devono contenere, se del caso, almeno le informazioni seguenti:\ni) le istruzioni per il montaggio, l'installazione e il collegamento, inclusi i disegni e i diagrammi e i sistemi di fissaggio e la designazione del telaio o dell'installazione su cui la macchina o il prodotto correlato devono essere montati;", "pages": [60, 60], "tags": ["generale"], "always": true, "standards": ["EN ISO 20607:2019", "EN IEC 82079-1:2020"]}, {"id": "MR-III-1.7.4.2-j", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.7. Informazioni", "ref": "All. III, punto 1.7.4.2, lettera j)", "title": "Contenuto delle istruzioni per l'uso — lett. j)", "text": "1. Le istruzioni per l'uso devono contenere, se del caso, almeno le informazioni seguenti:\nj) le istruzioni per l'installazione e il montaggio volte a ridurre il rumore e le vibrazioni prodotti;", "pages": [60, 60], "tags": ["generale"], "always": true, "standards": ["EN ISO 20607:2019", "EN IEC 82079-1:2020"]}, {"id": "MR-III-1.7.4.2-k", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.7. Informazioni", "ref": "All. III, punto 1.7.4.2, lettera k)", "title": "Contenuto delle istruzioni per l'uso — lett. k)", "text": "1. Le istruzioni per l'uso devono contenere, se del caso, almeno le informazioni seguenti:\nk) le istruzioni per la messa in servizio e l'uso della macchina o del prodotto correlato e, se necessario, le istruzioni per la formazione degli operatori;", "pages": [60, 60], "tags": ["generale"], "always": true, "standards": ["EN ISO 20607:2019", "EN IEC 82079-1:2020"]}, {"id": "MR-III-1.7.4.2-l", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.7. Informazioni", "ref": "All. III, punto 1.7.4.2, lettera l)", "title": "Contenuto delle istruzioni per l'uso — lett. l)", "text": "1. Le istruzioni per l'uso devono contenere, se del caso, almeno le informazioni seguenti:\nl) le informazioni in merito ai rischi residui che permangono, malgrado siano state adottate le misure di protezione integrate nella progettazione e malgrado le protezioni e le misure di protezione complementari adottate;", "pages": [60, 60], "tags": ["generale"], "always": true, "standards": ["EN ISO 20607:2019", "EN IEC 82079-1:2020"]}, {"id": "MR-III-1.7.4.2-m", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.7. Informazioni", "ref": "All. III, punto 1.7.4.2, lettera m)", "title": "Contenuto delle istruzioni per l'uso — lett. m)", "text": "1. Le istruzioni per l'uso devono contenere, se del caso, almeno le informazioni seguenti:\nm) le istruzioni sulle misure di protezione che devono essere adottate dall'utilizzatore, incluse, se del caso, le attrezzature di protezione individuale che devono essere fornite;", "pages": [60, 60], "tags": ["generale"], "always": true, "standards": ["EN ISO 20607:2019", "EN IEC 82079-1:2020"]}, {"id": "MR-III-1.7.4.2-n", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.7. Informazioni", "ref": "All. III, punto 1.7.4.2, lettera n)", "title": "Contenuto delle istruzioni per l'uso — lett. n)", "text": "1. Le istruzioni per l'uso devono contenere, se del caso, almeno le informazioni seguenti:\nn) le caratteristiche essenziali degli utensili che possono essere montati sulla macchina o sul prodotto correlato;", "pages": [60, 60], "tags": ["generale"], "always": true, "standards": ["EN ISO 20607:2019", "EN IEC 82079-1:2020"]}, {"id": "MR-III-1.7.4.2-o", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.7. Informazioni", "ref": "All. III, punto 1.7.4.2, lettera o)", "title": "Contenuto delle istruzioni per l'uso — lett. o)", "text": "1. Le istruzioni per l'uso devono contenere, se del caso, almeno le informazioni seguenti:\no) le condizioni in cui la macchina o il prodotto correlato soddisfano i requisiti di stabilità durante l'utilizzo, il trasporto, il montaggio, lo smontaggio, in condizioni di fuori servizio, durante le prove o le avarie prevedibili;", "pages": [60, 60], "tags": ["generale"], "always": true, "standards": ["EN ISO 20607:2019", "EN IEC 82079-1:2020"]}, {"id": "MR-III-1.7.4.2-p", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.7. Informazioni", "ref": "All. III, punto 1.7.4.2, lettera p)", "title": "Contenuto delle istruzioni per l'uso — lett. p)", "text": "1. Le istruzioni per l'uso devono contenere, se del caso, almeno le informazioni seguenti:\np) le istruzioni per effettuare in condizioni di sicurezza le operazioni di trasporto, movimentazione e stoccaggio, indicanti la massa della macchina o del prodotto correlato nonché dei suoi vari elementi allorché devono essere regolarmente trasportati separatamente;", "pages": [60, 60], "tags": ["generale"], "always": true, "standards": ["EN ISO 20607:2019", "EN IEC 82079-1:2020"]}, {"id": "MR-III-1.7.4.2-q", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.7. Informazioni", "ref": "All. III, punto 1.7.4.2, lettera q)", "title": "Contenuto delle istruzioni per l'uso — lett. q)", "text": "1. Le istruzioni per l'uso devono contenere, se del caso, almeno le informazioni seguenti:\nq) il protocollo operativo da rispettare in caso di infortunio o avaria; se si può verificare un blocco, il metodo operativo da rispettare per permettere di sbloccare la macchina in condizioni di sicurezza;", "pages": [60, 60], "tags": ["generale"], "always": true, "standards": ["EN ISO 20607:2019", "EN IEC 82079-1:2020"]}, {"id": "MR-III-1.7.4.2-r", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.7. Informazioni", "ref": "All. III, punto 1.7.4.2, lettera r)", "title": "Contenuto delle istruzioni per l'uso — lett. r)", "text": "1. Le istruzioni per l'uso devono contenere, se del caso, almeno le informazioni seguenti:\nr) la descrizione delle operazioni di regolazione e manutenzione che devono essere effettuate dall'utilizzatore nonché le misure di manutenzione preventiva da rispettare tenendo conto della progettazione e dell'utilizzo della macchina o del prodotto correlato;", "pages": [60, 60], "tags": ["generale"], "always": true, "standards": ["EN ISO 20607:2019", "EN IEC 82079-1:2020"]}, {"id": "MR-III-1.7.4.2-s", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.7. Informazioni", "ref": "All. III, punto 1.7.4.2, lettera s)", "title": "Contenuto delle istruzioni per l'uso — lett. s)", "text": "1. Le istruzioni per l'uso devono contenere, se del caso, almeno le informazioni seguenti:\ns) le istruzioni per effettuare in condizioni di sicurezza la regolazione e la manutenzione, incluse le misure di protezione che dovrebbero essere adottate durante tali operazioni;", "pages": [60, 60], "tags": ["generale"], "always": true, "standards": ["EN ISO 20607:2019", "EN IEC 82079-1:2020"]}, {"id": "MR-III-1.7.4.2-t", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.7. Informazioni", "ref": "All. III, punto 1.7.4.2, lettera t)", "title": "Contenuto delle istruzioni per l'uso — lett. t)", "text": "1. Le istruzioni per l'uso devono contenere, se del caso, almeno le informazioni seguenti:\nt) le specifiche dei pezzi di ricambio da utilizzare, se incidono sulla salute e la sicurezza degli operatori;", "pages": [60, 60], "tags": ["generale"], "always": true, "standards": ["EN ISO 20607:2019", "EN IEC 82079-1:2020"]}, {"id": "MR-III-1.7.4.2-u", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.7. Informazioni", "ref": "All. III, punto 1.7.4.2, lettera u)", "title": "Contenuto delle istruzioni per l'uso — lett. u)", "text": "1. Le istruzioni per l'uso devono contenere, se del caso, almeno le informazioni seguenti:\nu) le informazioni seguenti relative all'emissione di rumore aereo:\ni) il livello di pressione acustica dell'emissione ponderato A nelle postazioni di lavoro, se supera 70 dB (A); se tale livello non supera 70 dB (A), deve essere indicato;\nii) il valore massimo della pressione acustica istantanea ponderata C nelle postazioni di lavoro, se supera 63 Pa (130 dB rispetto a 20 μPa),\niii) il livello di potenza acustica ponderato A emesso dalla macchina o dal prodotto correlato, se il livello di pressione acustica dell'emissione ponderato A nelle postazioni di lavoro supera 80 dB (A). I suddetti valori devono essere quelli misurati effettivamente sulla macchina o sul prodotto correlato in questione, oppure quelli stabiliti sulla base di misurazioni effettuate su una macchina o un prodotto correlato tecnicamente comparabili rappresentativi della macchina o del prodotto correlato da produrre. Quando si tratta di una macchina o di un prodotto correlato di grandissime dimensioni, invece del livello di potenza acustica ponderato A possono essere indicati livelli di pressione acustica dell'emissione ponderati A in appositi punti intorno alla macchina o al prodotto correlato. Qualora non possano essere applicate le norme armonizzate o le specifiche comuni adottate dalla Commissione conformemente all'articolo 20, paragrafo 3, i dati acustici devono essere misurati usando il codice di misurazione più appropriato adeguato alla macchina o al prodotto correlato. Ogniqualvolta sono indicati i valori dell'emissione acustica, devono essere specificate le incertezze relative a tali valori. Devono essere descritte le condizioni di funzionamento della macchina o del prodotto correlato durante la misurazione e i metodi utilizzati per effettuarla. Se la postazione o le postazioni di lavoro non sono o non possono essere definite, i livelli di pressione acustica ponderati A devono essere misurati a 1 m dalla superficie della macchina o del prodotto correlato e a 1,60 m di altezza dal suolo o dalla piattaforma di accesso. Devono essere indicati la posizione e il valore della pressione acustica massima. Per quanto concerne le macchine o i prodotti correlati atti a ridurre il rumore, le istruzioni per l’uso devono specificare, se del caso, le modalità per montare e installare correttamente tali dispositivi (cfr. anche il punto 1.7.4.2, punto 1, lettera j)). Qualora atti giuridici specifici dell'Unione stabiliscano altre indicazioni per la misurazione del livello di pressione acustica o del livello di potenza acustica, tali atti giuridici si applicano e non si applicano le prescrizioni corrispondenti del presente punto;", "pages": [61, 61], "tags": ["generale"], "always": true, "standards": ["EN ISO 20607:2019", "EN IEC 82079-1:2020", "EN ISO 4871:2009", "EN ISO 3744:2026"]}, {"id": "MR-III-1.7.4.2-v", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.7. Informazioni", "ref": "All. III, punto 1.7.4.2, lettera v)", "title": "Contenuto delle istruzioni per l'uso — lett. v)", "text": "1. Le istruzioni per l'uso devono contenere, se del caso, almeno le informazioni seguenti:\nv) le informazioni sulle precauzioni, sui dispositivi e sui mezzi necessari per soccorrere immediatamente e con cautela le persone;", "pages": [61, 61], "tags": ["generale"], "always": true, "standards": ["EN ISO 20607:2019", "EN IEC 82079-1:2020"]}, {"id": "MR-III-1.7.4.2-w", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.7. Informazioni", "ref": "All. III, punto 1.7.4.2, lettera w)", "title": "Contenuto delle istruzioni per l'uso — lett. w)", "text": "1. Le istruzioni per l'uso devono contenere, se del caso, almeno le informazioni seguenti:\nw) se le macchine o i prodotti correlati possono emettere radiazioni non ionizzanti che potrebbero nuocere alle persone, in particolare se portatrici di dispositivi medici impiantabili attivi o non attivi, le informazioni riguardanti le radiazioni emesse per l'operatore e le persone esposte;", "pages": [61, 61], "tags": ["generale"], "always": true, "standards": ["EN ISO 20607:2019", "EN IEC 82079-1:2020"]}, {"id": "MR-III-1.7.4.2-x", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.7. Informazioni", "ref": "All. III, punto 1.7.4.2, lettera x)", "title": "Contenuto delle istruzioni per l'uso — lett. x)", "text": "1. Le istruzioni per l'uso devono contenere, se del caso, almeno le informazioni seguenti:\nx) se la progettazione delle macchine o dei prodotti correlati consente emissioni di sostanze pericolose dalla macchina o dal prodotto correlato, le caratteristiche del dispositivo di captazione, filtrazione o scarico, qualora tale dispositivo non sia fornito con la macchina o il prodotto correlato, nonché una qualsiasi delle informazioni seguenti:\ni) la portata per l'emissione di sostanze e materiali pericolosi dalla macchina o dal prodotto correlato;\nii) la concentrazione di sostanze e materiali pericolosi attorno alla macchina o al prodotto correlato provenienti da questi ultimi o da materiali o sostanze utilizzati con la macchina o il prodotto correlato;\niii) l'efficacia del dispositivo di captazione o filtrazione e le condizioni da rispettare per preservarne l'efficacia nel tempo. I valori di cui al primo comma devono essere misurati effettivamente per la macchina o il prodotto correlato in questione oppure stabiliti in base a misure relative a una unità di macchina o prodotto correlato tecnicamente comparabile, rappresentativa dello stato dell'arte.", "pages": [61, 61], "tags": ["generale"], "always": true, "standards": ["EN ISO 20607:2019", "EN IEC 82079-1:2020", "EN ISO 14123-1:2015"]}, {"id": "MR-III-1.7.5", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.7. Informazioni", "ref": "All. III, punto 1.7.5", "title": "Pubblicazioni illustrative o promozionali", "text": "Le pubblicazioni illustrative o promozionali che descrivono la macchina o il prodotto correlato non possono essere in contraddizione con le istruzioni per l'uso per quanto concerne gli aspetti relativi alla salute e alla sicurezza. Le pubblicazioni illustrative o promozionali che descrivono le caratteristiche delle prestazioni della macchina o del prodotto correlato devono contenere le stesse informazioni delle istruzioni per l'uso per quanto concerne le emissioni.", "pages": [62, 62], "tags": ["generale"], "always": false, "standards": ["EN ISO 20607:2019"]}, {"id": "MR-III-2.1.1", "law": "MR", "section": "MR-III", "group": "Allegato III — 2.1. Macchine e prodotti correlati alimentari e macchine e prodotti correlati per prodotti cosmetici o farmaceutici", "ref": "All. III, punto 2.1.1", "title": "Considerazioni generali", "text": "Le macchine o i prodotti correlati destinati ad essere utilizzati per prodotti alimentari o per prodotti cosmetici o farmaceutici devono essere progettati e costruiti in modo da evitare qualsiasi rischio di infezione, di malattia e di contagio.\nDevono essere rispettati i requisiti seguenti:\na) i materiali a contatto o che possono venire a contatto con prodotti alimentari, acque destinate al consumo umano o prodotti cosmetici o farmaceutici devono soddisfare le condizioni stabilite nei pertinenti agli atti giuridici dell'Unione; la macchina o il prodotto correlato devono essere progettati e costruiti in modo tale che detti materiali possano essere puliti prima di ogni utilizzazione e, se ciò non è possibile, devono essere utilizzati elementi monouso;\nb) tutte le superfici a contatto con i prodotti alimentari, le acque destinate al consumo umano o i prodotti cosmetici o farmaceutici ad eccezione di quelle degli elementi monouso devono:\ni) essere lisce e prive di rugosità o spazi in cui possono fermarsi materie organiche; lo stesso requisito va rispettato per i collegamenti fra le superfici;\nii) essere progettate e costruite in modo da ridurre al minimo le sporgenze, i bordi e gli angoli;\niii) poter essere pulite e disinfettate facilmente, se del caso, dopo aver asportato le parti facilmente smontabili; gli angoli interni devono essere raccordati con raggi tali da consentire una pulizia completa;\nc) i liquidi e i gas aerosol provenienti da prodotti alimentari, cosmetici o farmaceutici e dai prodotti di pulizia, di disinfezione e di risciacquatura devono poter defluire completamente verso l'esterno della macchina o del prodotto correlato (se possibile in una posizione «pulizia»);\nd) le macchine o i prodotti correlati devono essere progettati e costruiti al fine di evitare l'ingresso di sostanze o di esseri viventi, in particolare insetti, o accumuli di materie organiche, in zone impossibili da pulire;\ne) le macchine o i prodotti correlati devono essere progettati e costruiti in modo che i prodotti ausiliari pericolosi per la salute, inclusi i lubrificanti, non possano entrare in contatto con i prodotti alimentari o l’acqua destinata al consumo umano, cosmetici o farmaceutici. All'occorrenza, la macchina o i prodotti correlati devono essere progettati e costruiti per permettere di verificare regolarmente il rispetto di tale requisito.", "pages": [62, 62], "tags": ["alimentari"], "always": false, "standards": ["EN 1672-2:2005+A1:2009", "EN ISO 14159:2008"]}, {"id": "MR-III-2.1.2", "law": "MR", "section": "MR-III", "group": "Allegato III — 2.1. Macchine e prodotti correlati alimentari e macchine e prodotti correlati per prodotti cosmetici o farmaceutici", "ref": "All. III, punto 2.1.2", "title": "Istruzioni per l'uso", "text": "Le istruzioni per l'uso delle macchine o dei prodotti correlati alimentari e delle macchine o dei prodotti correlati per prodotti cosmetici o farmaceutici devono indicare i prodotti e i metodi raccomandati per la pulizia, la disinfezione e la risciacquatura non solo delle parti facilmente accessibili ma anche delle parti alle quali è impossibile o sconsigliato accedere.", "pages": [63, 63], "tags": ["alimentari"], "always": false, "standards": ["EN 1672-2:2005+A1:2009", "EN ISO 14159:2008"]}, {"id": "MR-III-2.2.1", "law": "MR", "section": "MR-III", "group": "Allegato III — 2.2. Macchine o prodotti correlati portatili tenuti o condotti a mano", "ref": "All. III, punto 2.2.1", "title": "Considerazioni generali", "text": "Le macchine o i prodotti correlati portatili tenuti o condotti a mano devono:\na) a seconda del tipo, avere una superficie di appoggio sufficiente e disporre in numero sufficiente di mezzi di presa e di mantenimento correttamente dimensionati, sistemati in modo da garantire la stabilità della macchina o del prodotto correlato nelle condizioni di funzionamento previste;\nb) tranne quando sia tecnicamente impossibile o quando esista un dispositivo di comando indipendente, se le impugnature non possono essere abbandonate in tutta sicurezza, essere muniti di dispositivi di comando manuali per l'avviamento e l'arresto disposti in modo tale che l'operatore non debba abbandonare i mezzi di presa per azionarli;\nc) essere esenti dai rischi dovuti all'avviamento intempestivo o al mantenimento in funzione dopo che l'operatore ha abbandonato i mezzi di presa; se tale requisito non è tecnicamente realizzabile, occorre adottare misure compensative;\nd) consentire, all'occorrenza, l'osservazione visiva delle zone pericolose e dell'azione dell'utensile sul materiale lavorato;\ne) disporre di un dispositivo o un sistema di scarico correlato, con una presa di collegamento di estrazione o un sistema equivalente per captare o ridurre le emissioni di sostanze pericolose. Il presente requisito non si applica quando comporta un nuovo pericolo o quando la funzione principale della macchina o del prodotto correlato consiste nell'applicazione di sostanze pericolose e non si applica nemmeno alle emissioni dei motori a combustione interna;\nf) essere progettati e costruiti in modo che le impugnature delle macchine o dei prodotti correlati portatili consentano un avviamento e un arresto facili e agevoli.", "pages": [63, 63], "tags": ["portatili"], "always": false, "standards": ["EN ISO 11148 (serie)", "EN 62841-1:2015 + A11:2022", "EN ISO 20643:2008 + A1:2012", "EN ISO 28927 (serie)"]}, {"id": "MR-III-2.2.1.1", "law": "MR", "section": "MR-III", "group": "Allegato III — 2.2. Macchine o prodotti correlati portatili tenuti o condotti a mano", "ref": "All. III, punto 2.2.1.1", "title": "Istruzioni per l'uso", "text": "Le istruzioni per l'uso devono fornire le indicazioni seguenti relative alle vibrazioni, espresse come accelerazione (m/s2) e trasmesse da macchine o prodotti correlati portatili tenuti o condotti a mano:\na) il valore totale delle vibrazioni continue a cui è sottoposto il sistema mano-braccio;\nb) il valore medio dell'ampiezza di picco dell'accelerazione ottenuto da vibrazioni da urti ripetuti, cui è sottoposto il sistema mano-braccio;\nc) l'incertezza di entrambe le misurazioni.\nI valori di cui al primo comma devono essere quelli misurati effettivamente per la macchina o il prodotto correlato in questione oppure quelli stabiliti in base a misure relative a una macchina o un prodotto correlato tecnicamente comparabili, rappresentativi dello stato dell'arte.\nQualora non possano essere applicate le norme armonizzate o le specifiche comuni adottate dalla Commissione conformemente all'articolo 20, paragrafo 3, i dati sulle vibrazioni devono essere misurati usando il codice di misurazione più appropriato per la macchina o al prodotto correlato.\nDevono essere specificati le condizioni di funzionamento della macchina durante la misurazione e i metodi utilizzati per effettuarla oppure il riferimento alla norma armonizzata applicata.", "pages": [63, 63], "tags": ["portatili"], "always": false, "standards": ["EN ISO 11148 (serie)", "EN 62841-1:2015 + A11:2022", "EN ISO 20643:2008 + A1:2012", "EN ISO 28927 (serie)"]}, {"id": "MR-III-2.2.2.1", "law": "MR", "section": "MR-III", "group": "Allegato III — 2.2. Macchine o prodotti correlati portatili tenuti o condotti a mano", "ref": "All. III, punto 2.2.2.1", "title": "Considerazioni generali", "text": "Le macchine o prodotti correlati portatili per il fissaggio e altre macchine o altri prodotti correlati ad impatto devono essere progettati e costruiti in modo da:\na) effettuare la trasmissione dell'energia al pezzo propulso tramite un componente intermedio che non si separa dal dispositivo;\nb) impedire l'impatto, tramite un dispositivo di consenso, se la macchina o il prodotto correlato non sono posizionati correttamente con una pressione adeguata sul materiale di base,\nc) impedire l'azionamento involontario; se del caso, per azionare l'impatto deve essere necessaria una sequenza appropriata di azioni sul dispositivo di consenso e sul dispositivo di comando;\nd) impedire l'azionamento intempestivo durante la movimentazione o in caso di urto;\ne) poter effettuare le operazioni di carico e scarico facilmente e in condizioni di sicurezza.\nSe necessario, deve essere possibile dotare il dispositivo di uno o più ripari paraschegge e i ripari appropriati devono essere forniti dal fabbricante della macchina o del prodotto correlato.", "pages": [64, 64], "tags": ["portatili"], "always": false, "standards": ["EN 15895:2025"]}, {"id": "MR-III-2.2.2.2", "law": "MR", "section": "MR-III", "group": "Allegato III — 2.2. Macchine o prodotti correlati portatili tenuti o condotti a mano", "ref": "All. III, punto 2.2.2.2", "title": "Istruzioni per l'uso", "text": "Le istruzioni per l'uso devono fornire le indicazioni necessarie riguardanti:\na) gli accessori e le attrezzature intercambiabili che possono essere impiegati con la macchina o con il prodotto correlato;\nb) gli elementi appropriati per il fissaggio o altro impatto da utilizzare con la macchina o con il prodotto correlato;\nc) se del caso, le cartucce appropriate da utilizzare.", "pages": [64, 64], "tags": ["portatili"], "always": false, "standards": ["EN 15895:2025"]}, {"id": "MR-III-2.3", "law": "MR", "section": "MR-III", "group": "Allegato III — 2. REQUISITI ESSENZIALI SUPPLEMENTARI DI SICUREZZA E DI TUTELA DELLA SALUTE PER TALUNE CATEGORIE DI MACCHINE O DI PRODOTTI CORRELATI", "ref": "All. III, punto 2.3", "title": "Macchine o prodotti correlati per la lavorazione del legno e di materie con caratteristiche fisiche", "text": "simili Le macchine o i prodotti correlati per la lavorazione del legno e di materie con caratteristiche fisiche simili devono rispettare i requisiti seguenti:\na) la macchina o il prodotto correlato devono essere progettati, costruiti o attrezzati in modo che il pezzo da lavorare possa essere posizionato e guidato in condizioni di sicurezza; quando il pezzo è tenuto manualmente su un banco di lavoro, quest'ultimo deve garantire una stabilità sufficiente durante la lavorazione e non deve ostacolare lo spostamento del pezzo;\nb) se la macchina o il prodotto correlato possono essere utilizzati in condizioni che comportano un rischio di proiezione di pezzi o loro parti, essi devono essere progettati, costruiti o attrezzati in modo da impedire tale proiezione o, qualora ciò non sia possibile, in modo che la proiezione non produca danni per l'operatore e/o le persone esposte;\nc) la macchina o il prodotto correlato devono essere equipaggiati di freno automatico che arresti l'utensile in tempo sufficientemente breve in caso di rischio di contatto con l'utensile in fase di rallentamento;\nd) quando l'utensile è integrato in una macchina non completamente automatizzata o in un prodotto correlato non completamente automatizzato, tale macchina o prodotto correlato devono essere progettati e costruiti in modo tale da eliminare o ridurre i rischi di infortuni alle persone.", "pages": [64, 64], "tags": ["legno"], "always": false, "standards": ["EN ISO 19085-1:2021"]}, {"id": "MR-III-2.4.2", "law": "MR", "section": "MR-III", "group": "Allegato III — 2.4. Macchine o prodotti correlati per l'applicazione di prodotti fitosanitari", "ref": "All. III, punto 2.4.2", "title": "Considerazioni generali", "text": "Il fabbricante di una macchina o di prodotti correlati per l'applicazione di prodotti fitosanitari deve garantire che sia effettuata una valutazione del rischio di esposizione non intenzionale dell'ambiente ai prodotti fitosanitari, in conformità della procedura di valutazione del rischio e di riduzione del rischio di cui ai Principi generali, punto 1.\nLe macchine o i prodotti correlati per l'applicazione di prodotti fitosanitari devono essere progettati e costruiti tenendo in considerazione i risultati della valutazione del rischio di cui al primo comma in modo da poter essere utilizzati, regolati e sottoposti a manutenzione senza causare un'esposizione non intenzionale dell'ambiente ai prodotti fitosanitari.\nDevono sempre essere evitate fuoriuscite.", "pages": [65, 65], "tags": ["fitosanitari"], "always": false, "standards": ["EN ISO 4254-6:2020 + A11:2021", "EN ISO 16119-1:2013"]}, {"id": "MR-III-2.4.3", "law": "MR", "section": "MR-III", "group": "Allegato III — 2.4. Macchine o prodotti correlati per l'applicazione di prodotti fitosanitari", "ref": "All. III, punto 2.4.3", "title": "Comando e controllo", "text": "Devono essere possibili, con facilità e accuratezza, il comando, il controllo e l'arresto immediato dell'applicazione di prodotti fitosanitari dalle postazioni operative.", "pages": [65, 65], "tags": ["fitosanitari"], "always": false, "standards": ["EN ISO 4254-6:2020 + A11:2021", "EN ISO 16119-1:2013"]}, {"id": "MR-III-2.4.4", "law": "MR", "section": "MR-III", "group": "Allegato III — 2.4. Macchine o prodotti correlati per l'applicazione di prodotti fitosanitari", "ref": "All. III, punto 2.4.4", "title": "Riempimento e svuotamento", "text": "Le macchine o i prodotti correlati devono essere progettati e costruiti in modo tale da facilitare il riempimento preciso con la quantità necessaria di prodotti fitosanitari e assicurare lo svuotamento agevole e completo, prevenendo ogni dispersione accidentale di prodotti fitosanitari ed evitando ogni contaminazione di fonti idriche nel corso di tali operazioni.", "pages": [65, 65], "tags": ["fitosanitari"], "always": false, "standards": ["EN ISO 4254-6:2020 + A11:2021", "EN ISO 16119-1:2013"]}, {"id": "MR-III-2.4.5.1", "law": "MR", "section": "MR-III", "group": "Allegato III — 2.4. Macchine o prodotti correlati per l'applicazione di prodotti fitosanitari", "ref": "All. III, punto 2.4.5.1", "title": "Tasso di applicazione", "text": "Le macchine o i prodotti correlati devono essere muniti di dispositivi che permettano di regolare in modo facile, preciso e affidabile il tasso di applicazione.", "pages": [65, 65], "tags": ["fitosanitari"], "always": false, "standards": ["EN ISO 4254-6:2020 + A11:2021", "EN ISO 16119-1:2013", "EN ISO 16119-2:2013", "EN ISO 16119-3:2013"]}, {"id": "MR-III-2.4.5.2", "law": "MR", "section": "MR-III", "group": "Allegato III — 2.4. Macchine o prodotti correlati per l'applicazione di prodotti fitosanitari", "ref": "All. III, punto 2.4.5.2", "title": "Distribuzione, deposizione e dispersione di prodotti fitosanitari", "text": "Le macchine o i prodotti correlati devono essere progettati e costruiti in modo da assicurare che il prodotto fitosanitario sia depositato nelle zone bersaglio, da ridurre al minimo le perdite nelle altre zone e da evitare la dispersione di prodotti fitosanitari nell'ambiente. Se del caso, deve essere garantita una distribuzione uniforme e una deposizione omogenea.", "pages": [65, 65], "tags": ["fitosanitari"], "always": false, "standards": ["EN ISO 4254-6:2020 + A11:2021", "EN ISO 16119-1:2013", "EN ISO 16119-2:2013", "EN ISO 16119-3:2013"]}, {"id": "MR-III-2.4.5.3", "law": "MR", "section": "MR-III", "group": "Allegato III — 2.4. Macchine o prodotti correlati per l'applicazione di prodotti fitosanitari", "ref": "All. III, punto 2.4.5.3", "title": "Prove", "text": "Per accertare se le componenti corrispondenti della macchina o del prodotto correlato sono conformi ai requisiti stabiliti nei punti 2.4.5.1 e 2.4.5.2, il fabbricante deve effettuare, o far effettuare, prove adeguate per ogni tipo di macchina o di prodotto correlato.", "pages": [65, 65], "tags": ["fitosanitari"], "always": false, "standards": ["EN ISO 4254-6:2020 + A11:2021", "EN ISO 16119-1:2013", "EN ISO 16119-2:2013", "EN ISO 16119-3:2013"]}, {"id": "MR-III-2.4.5.4", "law": "MR", "section": "MR-III", "group": "Allegato III — 2.4. Macchine o prodotti correlati per l'applicazione di prodotti fitosanitari", "ref": "All. III, punto 2.4.5.4", "title": "Dispersione durante la disattivazione", "text": "Le macchine o i prodotti correlati devono essere progettati e costruiti in modo tale da prevenire la dispersione in fase di disattivazione della funzione di applicazione dei prodotti fitosanitari.", "pages": [65, 65], "tags": ["fitosanitari"], "always": false, "standards": ["EN ISO 4254-6:2020 + A11:2021", "EN ISO 16119-1:2013", "EN ISO 16119-2:2013", "EN ISO 16119-3:2013"]}, {"id": "MR-III-2.4.6.1", "law": "MR", "section": "MR-III", "group": "Allegato III — 2.4. Macchine o prodotti correlati per l'applicazione di prodotti fitosanitari", "ref": "All. III, punto 2.4.6.1", "title": "Pulizia", "text": "Le macchine o i prodotti correlati devono essere progettati e costruiti in modo da consentire una pulizia agevole e completa senza contaminazione dell'ambiente.", "pages": [65, 65], "tags": ["fitosanitari"], "always": false, "standards": ["EN ISO 4254-6:2020 + A11:2021", "EN ISO 16119-1:2013"]}, {"id": "MR-III-2.4.6.2", "law": "MR", "section": "MR-III", "group": "Allegato III — 2.4. Macchine o prodotti correlati per l'applicazione di prodotti fitosanitari", "ref": "All. III, punto 2.4.6.2", "title": "Riparazione", "text": "Le macchine o i prodotti correlati devono essere progettati e costruiti in modo da facilitare la sostituzione delle parti usurate senza contaminazione dell'ambiente.", "pages": [65, 65], "tags": ["fitosanitari"], "always": false, "standards": ["EN ISO 4254-6:2020 + A11:2021", "EN ISO 16119-1:2013"]}, {"id": "MR-III-2.4.7", "law": "MR", "section": "MR-III", "group": "Allegato III — 2.4. Macchine o prodotti correlati per l'applicazione di prodotti fitosanitari", "ref": "All. III, punto 2.4.7", "title": "Ispezioni", "text": "Deve essere possibile collegare con facilità alle macchine o ai prodotti correlati gli strumenti di misura necessari per verificare il buon funzionamento degli stessi.", "pages": [66, 66], "tags": ["fitosanitari"], "always": false, "standards": ["EN ISO 4254-6:2020 + A11:2021", "EN ISO 16119-1:2013"]}, {"id": "MR-III-2.4.8", "law": "MR", "section": "MR-III", "group": "Allegato III — 2.4. Macchine o prodotti correlati per l'applicazione di prodotti fitosanitari", "ref": "All. III, punto 2.4.8", "title": "Marcatura di ugelli, filtri a cestello e altri filtri", "text": "Ugelli, filtri a cestello e altri filtri devono essere contrassegnati in modo che il loro tipo e la loro dimensione possano essere identificati chiaramente.", "pages": [66, 66], "tags": ["fitosanitari"], "always": false, "standards": ["EN ISO 4254-6:2020 + A11:2021", "EN ISO 16119-1:2013", "ISO 10625"]}, {"id": "MR-III-2.4.9", "law": "MR", "section": "MR-III", "group": "Allegato III — 2.4. Macchine o prodotti correlati per l'applicazione di prodotti fitosanitari", "ref": "All. III, punto 2.4.9", "title": "Indicazione del prodotto fitosanitario in uso", "text": "Se del caso, le macchine o i prodotti correlati devono essere muniti di uno specifico supporto su cui l'operatore possa apporre il nome del prodotto fitosanitario in uso.", "pages": [66, 66], "tags": ["fitosanitari"], "always": false, "standards": ["EN ISO 4254-6:2020 + A11:2021", "EN ISO 16119-1:2013"]}, {"id": "MR-III-2.4.10", "law": "MR", "section": "MR-III", "group": "Allegato III — 2.4. Macchine o prodotti correlati per l'applicazione di prodotti fitosanitari", "ref": "All. III, punto 2.4.10", "title": "Istruzioni per l'uso", "text": "Nelle istruzioni per l'uso devono figurare le indicazioni seguenti:\na) le precauzioni da adottare durante le operazioni di miscelazione, carico, applicazione, svuotamento, lavaggio, riparazione e trasporto per evitare la contaminazione dell'ambiente;\nb) le condizioni dettagliate d'uso per i diversi ambienti operativi previsti, comprese le corrispondenti predisposizioni e regolazioni richieste per assicurare la deposizione del prodotto fitosanitario nelle zone bersaglio, riducendo al minimo le perdite nelle altre zone e, se del caso, per assicurare la distribuzione uniforme e la deposizione omogenea del prodotto fitosanitario;\nc) la gamma dei tipi e delle dimensioni degli ugelli, dei filtri a cestello e degli altri filtri che possono essere utilizzati con la macchina o il prodotto correlato;\nd) la frequenza dei controlli e i criteri e i metodi per la sostituzione delle parti soggette a usura che influiscono sul corretto funzionamento della macchina o del prodotto correlato, come gli ugelli, i filtri a cestello e gli altri filtri;\ne) le specifiche della taratura, della manutenzione giornaliera, della preparazione per l'inverno e degli altri controlli necessari per assicurare il corretto funzionamento della macchina o del prodotto correlato;\nf) i tipi di prodotto fitosanitario che possono provocare anomalie nel funzionamento della macchina o del prodotto correlato;\ng) l'indicazione che l'operatore dovrebbe tenere aggiornato il nome del prodotto fitosanitario in uso nel supporto specifico di cui al punto 2.4.9;\nh) il collegamento e l'uso di attrezzature e di accessori speciali e le necessarie precauzioni da prendere;\ni) l'indicazione che la macchina o il prodotto correlato possono essere soggetti ai requisiti nazionali in materia di ispezioni regolari da parte degli organi designati, come previsto nella direttiva 2009/128/CE del Parlamento europeo e del Consiglio (2);\nj) le caratteristiche delle macchine o dei prodotti correlati che devono essere sottoposte a controllo per assicurarne il corretto funzionamento;\nk) le istruzioni per il collegamento dei necessari strumenti di misurazione.", "pages": [66, 66], "tags": ["fitosanitari"], "always": false, "standards": ["EN ISO 4254-6:2020 + A11:2021", "EN ISO 16119-1:2013"]}, {"id": "MR-III-3.2.1", "law": "MR", "section": "MR-III", "group": "Allegato III — 3.2. Postazioni di lavoro", "ref": "All. III, punto 3.2.1", "title": "Postazione di guida", "text": "La visibilità dalla postazione di guida deve essere tale da consentire al conducente di far muovere la macchina o il prodotto correlato e i suoi utensili nelle condizioni di impiego ragionevolmente prevedibili, in tutta sicurezza per sé stesso e per le persone esposte. In caso di necessità, adeguati dispositivi devono rimediare ai rischi dovuti a insufficiente visibilità diretta.\nLa macchina o il prodotto correlato su cui è trasportato il conducente devono essere progettati e costruiti in modo che alle postazioni di guida non si presentino per il conducente rischi dovuti al contatto involontario con le ruote o con i cingoli.\nSe le dimensioni lo consentono e se i rischi non ne sono aumentati, la postazione di guida del conducente trasportato deve essere progettata e costruita in modo da poter essere dotata di cabina. La cabina deve comportare un luogo destinato alla sistemazione delle istruzioni per l'uso necessarie al conducente.", "pages": [67, 67], "tags": ["mobilita"], "always": false, "standards": ["EN ISO 4254-1:2015 + A1:2021", "EN 474-1:2022", "EN ISO 3691-1:2015 + A1:2020", "EN 16307-1:2020"]}, {"id": "MR-III-3.2.2", "law": "MR", "section": "MR-III", "group": "Allegato III — 3.2. Postazioni di lavoro", "ref": "All. III, punto 3.2.2", "title": "Sedili", "text": "Laddove vi sia il rischio che gli operatori o altre persone trasportati dalla macchina possano essere schiacciati tra elementi della macchina e l'ambiente circostante in caso di ribaltamento o rovesciamento laterale, in particolare per le macchine munite di una struttura di protezione di cui ai punti 3.4.3 o 3.4.4:\na) la macchina deve essere progettata o munita di un sistema di ritenuta in modo da mantenere le persone sui loro sedili o all'interno della struttura di protezione, senza opporsi ai movimenti necessari alle operazioni né ai movimenti dovuti alla sospensione dei sedili rispetto alla struttura;\nnon deve essere possibile lo spostamento della macchina laddove vi sia un rischio significativo di ribaltamento o rovesciamento laterale e non sia utilizzato un sistema di ritenuta;\ndetti sistemi di ritenuta o soluzioni devono tenere conto dei principi dell'ergonomia e non devono essere montati se aumentano i rischi;\nb) deve essere emesso un segnale visivo e sonoro presso la postazione di guida per avvisare il conducente quando si trova in posizione di guida e il sistema di ritenuta non è in uso.", "pages": [67, 67], "tags": ["mobilita"], "always": false, "standards": ["EN ISO 4254-1:2015 + A1:2021", "EN 474-1:2022", "EN ISO 3691-1:2015 + A1:2020", "EN 16307-1:2020"]}, {"id": "MR-III-3.2.3", "law": "MR", "section": "MR-III", "group": "Allegato III — 3.2. Postazioni di lavoro", "ref": "All. III, punto 3.2.3", "title": "Postazioni per altre persone", "text": "Se le condizioni di utilizzazione prevedono che, oltre al conducente, siano saltuariamente o regolarmente trasportate sulla macchina o vi lavorino altre persone, devono essere previste postazioni adeguate affinché il loro trasporto o lavoro avvenga senza rischi.\nIl punto 3.2.1, secondo e terzo comma, si applica anche alle postazioni delle persone diverse dal conducente.", "pages": [68, 68], "tags": ["mobilita"], "always": false, "standards": ["EN ISO 4254-1:2015 + A1:2021", "EN 474-1:2022", "EN ISO 3691-1:2015 + A1:2020", "EN 16307-1:2020"]}, {"id": "MR-III-3.2.4", "law": "MR", "section": "MR-III", "group": "Allegato III — 3.2. Postazioni di lavoro", "ref": "All. III, punto 3.2.4", "title": "Funzione di supervisione", "text": "Se del caso, le macchine o i prodotti correlati mobili autonomi devono disporre di una funzione di supervisione specifica per la modalità autonoma. Tale funzione deve consentire al supervisore di ricevere da remoto informazioni dalla macchina. La funzione di supervisione deve consentire soltanto azioni per arrestare e avviare la macchina o il prodotto correlato da remoto o spostarli in una posizione sicura e in uno stato sicuro per evitare di provocare altri rischi. Deve inoltre essere progettata e costruita in maniera tale da consentire tali azioni soltanto quando il supervisore può vedere direttamente o indirettamente la zona di movimento e di lavoro della macchina e i dispositivi di protezione sono operativi.\nLe informazioni che il supervisore riceve dalla macchina quando la funzione di supervisione è attiva devono consentire al supervisore di disporre di una visuale completa e precisa del funzionamento, del movimento e del posizionamento sicuro della macchina nella sua zona di spostamento e lavoro.\nTali informazioni devono avvisare il supervisore del verificarsi di situazioni impreviste o pericolose presenti o imminenti, che richiedono il suo intervento.\nSe la funzione di supervisione non è attiva, la macchina non deve essere in grado di funzionare.", "pages": [68, 68], "tags": ["mobilita"], "always": false, "standards": ["EN ISO 4254-1:2015 + A1:2021", "EN 474-1:2022", "EN ISO 3691-1:2015 + A1:2020", "EN 16307-1:2020"]}, {"id": "MR-III-3.3", "law": "MR", "section": "MR-III", "group": "Allegato III — 3. REQUISITI ESSENZIALI SUPPLEMENTARI DI SICUREZZA E DI TUTELA DELLA SALUTE PER OVVIARE AI RISCHI DOVUTI ALLA MOBILITÀ", "ref": "All. III, punto 3.3", "title": "Sistemi di comando", "text": "Se necessario, devono essere previsti sistemi atti ad impedire l’uso non autorizzato dei comandi.\nNelle macchine o nei prodotti correlati dotati di telecomando, ogni unità di comando deve indicare chiaramente quali siano le macchine o i prodotti correlati che essa è destinata a comandare.\nIl sistema di telecomando deve essere progettato e costruito in modo da influenzare soltanto:\na) la macchina o il prodotto correlato in questione;\nb) le funzioni in questione.\nLe macchine o i prodotti correlati dotati di telecomando devono essere progettati e costruiti in modo da rispondere unicamente ai segnali delle unità di comando previste.\nPer le macchine o i prodotti correlati mobili autonomi, il sistema di comando deve essere progettato in maniera tale da svolgere le funzioni di sicurezza autonomamente, come stabilito al presente punto, anche quando le azioni sono ordinate utilizzando una funzione di supervisione da remoto.", "pages": [68, 68], "tags": ["mobilita"], "always": false, "standards": ["EN ISO 4254-1:2015 + A1:2021", "EN 474-1:2022", "EN ISO 3691-1:2015 + A1:2020", "EN 16307-1:2020"]}, {"id": "MR-III-3.3.1", "law": "MR", "section": "MR-III", "group": "Allegato III — 3.3. Sistemi di comando", "ref": "All. III, punto 3.3.1", "title": "Dispositivi di controllo", "text": "Dalla postazione di manovra il conducente deve poter azionare tutti i dispositivi di comando necessari al funzionamento della macchina o del prodotto correlato, tranne per quanto riguarda le funzioni che possono essere esercitate in condizioni di sicurezza solo mediante dispositivi di comando collocati altrove. Dette funzioni includono, in particolare, quelle di cui sono responsabili operatori diversi dal conducente o per le quali è necessario che il conducente lasci la postazione di manovra per comandarle in condizioni di sicurezza.\nI pedali eventuali devono essere progettati, costruiti e disposti in modo che possano essere azionati da un conducente in modo sicuro con il minimo rischio di azionamento errato. Devono avere una superficie antisdrucciolo ed essere facili da pulire.\nQuando il loro azionamento può comportare pericoli, in particolare movimenti pericolosi, i dispositivi di comando, ad esclusione di quelli a posizioni predeterminate, devono ritornare in posizione neutra non appena l'operatore li lascia liberi.\nNel caso di una macchina a ruote, il meccanismo di sterzo deve essere progettato e costruito in modo da ridurre la forza dei movimenti bruschi del volante o della leva di sterzo, dovuti ai colpi subiti dalle ruote sterzanti.\nIl comando di blocco del differenziale deve essere progettato e disposto in modo da permettere di sbloccare il differenziale quando la macchina è in movimento.\nIl sesto comma del punto 1.2.2, concernente i segnali di avviamento sonori e/o visivi, si applica unicamente in caso di retromarcia.", "pages": [68, 69], "tags": ["mobilita"], "always": false, "standards": ["EN ISO 4254-1:2015 + A1:2021", "EN 474-1:2022", "EN ISO 3691-1:2015 + A1:2020", "EN 16307-1:2020"]}, {"id": "MR-III-3.3.2", "law": "MR", "section": "MR-III", "group": "Allegato III — 3.3. Sistemi di comando", "ref": "All. III, punto 3.3.2", "title": "Avviamento/spostamento", "text": "Qualsiasi spostamento comandato di una macchina semovente con conducente trasportato deve essere possibile soltanto se il conducente si trova al posto di comando.\nQuando, per il suo lavoro, una macchina è attrezzata con dispositivi che superano la sua sagoma normale (ad esempio stabilizzatore, freccia, ecc.), è necessario che il conducente disponga di mezzi che gli consentano di verificare facilmente, prima di spostare la macchina, che detti dispositivi siano in una posizione che consente uno spostamento sicuro.\nCiò vale anche per la posizione di tutti gli altri elementi che, per consentire uno spostamento sicuro, devono occupare una posizione definita, se necessario bloccata.\nQuando ciò non genera altri rischi, lo spostamento della macchina deve essere subordinato alla posizione sicura degli elementi sopra indicati.\nUno spostamento involontario della macchina non deve essere possibile all'atto dell'avviamento del motore.\nLo spostamento di una macchina mobile autonoma deve tenere conto dei rischi relativi alla zona nella quale è destinata a muoversi e lavorare.", "pages": [69, 69], "tags": ["mobilita"], "always": false, "standards": ["EN ISO 4254-1:2015 + A1:2021", "EN 474-1:2022", "EN ISO 3691-1:2015 + A1:2020", "EN 16307-1:2020"]}, {"id": "MR-III-3.3.3", "law": "MR", "section": "MR-III", "group": "Allegato III — 3.3. Sistemi di comando", "ref": "All. III, punto 3.3.3", "title": "Funzione di spostamento", "text": "Fatte salve le disposizioni relative alla circolazione stradale, le macchine semoventi e i loro rimorchi devono rispettare i requisiti in materia di rallentamento, di arresto, di frenatura e di immobilizzazione che garantiscano la sicurezza in tutte le condizioni di funzionamento, di carico, di velocità, di caratteristiche del suolo e di pendenza previste.\nIl rallentamento e l'arresto della macchina semovente devono poter essere ottenuti dal conducente attraverso un dispositivo principale. Se la sicurezza lo esige, in caso di guasto del dispositivo principale o in mancanza di energia per azionare tale dispositivo, un dispositivo d'emergenza con un dispositivo di comando interamente indipendente e facilmente accessibile deve consentire il rallentamento e l'arresto.\nSe la sicurezza lo esige, l'immobilizzazione della macchina deve essere mantenuta con un dispositivo di sosta. Questo dispositivo può essere combinato con uno dei dispositivi di cui al secondo comma, se ha un'azione puramente meccanica.\nLe macchine dotate di telecomando devono disporre di sistemi atti ad azionare automaticamente e immediatamente l'arresto e a prevenire il funzionamento potenzialmente pericoloso nelle situazioni seguenti:\na) quando il conducente ne ha perso il controllo;\nb) quando è ricevuto un segnale di arresto;\nc) quando è individuata un'avaria in un elemento del sistema di controllo legato alla sicurezza;\nd) quando un segnale di convalida non è stato rilevato entro un termine specificato.\nIl punto 1.2.4 non si applica alla funzione spostamento.\nLe macchine o i prodotti correlati mobili autonomi devono essere conformi a una delle condizioni seguenti o a entrambe, ove necessario in base alla valutazione del rischio:\ni) devono spostarsi e funzionare in una zona chiusa dotata di un sistema di protezione periferica comprendente ripari o dispositivi di protezione;\nii) devono essere dotati di dispositivi destinati a rilevare qualsiasi essere umano, animale domestico o qualsiasi altro ostacolo nelle loro vicinanze, laddove tali ostacoli potrebbero costituire un rischio per la salute e la sicurezza delle persone o di animali domestici o per il funzionamento sicuro della macchina o del prodotto correlato.\nGli spostamenti di macchine o prodotti correlati mobili correlati con uno o più rimorchi o apparecchiature rimorchiate, tra cui macchine o prodotti correlati mobili autonomi correlati a uno o più rimorchi o apparecchiature trainate, non devono generare rischi per persone, animali domestici o qualsiasi altro ostacolo presente nella zona pericolosa di tali macchine o prodotti correlati nonché di rimorchi o apparecchiature trainate.", "pages": [69, 70], "tags": ["mobilita"], "always": false, "standards": ["EN ISO 4254-1:2015 + A1:2021", "EN 474-1:2022", "EN ISO 3691-1:2015 + A1:2020", "EN 16307-1:2020"]}, {"id": "MR-III-3.3.4", "law": "MR", "section": "MR-III", "group": "Allegato III — 3.3. Sistemi di comando", "ref": "All. III, punto 3.3.4", "title": "Spostamento delle macchine con conducente a piedi", "text": "Ogni spostamento di una macchina semovente con conducente a piedi deve essere possibile solo se quest'ultimo esercita un'azione continua sul dispositivo di comando corrispondente. In particolare, nessuno spostamento deve essere possibile all'atto d'avviamento del motore. Il sistema di comando delle macchine con conducente a piedi deve essere progettato in modo da ridurre al minimo i rischi connessi allo spostamento inopinato della macchina verso il conducente, in particolare i rischi:\na) di schiacciamento;\nb) di lesioni provocate da utensili rotanti.\nLa velocità di spostamento

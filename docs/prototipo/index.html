razione di conformità UE", "ref": "Art. 28, par. 2", "title": "Dichiarazione di conformità UE", "text": "La dichiarazione di conformità UE ha la struttura tipo di cui all’allegato V e contiene gli elementi specificati nelle pertinenti procedure di valutazione della conformità di cui all’allegato VIII. Tale dichiarazione è opportunamente aggiornata. È resa disponibile nelle lingue richieste dallo Stato membro sul cui mercato il prodotto con elementi digitali è immesso o messo a disposizione sul mercato.\nLa dichiarazione di conformità UE semplificata di cui all’articolo 13, paragrafo 20, ha la struttura tipo di cui all’allegato VI. È resa disponibile nelle lingue richieste dallo Stato membro sul cui mercato il prodotto con elementi digitali è immesso o messo a disposizione sul mercato.", "pages": [47, 47], "tags": ["cra"], "always": false, "standards": ["EN ISO/IEC 17050-1:2010"]}, {"id": "CRA-ART28-3", "law": "CRA", "section": "CRA-OBB", "group": "Art. 28 — Dichiarazione di conformità UE", "ref": "Art. 28, par. 3", "title": "Dichiarazione di conformità UE", "text": "Se al prodotto con elementi digitali si applicano più atti giuridici dell’Unione che prescrivono una dichiarazione di conformità UE, è redatta un’unica dichiarazione di conformità UE in relazione a tutti questi atti giuridici dell’Unione. La dichiarazione contiene gli estremi degli atti giuridici dell’Unione in questione, compresi i riferimenti della loro pubblicazione.", "pages": [48, 48], "tags": ["cra"], "always": false, "standards": ["EN ISO/IEC 17050-1:2010"]}, {"id": "CRA-ART28-4", "law": "CRA", "section": "CRA-OBB", "group": "Art. 28 — Dichiarazione di conformità UE", "ref": "Art. 28, par. 4", "title": "Dichiarazione di conformità UE", "text": "Con la dichiarazione di conformità UE il fabbricante si assume la responsabilità della conformità del prodotto con elementi digitali.", "pages": [48, 48], "tags": ["cra"], "always": false, "standards": ["EN ISO/IEC 17050-1:2010"]}, {"id": "CRA-ART30-1", "law": "CRA", "section": "CRA-OBB", "group": "Art. 30 — Regole e condizioni per l’apposizione della marcatura CE", "ref": "Art. 30, par. 1", "title": "Regole e condizioni per l’apposizione della marcatura CE", "text": "La marcatura CE è apposta sul prodotto con elementi digitali in modo visibile, leggibile e indelebile. Qualora ciò non sia possibile o la natura del prodotto con elementi digitali non lo consenta, essa è apposta sull’imballaggio e sulla dichiarazione di conformità UE di cui all’articolo 28 che accompagna il prodotto con elementi digitali. Per i prodotti con elementi digitali sotto forma di software, la marcatura CE è apposta sulla dichiarazione di conformità UE di cui all’articolo 28 o sul sito web che accompagna il prodotto software. In quest’ultimo caso, la sezione pertinente del sito web è facilmente e direttamente accessibile ai consumatori.", "pages": [48, 48], "tags": ["cra"], "always": false, "standards": []}, {"id": "CRA-ART30-2", "law": "CRA", "section": "CRA-OBB", "group": "Art. 30 — Regole e condizioni per l’apposizione della marcatura CE", "ref": "Art. 30, par. 2", "title": "Regole e condizioni per l’apposizione della marcatura CE", "text": "A seconda della natura del prodotto con elementi digitali, l’altezza della marcatura CE apposta su di esso può essere inferiore a 5 mm, purché rimanga visibile e leggibile.", "pages": [48, 48], "tags": ["cra"], "always": false, "standards": []}, {"id": "CRA-ART30-3", "law": "CRA", "section": "CRA-OBB", "group": "Art. 30 — Regole e condizioni per l’apposizione della marcatura CE", "ref": "Art. 30, par. 3", "title": "Regole e condizioni per l’apposizione della marcatura CE", "text": "La marcatura CE è apposta sul prodotto con elementi digitali prima della sua immissione sul mercato. Può essere seguita da un pittogramma o da qualsiasi altro marchio che indichi un rischio di cibersicurezza o un impiego particolar stabilito negli atti di esecuzione di cui al paragrafo 6.", "pages": [48, 48], "tags": ["cra"], "always": false, "standards": []}, {"id": "CRA-ART30-4", "law": "CRA", "section": "CRA-OBB", "group": "Art. 30 — Regole e condizioni per l’apposizione della marcatura CE", "ref": "Art. 30, par. 4", "title": "Regole e condizioni per l’apposizione della marcatura CE", "text": "La marcatura CE è seguita dal numero di identificazione dell’organismo notificato, qualora quest’ultimo partecipi alla procedura di valutazione della conformità basata sulla garanzia della qualità totale (basata sul modulo H) di cui all’articolo 32.\nIl numero di identificazione dell’organismo notificato è apposto dall’organismo stesso o, in base alle istruzioni di quest’ultimo, dal fabbricante o dal rappresentante autorizzato del fabbricante.", "pages": [48, 48], "tags": ["cra"], "always": false, "standards": []}, {"id": "CRA-ART31-1", "law": "CRA", "section": "CRA-OBB", "group": "Art. 31 — Documentazione tecnica", "ref": "Art. 31, par. 1", "title": "Documentazione tecnica", "text": "La documentazione tecnica contiene tutti i dati o i dettagli pertinenti relativi ai mezzi utilizzati dal fabbricante per garantire che il prodotto con elementi digitali e i processi messi in atto dal fabbricante siano conformi ai requisiti essenziali di cibersicurezza di cui all’allegato I. Essa contiene almeno gli elementi di cui all’allegato VII.", "pages": [49, 49], "tags": ["cra"], "always": false, "standards": []}, {"id": "CRA-ART31-2", "law": "CRA", "section": "CRA-OBB", "group": "Art. 31 — Documentazione tecnica", "ref": "Art. 31, par. 2", "title": "Documentazione tecnica", "text": "La documentazione tecnica è redatta prima dell’immissione sul mercato del prodotto con elementi digitali ed è costantemente aggiornata, se del caso, almeno per tutta la durata del periodo di assistenza.", "pages": [49, 49], "tags": ["cra"], "always": false, "standards": []}, {"id": "CRA-ART31-3", "law": "CRA", "section": "CRA-OBB", "group": "Art. 31 — Documentazione tecnica", "ref": "Art. 31, par. 3", "title": "Documentazione tecnica", "text": "Per i prodotti con elementi digitali di cui all’articolo 12 che sono soggetti anche ad altri atti giuridici dell’Unione che prevedono documentazione tecnica, è redatta un’unica documentazione tecnica contenente le informazioni di cui all’allegato VII e le informazioni richieste dai rispettivi atti giuridici dell’Unione.", "pages": [49, 49], "tags": ["cra"], "always": false, "standards": []}, {"id": "CRA-ART31-4", "law": "CRA", "section": "CRA-OBB", "group": "Art. 31 — Documentazione tecnica", "ref": "Art. 31, par. 4", "title": "Documentazione tecnica", "text": "La documentazione tecnica e la corrispondenza relativa a qualsiasi procedura di valutazione della conformità sono redatte in una delle lingue ufficiali dello Stato membro in cui è stabilito l’organismo notificato o in una lingua accettata da quest’ultimo.", "pages": [49, 49], "tags": ["cra"], "always": false, "standards": []}, {"id": "CRA-ART32-1", "law": "CRA", "section": "CRA-OBB", "group": "Art. 32 — Procedure di valutazione della conformità per prodotti con elementi digitali", "ref": "Art. 32, par. 1", "title": "Procedure di valutazione della conformità per prodotti con elementi digitali", "text": "Il fabbricante effettua una valutazione della conformità del prodotto con elementi digitali e dei processi messi in atto dal fabbricante per determinare se sono soddisfatti i requisiti essenziali di cibersicurezza di cui all’allegato I. Il fabbricante dimostra la conformità ai requisiti essenziali di cibersicurezza utilizzando una delle procedure seguenti:\na) la procedura di controllo interno (basata sul modulo A) di cui all’allegato VIII;\nb) la procedura di esame UE del tipo (basata sul modulo B) di cui all’allegato VIII, seguita dalla conformità al tipo UE basata sul controllo interno della produzione (basata sul modulo C) di cui all’allegato VIII;\nc) una valutazione della conformità basata sulla garanzia della qualità totale (basata sul modulo H) di cui all’allegato VIII; o\nd) ove disponibile e applicabile, un sistema europeo di certificazione della cibersicurezza a norma dell’articolo 27, paragrafo 9.", "pages": [49, 49], "tags": ["cra"], "always": false, "standards": []}, {"id": "CRA-ART32-2", "law": "CRA", "section": "CRA-OBB", "group": "Art. 32 — Procedure di valutazione della conformità per prodotti con elementi digitali", "ref": "Art. 32, par. 2", "title": "Procedure di valutazione della conformità per prodotti con elementi digitali", "text": "Se per la valutazione della conformità del prodotto con elementi digitali importante rientrante nella classe I di cui all’allegato III e dei processi messi in atto dal suo fabbricante ai requisiti essenziali di cibersicurezza di cui all’allegato I il fabbricante non ha applicato o ha applicato solo in parte norme armonizzate, specifiche comuni o sistemi europei di certificazione della cibersicurezza con un livello di affidabilità almeno «sostanziale» di cui all’articolo 27, o nel caso in cui non esistano tali norme armonizzate, specifiche comuni o sistemi europei di certificazione della cibersicurezza, il prodotto con elementi digitali in questione e i processi messi in atto dal fabbricante sono sottoposti, per verificarne la conformità a tali requisiti essenziali di cibersicurezza, a una delle procedure seguenti:\na) la procedura di esame UE del tipo (basata sul modulo B) di cui all’allegato VIII, seguita dalla conformità al tipo UE basata sul controllo interno della produzione (basata sul modulo C) di cui all’allegato VIII; o\nb) la valutazione della conformità basata sulla garanzia della qualità totale (basata sul modulo H) di cui all’allegato VIII.", "pages": [49, 49], "tags": ["cra"], "always": false, "standards": []}, {"id": "CRA-ART32-3", "law": "CRA", "section": "CRA-OBB", "group": "Art. 32 — Procedure di valutazione della conformità per prodotti con elementi digitali", "ref": "Art. 32, par. 3", "title": "Procedure di valutazione della conformità per prodotti con elementi digitali", "text": "Se il prodotto è un prodotto con elementi digitali importante rientrante nella classe II, come indicato nell’allegato III, il fabbricante dimostra la conformità ai requisiti essenziali di cibersicurezza di cui all’allegato I utilizzando una delle procedure seguenti:\na) la procedura di esame UE del tipo (basata sul modulo B) di cui all’allegato VIII, seguita dalla conformità al tipo UE basata sul controllo interno della produzione (basata sul modulo C) di cui all’allegato VIII;\nb) la valutazione della conformità basata sulla garanzia della qualità totale (basata sul modulo H) di cui all’allegato VIII; o\nc) ove disponibile e applicabile, un sistema europeo di certificazione della cibersicurezza a norma dell’articolo 27, paragrafo 9, del presente regolamento con un livello di affidabilità almeno «sostanziale» ai sensi del regolamento (UE) 2019/881.", "pages": [49, 50], "tags": ["cra"], "always": false, "standards": []}, {"id": "CRA-ART32-4", "law": "CRA", "section": "CRA-OBB", "group": "Art. 32 — Procedure di valutazione della conformità per prodotti con elementi digitali", "ref": "Art. 32, par. 4", "title": "Procedure di valutazione della conformità per prodotti con elementi digitali", "text": "I prodotti con elementi digitali critici di classe II elencati nell’allegato IV dimostrano la conformità ai requisiti essenziali di cibersicurezza di cui all’allegato I utilizzando una delle procedure seguenti:\na) un sistema europeo di certificazione della cibersicurezza a norma dell’articolo 8, paragrafo 1; o\nb) se le condizioni di cui all’articolo 8, paragrafo 1, non sono soddisfatte, una delle procedure di cui al paragrafo 3 del presente articolo.", "pages": [50, 50], "tags": ["cra"], "always": false, "standards": []}, {"id": "CRA-ART32-5", "law": "CRA", "section": "CRA-OBB", "group": "Art. 32 — Procedure di valutazione della conformità per prodotti con elementi digitali", "ref": "Art. 32, par. 5", "title": "Procedure di valutazione della conformità per prodotti con elementi digitali", "text": "I fabbricanti di prodotti con elementi digitali che si qualificano come software liberi e open-source che rientrano nelle categorie di cui all’allegato III sono in grado di dimostrare la conformità ai requisiti essenziali i cibersicurezza di cui all’allegato I utilizzando una delle procedure di cui al paragrafo 1 del presente articolo, a condizione che la documentazione tecnica di cui all’articolo 31 sia messa a disposizione del pubblico al momento dell’immissione sul mercato di tali prodotti.", "pages": [50, 50], "tags": ["cra"], "always": false, "standards": []}, {"id": "CRA-II-1", "law": "CRA", "section": "CRA-DOC", "group": "All. II — Informazioni e istruzioni per l'utilizzatore", "ref": "All. II, punto 1", "title": "Dati di contatto del fabbricante", "text": "il nome, la denominazione commerciale registrata o il marchio registrato del fabbricante e l’indirizzo postale, l’indirizzo di posta elettronica o altro contatto digitale nonché, ove disponibile, il sito web a cui il fabbricante può essere contattato;", "pages": [70, 70], "tags": ["cra"], "always": false, "standards": []}, {"id": "CRA-II-2", "law": "CRA", "section": "CRA-DOC", "group": "All. II — Informazioni e istruzioni per l'utilizzatore", "ref": "All. II, punto 2", "title": "Punto di contatto unico per le vulnerabilità e politica CVD", "text": "il punto di contatto unico dove è possibile segnalare e ricevere informazioni sulle vulnerabilità del prodotto con elementi digitali e dove è possibile trovare la politica del fabbricante sulla divulgazione coordinata delle vulnerabilità;", "pages": [70, 70], "tags": ["cra"], "always": false, "standards": ["ISO/IEC 29147:2018"]}, {"id": "CRA-II-3", "law": "CRA", "section": "CRA-DOC", "group": "All. II — Informazioni e istruzioni per l'utilizzatore", "ref": "All. II, punto 3", "title": "Identificazione univoca del prodotto", "text": "nome e tipo e qualsiasi altra informazione che consenta l’identificazione univoca del prodotto con elementi digitali;", "pages": [70, 70], "tags": ["cra"], "always": false, "standards": []}, {"id": "CRA-II-4", "law": "CRA", "section": "CRA-DOC", "group": "All. II — Informazioni e istruzioni per l'utilizzatore", "ref": "All. II, punto 4", "title": "Finalità prevista, funzionalità e proprietà di sicurezza", "text": "la finalità prevista del prodotto con elementi digitali, compreso l’ambiente di sicurezza fornito dal fabbricante, nonché le funzionalità essenziali del prodotto e le informazioni sulle proprietà di sicurezza;", "pages": [70, 70], "tags": ["cra"], "always": false, "standards": []}, {"id": "CRA-II-5", "law": "CRA", "section": "CRA-DOC", "group": "All. II — Informazioni e istruzioni per l'utilizzatore", "ref": "All. II, punto 5", "title": "Circostanze che possono comportare rischi di cibersicurezza significativi", "text": "qualsiasi circostanza nota o prevedibile connessa all’uso del prodotto con elementi digitali in conformità alla sua finalità prevista o in condizioni di uso improprio ragionevolmente prevedibile, che possa comportare rischi di cibersicurezza significativi;", "pages": [70, 70], "tags": ["cra"], "always": false, "standards": []}, {"id": "CRA-II-6", "law": "CRA", "section": "CRA-DOC", "group": "All. II — Informazioni e istruzioni per l'utilizzatore", "ref": "All. II, punto 6", "title": "Indirizzo internet della dichiarazione di conformità UE", "text": "se del caso, l’indirizzo Internet dove è possibile accedere alla dichiarazione di conformità UE;", "pages": [70, 70], "tags": ["cra"], "always": false, "standards": []}, {"id": "CRA-II-7", "law": "CRA", "section": "CRA-DOC", "group": "All. II — Informazioni e istruzioni per l'utilizzatore", "ref": "All. II, punto 7", "title": "Assistenza tecnica di sicurezza e data finale del periodo di assistenza", "text": "il tipo di assistenza tecnica di sicurezza offerta dal fabbricante e la data finale del periodo di assistenza durante il quale gli utilizzatori possono aspettarsi che le vulnerabilità siano gestite const AI={};
function evaluate(m,r){
 const u=rnd(r.id,m.model);
 if(!r.always&&u<.12)return {na:true,app:+(.04+.3*rnd(r.id,'a')).toFixed(2),pts:[]};
 const pts=points(r),kind=m.sparse?(u<.16?'PART':u<.2?'NC':'INS'):u<.42?'OK':u<.60?'PART':u<.86?'NC':'INS';
 if(CURATED[r.id]&&m.id==='px200')return {na:false,app:.97,pts:pts.map((t,i)=>{const c=CURATED[r.id][i]||['I',.7,'',null,''];return {t,a:c[0],p:c[1],q:c[2],d:c[3],loc:c[4]}})};
 const ci=Math.floor(rnd(r.id,'c')*pts.length);
 return {na:false,app:+(.86+.13*rnd(r.id,'ap')).toFixed(2),pts:pts.map((t,i)=>{
  const a=kind==='OK'?'S':kind==='INS'?'I':kind==='NC'?(i===ci||rnd(r.id,'nc',i)<.5?'C':'S'):(i===0||pts.length===1?'S':rnd(r.id,'pp',i)<.6?'I':'S');
  const aa=kind==='PART'&&pts.length>1&&i===pts.length-1&&a==='S'?'I':a;
  const pool=aa==='C'?QS.C:QS.S,doc=Math.floor(rnd(r.id,'d',i)*m.docs.length);
  return {t,a:aa,p:+(.68+.31*rnd(r.id,'p',i)).toFixed(2),q:aa==='I'?'':pool[Math.floor(rnd(r.id,'q',i)*pool.length)],d:aa==='I'?null:doc,loc:aa==='I'?'':'p. '+(5+Math.floor(rnd(r.id,'l',i)*70))};
 })};
}
machines.forEach(m=>{AI[m.id]={};const sc=scope(m),n=m.run.state==='running'?m.run.done:sc.length;sc.slice(0,n).forEach((r,i)=>{AI[m.id][r.id]={...evaluate(m,r),ok:m.reviewed==='all'||i<m.reviewed}})});
function outcome(x){if(!x)return null;if(x.na)return 'NA';const a=x.pts.map(p=>p.a);if(a.includes('C'))return 'NC';if(a.every(v=>v==='S'))return 'OK';if(a.includes('S'))return 'PART';return 'INS'}
const conf=x=>x.na?1-x.app:Math.min(...x.pts.map(p=>p.p),x.app);
const doubtful=x=>x&&!x.ok&&conf(x)<.8;
/** Score per requisito: ogni requisito applicabile vale la quota dei suoi punti supportati (contraddetti e senza evidenze = 0).
 *  Massimo raggiungibile: come se tutti i punti senza evidenze risultassero supportati. */
function reqScore(x){const n=x.pts.length||1,S=x.pts.filter(p=>p.a==='S').length,I=x.pts.filter(p=>p.a==='I').length;return {v:S/n,max:(S+I)/n}}
function score(m){
 let S=0,C=0,I=0,reqs=0,na=0,done=0,ok=0,sum=0,sumMax=0,full=0;const sc=scope(m);
 sc.forEach(r=>{const x=AI[m.id][r.id];if(!x)return;done++;if(x.ok)ok++;if(x.na){na++;return}reqs++;x.pts.forEach(p=>p.a==='S'?S++:p.a==='C'?C++:I++);const q=reqScore(x);sum+=q.v;sumMax+=q.max;if(q.v===1)full++});
 const T=S+C+I||1,R=reqs||1;return {S,C,I,T,score:sum/R,max:sumMax/R,cov:(S+C)/T,full,reqs,na,done,ok,total:sc.length};
}
const pct=v=>Math.round(v*100)+'%';
/** Sotto questa copertura delle evidenze lo score non è significativo: il report dice "non valutabile". */
const MIN_COV=.30;
const notEval=s=>s.done>0&&s.cov<MIN_COV;
/** Un gap per requisito: tecnico se almeno un punto è contraddetto, documentale se mancano solo prove. */
function gaps(m){
 const out=[];scope(m).forEach(r=>{const x=AI[m.id][r.id];if(!x)return;
  if(x.na){if(x.app>.2)out.push({r,kind:'Applicabilità',pr:3,t:applicability(r),p:1-x.app,pts:[]});return}
  const bad=x.pts.filter(p=>p.a!=='S');if(!bad.length)return;const tech=bad.some(p=>p.a==='C');
  out.push({r,kind:tech?'Tecnico':'Documentale',pr:tech?1:2,t:(bad.find(p=>p.a==='C')||bad[0]).t,p:Math.max(...bad.map(p=>p.p)),pts:bad,lost:1-reqScore(x).v})});
 return out.sort((a,b)=>a.pr-b.pr||b.p-a.p);
}
function areaOf(r){
 if(r.section==='MR-III'){const g=r.group.replace(/^Allegato III — /,'');const m=g.match(/^(\d)(\.\d)?\.?\s/);if(!m)return 'Reg. Macchine — 1.1 Considerazioni generali';return 'Reg. Macchine — '+(m[1]==='1'?g.replace(/^(\d\.\d)\. /,'$1 '):({2:'2 Categorie particolari',3:'3 Mobilità',4:'4 Sollevamento',5:'5 Lavori sotterranei',6:'6 Sollevamento di persone'})[m[1]])}
 if(r.law==='MR')return 'Reg. Macchine — Obblighi, documentazione e dichiarazioni';
 if(/parte I —/.test(r.group))return 'CRA — Proprietà di sicurezza (All. I, parte I)';
 if(/parte II/.test(r.group))return 'CRA — Gestione delle vulnerabilità (All. I, parte II)';
 return 'CRA — Obblighi, informazioni e documentazione';
}
function areas(m){const a={};scope(m).forEach(r=>{const x=AI[m.id][r.id];if(!x||x.na)return;const k=areaOf(r);a[k]=a[k]||{n:0,v:0,max:0};const q=reqScore(x);a[k].n++;a[k].v+=q.v;a[k].max+=q.max});return Object.entries(a).map(([k,v])=>({k,n:v.n,score:v.v/v.n,max:v.max/v.n}))}

 <div class="card"><h2>Dati e backup</h2><dl class="kv" style="margin-top:10px"><dt>Cartella dati</dt><dd><code class="tiny">~/Library/Application Support/RegMac</code></dd><dt>Ultimo backup</dt><dd>08/11/2026 18:00</dd></dl>
 <div class="row" style="margin-top:12px"><button class="btn pri" data-a="toast" data-msg="Backup salvato in un unico file verificato">${I('db',14)}Esegui backup</button><button class="btn" data-a="toast" data-msg="Sceglie un backup, lo verifica e chiede conferma">Ripristina…</button></div></div></div></div>`}

/* nuova macchina */
const QUEST=[['mobilita','Si sposta durante il lavoro?',.04,'«La pressa è installata su basamento fisso ancorato al pavimento.»'],['sollevamento','Solleva o movimenta carichi?',.18,'«Carico e scarico manuale dei pezzi da parte dell\'operatore.»'],['sollevamento_persone','Solleva persone?',.02,''],['portatili','È portatile o condotta a mano?',.01,''],['alimentari','Lavora alimenti, cosmetici o farmaci?',.03,''],['legno','Lavora legno o materiali simili?',.02,''],['fitosanitari','Applica prodotti fitosanitari?',.01,''],['sotterraneo','È usata in lavori sotterranei?',.01,''],['cra','Ha software, rete o accesso remoto?',.94,'«HMI con porta Ethernet per teleassistenza del fabbricante.»'],['allegato1','È tra le categorie dell\'Allegato I (organismo notificato)?',.58,'«Pressa per la lavorazione a freddo dei metalli con carico manuale.»']];
function wizTags(w){const ans=k=>w.ans[k]??(QUEST.find(q=>q[0]===k)[2]>=.5);return ['generale','macchina',...QUEST.filter(q=>q[0]!=='allegato1'&&ans(q[0])).map(q=>q[0])]}
function wizard(){const w=S.wiz;
 const ans=k=>w.ans[k]??(QUEST.find(q=>q[0]===k)[2]>=.5);
 const tags=wizTags(w),sc=REQ.filter(r=>inScope(r,tags));
 let b='';
 if(w.step===0)b=`<div class="stack"><div class="grid2" style="grid-template-columns:1fr 1fr"><label class="f">Nome della macchina<input value="Pressa idraulica PX-300"></label><label class="f">Fabbricante<input value="Officine Rossi S.r.l."></label><label class="f">Modello<input value="PX-300"></label><label class="f">Matricola<input value="0051"></label></div>
 <div class="card" style="border-style:dashed;text-align:center;background:var(--brand3)">${I('upload',20)}<div><b>Trascina qui la documentazione tecnica</b></div><div class="tiny mute">Manuale, valutazione dei rischi, schemi, prove, dichiarazioni</div></div>
 ${DOCS.slice(0,3).map(d=>`<div class="row small"><span style="color:var(--ok)">${I('check',14)}</span><span class="grow">${esc(d[0])}</span><span class="tiny mute">letto · ${d[4]} brani</span></div>`).join('')}</div>`;
 if(w.step===1)b=`<p class="small mute" style="margin-bottom:10px">L'AI ha letto i documenti e propone il profilo. Controlla soprattutto le risposte <b style="color:var(--part)">incerte</b>.</p>
 ${QUEST.map(([k,qq,p,quote])=>{const unsure=p>.25&&p<.75;return `<div class="q ${unsure?'unsure':''}"><div class="grow"><b class="small">${qq}</b><div class="tiny mute">${quote?esc(quote)+' · ':''}probabilità sì ${p.toFixed(2)}${unsure?' · <b style="color:var(--part)">incerta</b>':''}</div></div><div class="yn"><button class="${ans(k)?'on':''}" data-a="wans" data-k="${k}" data-v="1">Sì</button><button class="${ans(k)?'':'on'}" data-a="wans" data-k="${k}" data-v="0">No</button></div></div>`}).join('')}`;
 if(w.step===2)b=`<div style="text-align:center;padding:10px 0"><div class="eyebrow">Perimetro</div><div class="count">${sc.length} requisiti</div><div class="small mute">${sc.filter(r=>r.law==='MR').length} Reg. Macchine · ${sc.filter(r=>r.law==='CRA').length} CRA</div></div>
 ${ans('allegato1')?`<div class="card" style="background:var(--partbg);border-color:transparent;color:var(--part);margin-top:10px"><div class="row small">${I('warn')}<span>Macchina dell'Allegato I: il report lo segnala, la valutazione finale richiede un organismo notificato.</span></div></div>`:''}
 <div class="card" style="margin-top:12px"><div class="row"><span style="color:var(--brand);display:flex">${I('spark',16)}</span><div class="grow"><b>Pre-valutazione AI</b><div class="tiny mute">circa ${Math.round(sc.length*2.6/60)} minuti con qwen3:8b · prosegue in sottofondo</div></div></div></div>`;
 return `<div class="ov"><div class="modal" role="dialog" aria-modal="true" aria-label="Nuova macchina"><div class="mh"><div class="grow"><span class="eyebrow">Nuova macchina · passo ${w.step+1} di 3</span><h2>${['Macchina e documenti','Profilo proposto dall\'AI','Avvio della pre-valutazione'][w.step]}</h2></div><div class="wsteps">${[0,1,2].map(i=>`<span class="${i<=w.step?'on':''}"></span>`).join('')}</div><button class="iconbtn" data-a="close">${I('x')}</button></div>
 <div class="mb">${b}</div><div class="mf">${w.step>0?`<button class="btn" data-a="wback">${I('left')}Indietro</button>`:''}<span class="grow"></span>${w.step<2?`<button class="btn pri" data-a="wnext">${w.step===0?'Proponi il profilo':'Conferma il profilo'} ${I('chev')}</button>`:`<button class="btn pri" data-a="wcreate">Avvia la pre-valutazione ${I('chev')}</button>`}</div></div></div>`}

function delModal(){const m=machines.find(x=>x.id===S.del),s=score(m);
 return `<div class="ov"><div class="modal" role="alertdialog" aria-modal="true" aria-label="Elimina fascicolo" style="width:min(520px,100%)"><div class="mh"><span style="color:var(--nc);display:flex">${I('trash',18)}</span><h2 class="grow">Eliminare il fascicolo?</h2><button class="iconbtn" data-a="close">${I('x')}</button></div>
 <div class="mb stack"><p class="small">Verranno eliminati definitivamente da questo computer:</p>
 <ul class="small" style="margin:0;padding-left:18px;line-height:1.8"><li><b>${esc(m.name)}</b> e i dati della macchina</li><li>${m.docs.length} documenti caricati e il loro indice</li><li>${s.done} esiti della pre-valutazione e le revisioni</li><li>i report esportati archiviati nel fascicolo</li></ul>
 <div class="card row" style="background:var(--brand3);padding:10px 12px"><span class="grow tiny">Vuoi tenerne una copia? Esporta prima il fascicolo in un file .regmac.</span><button class="btn sm" data-a="toast" data-msg="Fascicolo esportato in un file .regmac">${I('dl',13)}Esporta</button></div>
 <label class="f">Per confermare scrivi il nome della macchina: <b>${esc(m.name)}</b><input id="delname" autocomplete="off"></label></div>
 <div class="mf"><span class="grow"></span><button class="btn" data-a="close">Annulla</button><button class="btn danger pri" data-a="dodel">${I('trash',14)}Elimina definitivamente</button></div></div></div>`}
function undoToast(name){clearTimeout(toastT);document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.innerHTML=`Fascicolo «${esc(name)}» eliminato <button data-a="undo" class="undo">Annulla</button>`;document.body.appendChild(t);toastT=setTimeout(()=>{t.remove();S.trash=null},8000)}

/* ---------- eventi ---------- */
let toastT;function toast(msg){clearTimeout(toastT);let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t)}t.textContent='Prototipo — '+msg;toastT=setTimeout(()=>t.remove(),2600)}
function move(d){const f=scope(M()),i=f.findIndex(r=>r.id===S.sel);S.sel=f[Math.max(0,Math.min(f.length-1,i+d))].id;render()}
function confirmSel(){const x=AI[S.mid][S.sel];if(!x)return;x.ok=true;const f=scope(M()),i=f.findIndex(r=>r.id===S.sel),n=f.slice(i+1).find(r=>AI[S.mid][r.id]&&!AI[S.mid][r.id].ok);if(n)S.sel=n.id;render()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;if(el.tagName==='A'||a==='legal')e.preventDefault();
 if(a==='jump'){const k=el.dataset.k;S.wiz=null;if(k==='welcome'){S.screen='welcome';S.wstep=0}else{S.screen='app';if(k==='wizard'){S.tab='fascicoli';S.wiz={step:0,ans:{}}}else if(k.startsWith('f:')){S.tab='fascicolo';S.mid='px200';S.ftab=k.slice(2)}else S.tab=k}}
 if(a==='wstep')S.wstep=1;if(a==='wback0')S.wstep=0;
 if(a==='start'){S.screen='app';S.tab='fascicoli'}
 if(a==='tab')S.tab=el.dataset.t;
 if(a==='open'){S.mid=el.dataset.m;S.tab='fascicolo';S.ftab='panoramica';const f=scope(M());S.sel=(f.find(r=>AI[S.mid][r.id]&&!AI[S.mid][r.id].ok)||f[0]).id;S.filter='all'}
 if(a==='ftab')S.ftab=el.dataset.f;
 if(a==='sel')S.sel=el.dataset.r;
 if(a==='pt'){const x=AI[S.mid][S.sel];x.pts[+el.dataset.i].a=el.dataset.v;x.pts[+el.dataset.i].p=1;x.ok=false}
 if(a==='confirm'){confirmSel();return}
 if(a==='nav'){move(+el.dataset.d);return}
 if(a==='filter')S.filter=el.dataset.k;
 if(a==='legal')S.showLegal=!S.showLegal;
 if(a==='gk'){S.gk=el.dataset.k;S.allGaps=false}
 if(a==='allgaps')S.allGaps=true;
 if(a==='goto'){S.ftab='requisiti';S.sel=el.dataset.r;S.filter='all'}
 if(a==='todo'){S.ftab='requisiti';S.filter='todo';const f=scope(M()),n=f.find(r=>AI[S.mid][r.id]&&!AI[S.mid][r.id].ok);if(n)S.sel=n.id}
 if(a==='close'){S.wiz=null;S.del=null}
 if(a==='askdel'){e.stopPropagation();S.del=el.dataset.m}
 if(a==='dodel'){const i=machines.findIndex(x=>x.id===S.del),m=machines[i];if(document.getElementById('delname').value.trim()!==m.name){toast('scrivi il nome esatto della macchina per confermare');return}
  machines.splice(i,1);S.trash={m,i,ai:AI[m.id]};delete AI[m.id];S.del=null;S.tab='fascicoli';undoToast(m.name)}
 if(a==='undo'&&S.trash){machines.splice(S.trash.i,0,S.trash.m);AI[S.trash.m.id]=S.trash.ai;S.trash=null;document.querySelector('.toast')?.remove()}
 if(a==='wiz')S.wiz={step:0,ans:{}};
 if(a==='wnext')S.wiz.step++;if(a==='wback')S.wiz.step--;
 if(a==='wans')S.wiz.ans[el.dataset.k]=el.dataset.v==='1';
 if(a==='wcreate'){const id='px300-'+Date.now();machines.unshift({id,name:'Pressa idraulica PX-300',model:'PX-300',serial:'0051',year:2026,maker:'Officine Rossi S.r.l.',use:'Stampaggio a freddo di lamiere fino a 5 mm, carico manuale.',tags:wizTags(S.wiz),edited:'adesso',docs:DOCS.slice(0,3),run:{state:'running',done:0,fast:true},reviewed:0});AI[id]={};S.wiz=null;S.mid=id;S.tab='fascicolo';S.ftab='panoramica';const f=scope(M());S.sel=f[0].id}
 if(a==='nsel')S.norm=el.dataset.r;
 if(a==='toast'){toast(el.dataset.msg);return}
 if(a==='hidenote'||a==='togglenote')S.note=!S.note;
 if(a==='theme'){const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=cur==='dark'?'light':'dark'}
 render();
});
document.addEventListener('input',e=>{for(const id of ['q','nq'])if(e.target.id===id){S[id]=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById(id);n.focus();n.setSelectionRange(pos,pos)}});
document.addEventListener('keydown',e=>{if(S.tab!=='fascicolo'||S.ftab!=='requisiti'||S.wiz||S.screen==='welcome')return;if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName))return;
 if(e.key==='Enter'){e.preventDefault();confirmSel()}if(e.key==='j'||e.key==='ArrowDown'){e.preventDefault();move(1)}if(e.key==='k'||e.key==='ArrowUp'){e.preventDefault();move(-1)}});
/* simulazione: le pre-valutazioni in corso avanzano (in un'app reale: circa 2–3 s per requisito) */
setInterval(()=>{let changed=null;
 machines.forEach(m=>{if(m.run.state!=='running')return;const sc=scope(m);let d=Object.keys(AI[m.id]).length;
  for(let k=0;k<(m.run.fast?8:1)&&d<sc.length;k++,d++){const r=sc[d];AI[m.id][r.id]={...evaluate(m,r),ok:false}}
  changed=changed||m;
  if(d>=sc.length){m.run={state:'done',minutes:m.run.fast?Math.round(sc.length*2.6/60):9};m.edited='adesso';toast(`pre-valutazione di ${m.name} completata: ora puoi rivedere gli esiti`)}});
 if(!changed||S.screen!=='app'||S.wiz)return;
 if(S.tab==='fascicoli'||(S.tab==='fascicolo'&&S.ftab!=='requisiti'))render()},500);
render();

</script>

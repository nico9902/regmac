iarazione di conformità UE per le macchine e i prodotti correlati", "text": "La dichiarazione di conformità UE ha la struttura tipo di cui all'allegato V, parte A, e contiene gli elementi specificati nei moduli pertinenti di cui agli allegati VI, VIII, IX e X. È continuamente aggiornata ed è tradotta nella lingua o nelle lingue richieste dallo Stato membro sul cui mercato la macchina o il prodotto correlato sono immessi, messi a disposizione o messi in servizio.", "pages": [26, 26], "tags": ["macchina"], "always": false, "standards": ["EN ISO/IEC 17050-1:2010"]}, {"id": "MR-ART21-3", "law": "MR", "section": "MR-OBB", "group": "Art. 21 — Dichiarazione di conformità UE per le macchine e i prodotti correlati", "ref": "Art. 21, par. 3", "title": "Dichiarazione di conformità UE per le macchine e i prodotti correlati", "text": "Se alla macchina o al prodotto correlato si applicano più atti giuridici dell'Unione che prescrivono una dichiarazione di conformità UE, è compilata un'unica dichiarazione di conformità UE in relazione a tali atti. Tale dichiarazione contiene gli estremi degli atti giuridici dell'Unione in questione, compresi i riferimenti della loro pubblicazione.", "pages": [26, 26], "tags": ["macchina"], "always": false, "standards": ["EN ISO/IEC 17050-1:2010"]}, {"id": "MR-ART21-4", "law": "MR", "section": "MR-OBB", "group": "Art. 21 — Dichiarazione di conformità UE per le macchine e i prodotti correlati", "ref": "Art. 21, par. 4", "title": "Dichiarazione di conformità UE per le macchine e i prodotti correlati", "text": "Con la dichiarazione di conformità UE, il fabbricante si assume la responsabilità della conformità della macchina o del prodotto correlato ai requisiti stabiliti dal presente regolamento.", "pages": [26, 26], "tags": ["macchina"], "always": false, "standards": ["EN ISO/IEC 17050-1:2010"]}, {"id": "MR-ART22-1", "law": "MR", "section": "MR-OBB", "group": "Art. 22 — Dichiarazione di incorporazione UE di quasi-macchine", "ref": "Art. 22, par. 1", "title": "Dichiarazione di incorporazione UE di quasi-macchine", "text": "La dichiarazione di incorporazione UE attesta che la conformità ai pertinenti requisiti essenziali di sicurezza e di tutela della salute di cui all'allegato III è stata dimostrata.", "pages": [26, 26], "tags": ["quasi_macchina"], "always": false, "standards": ["EN ISO/IEC 17050-1:2010"]}, {"id": "MR-ART22-2", "law": "MR", "section": "MR-OBB", "group": "Art. 22 — Dichiarazione di incorporazione UE di quasi-macchine", "ref": "Art. 22, par. 2", "title": "Dichiarazione di incorporazione UE di quasi-macchine", "text": "La dichiarazione di incorporazione UE ha la struttura tipo di cui all'allegato V, parte B. È costantemente aggiornata e tradotta nella lingua o nelle lingue richieste dallo Stato membro sul cui mercato la quasi-macchina è immessa o messa a disposizione.", "pages": [27, 27], "tags": ["quasi_macchina"], "always": false, "standards": ["EN ISO/IEC 17050-1:2010"]}, {"id": "MR-ART22-3", "law": "MR", "section": "MR-OBB", "group": "Art. 22 — Dichiarazione di incorporazione UE di quasi-macchine", "ref": "Art. 22, par. 3", "title": "Dichiarazione di incorporazione UE di quasi-macchine", "text": "Se alla quasi-macchina si applicano più atti giuridici dell'Unione che prescrivono una dichiarazione di conformità UE, la dichiarazione di incorporazione UE contiene un'indicazione con la quale si dichiara la conformità a tali atti. Tale dichiarazione contiene gli estremi degli atti giuridici dell'Unione in questione, compresi i riferimenti della loro pubblicazione.", "pages": [27, 27], "tags": ["quasi_macchina"], "always": false, "standards": ["EN ISO/IEC 17050-1:2010"]}, {"id": "MR-ART22-4", "law": "MR", "section": "MR-OBB", "group": "Art. 22 — Dichiarazione di incorporazione UE di quasi-macchine", "ref": "Art. 22, par. 4", "title": "Dichiarazione di incorporazione UE di quasi-macchine", "text": "Con la dichiarazione di incorporazione UE, il fabbricante si assume la responsabilità della conformità della quasi-macchina ai requisiti stabiliti dal presente regolamento.", "pages": [27, 27], "tags": ["quasi_macchina"], "always": false, "standards": ["EN ISO/IEC 17050-1:2010"]}, {"id": "MR-ART24-1", "law": "MR", "section": "MR-OBB", "group": "Art. 24 — Norme per l'apposizione della marcatura CE alle macchine e ai prodotti correlati", "ref": "Art. 24, par. 1", "title": "Norme per l'apposizione della marcatura CE alle macchine e ai prodotti correlati", "text": "La marcatura CE è apposta sulla macchina o sul prodotto correlato in modo visibile, leggibile e indelebile. Qualora non sia possibile o la natura della macchina o del prodotto correlato non lo consenta, essa è apposta sul suo imballaggio e sui documenti di accompagnamento della macchina o del prodotto correlato.", "pages": [27, 27], "tags": ["macchina"], "always": false, "standards": []}, {"id": "MR-ART24-2", "law": "MR", "section": "MR-OBB", "group": "Art. 24 — Norme per l'apposizione della marcatura CE alle macchine e ai prodotti correlati", "ref": "Art. 24, par. 2", "title": "Norme per l'apposizione della marcatura CE alle macchine e ai prodotti correlati", "text": "La marcatura CE è apposta sulla macchina o sul prodotto correlato prima dell'immissione sul mercato o della messa in servizio.", "pages": [27, 27], "tags": ["macchina"], "always": false, "standards": []}, {"id": "MR-ART24-3", "law": "MR", "section": "MR-OBB", "group": "Art. 24 — Norme per l'apposizione della marcatura CE alle macchine e ai prodotti correlati", "ref": "Art. 24, par. 3", "title": "Norme per l'apposizione della marcatura CE alle macchine e ai prodotti correlati", "text": "Qualora la conformità di una macchina o di un prodotto correlato sia valutata conformemente alla procedura di valutazione della conformità di cui all'articolo 25, paragrafo 2, lettere a), b) e c), e all'articolo 25, paragrafo 3, lettere b),\nc) e d), la marcatura CE è seguita dal numero di identificazione dell'organismo notificato coinvolto nella procedura.\nIl numero di identificazione di tale organismo notificato è apposto dall'organismo stesso o, in base alle istruzioni di quest'ultimo, dal fabbricante o dal mandatario del fabbricante.", "pages": [27, 27], "tags": ["macchina"], "always": false, "standards": []}, {"id": "MR-ART24-4", "law": "MR", "section": "MR-OBB", "group": "Art. 24 — Norme per l'apposizione della marcatura CE alle macchine e ai prodotti correlati", "ref": "Art. 24, par. 4", "title": "Norme per l'apposizione della marcatura CE alle macchine e ai prodotti correlati", "text": "La marcatura CE e, se del caso, il numero di identificazione dell'organismo notificato possono essere seguiti da un pittogramma o qualsiasi altro marchio che indichi un rischio o un impiego particolare.", "pages": [27, 27], "tags": ["macchina"], "always": false, "standards": []}, {"id": "MR-ART25-1", "law": "MR", "section": "MR-OBB", "group": "Art. 25 — Procedure di valutazione della conformità per le macchine e i prodotti correlati", "ref": "Art. 25, par. 1", "title": "Procedure di valutazione della conformità per le macchine e i prodotti correlati", "text": "Il fabbricante o la persona fisica o giuridica di cui all'articolo 18 applica una delle procedure per la valutazione della conformità di cui ai paragrafi 2, 3 e 4.", "pages": [27, 27], "tags": ["macchina"], "always": false, "standards": []}, {"id": "MR-ART25-2", "law": "MR", "section": "MR-OBB", "group": "Art. 25 — Procedure di valutazione della conformità per le macchine e i prodotti correlati", "ref": "Art. 25, par. 2", "title": "Procedure di valutazione della conformità per le macchine e i prodotti correlati", "text": "Se la categoria di macchine o prodotti correlati è elencata nell'allegato I, parte A, il fabbricante o la persona fisica o giuridica di cui all'articolo 18 applica una delle procedure seguenti:\na) l’esame UE del tipo (modulo B) di cui all'allegato VII, seguito dalla conformità al tipo basata sul controllo interno della produzione (modulo C) di cui all'allegato VIII;\nb) la conformità basata sulla garanzia qualità totale (modulo H) di cui all'allegato IX;\nc) la conformità basata sulla verifica di un unico prodotto (modulo G) di cui all'allegato X.", "pages": [27, 27], "tags": ["macchina"], "always": false, "standards": []}, {"id": "MR-ART25-3", "law": "MR", "section": "MR-OBB", "group": "Art. 25 — Procedure di valutazione della conformità per le macchine e i prodotti correlati", "ref": "Art. 25, par. 3", "title": "Procedure di valutazione della conformità per le macchine e i prodotti correlati", "text": "Se la categoria di macchine o prodotti correlati è elencata nell'allegato I, parte B, il fabbricante o la persona fisica o giuridica di cui all'articolo 18 applica una delle procedure seguenti:\na) il controllo interno della produzione (modulo A) di cui all'allegato VI;\nb) l'esame UE del tipo (modulo B) di cui all'allegato VII, seguito dalla conformità al tipo basata sul controllo interno della produzione (modulo C) di cui all'allegato VIII;\nc) la conformità basata sulla garanzia qualità totale (modulo H) di cui all'allegato IX;\nd) la conformità basata sulla verifica di un unico prodotto (modulo G) di cui all'allegato X.\nSe applica la procedura di controllo interno della produzione di cui alla lettera a), il fabbricante progetta e costruisce la macchina o il prodotto correlato conformemente alle norme armonizzate o alle specifiche comuni proprie a tale categoria di macchine o prodotti correlati riguardanti tutti i pertinenti requisiti essenziali di sicurezza e di tutela della salute.\nSe la categoria di macchine o prodotti correlati è elencata nell'allegato I, parte B, e la macchina o il prodotto correlato non sono stati fabbricati conformemente alle norme armonizzate o alle specifiche comuni riguardanti tutti i pertinenti requisiti essenziali di sicurezza di tutela della salute per tale categoria di macchine o prodotti correlati, il fabbricante, compresa una persona fisica o giuridica di cui all’articolo 18, applica una delle procedure di cui alle lettere b), c) o d) del presente paragrafo.", "pages": [27, 28], "tags": ["macchina"], "always": false, "standards": []}, {"id": "MR-ART25-4", "law": "MR", "section": "MR-OBB", "group": "Art. 25 — Procedure di valutazione della conformità per le macchine e i prodotti correlati", "ref": "Art. 25, par. 4", "title": "Procedure di valutazione della conformità per le macchine e i prodotti correlati", "text": "Se la categoria di macchine o prodotti correlati non è elencata nell'allegato I, il fabbricante, compresa la persona fisica o giuridica di cui all'articolo 18 applica la procedura di controllo interno della produzione (modulo A) di cui all'allegato VI.", "pages": [28, 28], "tags": ["macchina"], "always": false, "standards": []}, {"id": "MR-IV-A-a", "law": "MR", "section": "MR-DOC", "group": "All. IV, parte A — Documentazione tecnica (macchine e prodotti correlati)", "ref": "All. IV, parte A, lettera a)", "title": "Descrizione completa e uso previsto", "text": "a) una descrizione completa della macchina o del prodotto correlato e del suo uso previsto;", "pages": [83, 83], "tags": ["macchina"], "always": false, "standards": []}, {"id": "MR-IV-A-b", "law": "MR", "section": "MR-DOC", "group": "All. IV, parte A — Documentazione tecnica (macchine e prodotti correlati)", "ref": "All. IV, parte A, lettera b)", "title": "Documentazione della valutazione del rischio", "text": "b) la documentazione relativa alla valutazione del rischio che deve dimostrare la procedura seguita, inclusi:\ni) un elenco dei requisiti essenziali di sicurezza e di tutela della salute applicabili alla macchina o al prodotto correlato;\nii) la descrizione delle misure di protezione attuate per soddisfare tutti i requisiti essenziali di sicurezza e di tutela della salute applicabili e, se del caso, l'indicazione dei rischi residui connessi con la macchina o il prodotto correlato;", "pages": [83, 83], "tags": ["macchina"], "always": false, "standards": ["EN ISO 12100:2010", "ISO/TR 14121-2:2012"]}, {"id": "MR-IV-A-c", "law": "MR", "section": "MR-DOC", "group": "All. IV, parte A — Documentazione tecnica (macchine e prodotti correlati)", "ref": "All. IV, parte A, lettera c)", "title": "Disegni e schemi di progettazione e fabbricazione", "text": "c) disegni e schemi di progettazione e fabbricazione della macchina o del prodotto correlato nonché dei suoi componenti, sottoinsiemi e circuiti;", "pages": [83, 83], "tags": ["macchina"], "always": false, "standards": []}, {"id": "MR-IV-A-d", "law": "MR", "section": "MR-DOC", "group": "All. IV, parte A — Documentazione tecnica (macchine e prodotti correlati)", "ref": "All. IV, parte A, lettera d)", "title": "Descrizioni per la comprensione di disegni e funzionamento", "text": "d) le descrizioni e le spiegazioni necessarie alla comprensione dei disegni e degli schemi di cui alla lettera c) nonché del funzionamento della macchina o del prodotto correlato;", "pages": [83, 83], "tags": ["macchina"], "always": false, "standards": []}, {"id": "MR-IV-A-e", "law": "MR", "section": "MR-DOC", "group": "All. IV, parte A — Documentazione tecnica (macchine e prodotti correlati)", "ref": "All. IV, parte A, lettera e)", "title": "Norme armonizzate / specifiche comuni applicate", "text": "e) i riferimenti delle norme armonizzate di cui all'articolo 20, paragrafo 1, o delle specifiche comuni adottate dalla Commissione a norma dell'articolo 20, paragrafo 3, che sono state applicate per la progettazione e la fabbricazione della macchina o del prodotto correlato. In caso di applicazione parziale delle norme armonizzate o delle specifiche comuni la documentazione tecnica deve specificare le parti che sono state applicate;", "pages": [83, 83], "tags": ["macchina"], "always": false, "standards": []}, {"id": "MR-IV-A-f", "law": "MR", "section": "MR-DOC", "group": "All. IV, parte A — Documentazione tecnica (macchine e prodotti correlati)", "ref": "All. IV, parte A, lettera f)", "title": "Altre specifiche tecniche applicate", "text": "f) se le norme armonizzate o le specifiche comuni non sono state applicate o lo sono state solo parzialmente, la descrizione delle altre specifiche tecniche che sono state applicate al fine di soddisfare tutti i requisiti essenziali di sicurezza e di tutela della salute e applicabili;", "pages": [83, 83], "tags": ["macchina"], "always": false, "standards": []}, {"id": "MR-IV-A-g", "law": "MR", "section": "MR-DOC", "group": "All. IV, parte A — Documentazione tecnica (macchine e prodotti correlati)", "ref": "All. IV, parte A, lettera g)", "title": "Relazioni di calcolo, prove, ispezioni ed esami", "text": "g) le relazioni e/o i risultati dei calcoli di progettazione, delle prove, delle ispezioni e degli esami effettuati per verificare la conformità della macchina o del prodotto correlato rispetto ai requisiti essenziali di sicurezza e di tutela della salute applicabili;", "pages": [83, 83], "tags": ["macchina"], "always": false, "standards": ["EN ISO 13849-2:2012"]}, {"id": "MR-IV-A-h", "law": "MR", "section": "MR-DOC", "group": "All. IV, parte A — Documentazione tecnica (macchine e prodotti correlati)", "ref": "All. IV, parte A, lettera h)", "title": "Mezzi per assicurare la conformità in produzione", "text": "h) una descrizione dei mezzi usati dal fabbricante durante la produzione della macchina o del prodotto correlato per assicurare la conformità della macchina o del prodotto correlato fabbricato rispetto alle specifiche di progettazione;", "pages": [83, 83], "tags": ["macchina"], "always": false, "standards": ["EN ISO 9001:2015"]}, {"id": "MR-IV-A-i", "law": "MR", "section": "MR-DOC", "group": "All. IV, parte A — Documentazione tecnica (macchine e prodotti correlati)", "ref": "All. IV, parte A, lettera i)", "title": "Copia delle istruzioni per l'uso", "text": "i) una copia delle istruzioni per l'uso e delle informazioni che figurano nell'allegato III, punto 1.7.4;", "pages": [83, 83], "tags": ["macchina"], "always": false, "standards": ["EN ISO 20607:2019", "EN IEC 82079-1:2020"]}, {"id": "MR-IV-A-j", "law": "MR", "section": "MR-DOC", "group": "All. IV, parte A — Documentazione tecnica (macchine e prodotti correlati)", "ref": "All. IV, parte A, lettera j)", "title": "Dichiarazione di incorporazione e istruzioni di assemblaggio", "text": "j) se del caso, la dichiarazione UE di incorporazione per le quasi-macchine di cui all'allegato V, parte B, e le istruzioni di assemblaggio di cui all’allegato XI;", "pages": [83, 83], "tags": ["macchina"], "always": false, "standards": []}, {"id": "MR-IV-A-k", "law": "MR", "section": "MR-DOC", "group": "All. IV, parte A — Documentazione tecnica (macchine e prodotti correlati)", "ref": "All. IV, parte A, lettera k)", "title": "Dichiarazioni UE di prodotti incorporati", "text": "k) se del caso, copie delle dichiarazioni UE di conformità delle macchine o dei prodotti correlati, nonché di qualsiasi prodotto disciplinato da altre normative di armonizzazione dell'Unione incorporate nella macchina o nel prodotto correlato;", "pages": [84, 84], "tags": ["macchina"], "always": false, "standards": []}, {"id": "MR-IV-A-l", "law": "MR", "section": "MR-DOC", "group": "All. IV, parte A — Documentazione tecnica (macchine e prodotti correlati)", "ref": "All. IV, parte A, lettera l)", "title": "Misure interne per la produzione in serie", "text": "l) per le macchine o i prodotti correlati fabbricati in serie, le misure interne che saranno attuate per garantire che tali macchine o prodotti correlati restino conformi al presente regolamento;", "pages": [84, 84], "tags": ["macchina"], "always": false, "standards": ["EN ISO 9001:2015"]}, {"id": "MR-IV-A-m", "law": "MR", "section": "MR-DOC", "group": "All. IV, parte A — Documentazione tecnica (macchine e prodotti correlati)", "ref": "All. IV, parte A, lettera m)", "title": "Codice sorgente / logica del software di sicurezza (su richiesta)", "text": "m) il codice sorgente o la logica di programmazione del software relativo alla sicurezza al fine di dimostrare la conformità della macchina o del prodotto correlato rispetto al presente regolamento a seguito di una richiesta motivata da parte di un'autorità nazionale competente, a condizione che sia necessario/a affinché tali autorità siano in grado di verificare il rispetto dei requisiti essenziali di sicurezza e di tutela della salute di cui all'allegato III;", "pages": [84, 84], "tags": ["macchina"], "always": false, "standards": ["EN ISO 13849-1:2023", "EN IEC 62061:2021 + A1:2024"]}, {"id": "MR-IV-A-n", "law": "MR", "section": "MR-DOC", "group": "All. IV, parte A — Documentazione tecnica (macchine e prodotti correlati)", "ref": "All. IV, parte A, lettera n)", "title": "Sistemi basati su sensori, remoti o autonomi", "text": "n) per le macchine alimentate da sensori, azionate da remoto o autonome o i prodotti correlati, se le operazioni relative alla sicurezza sono controllate da dati provenienti da sensori, una descrizione, se del caso, delle caratteristiche generali, delle capacità e delle limitazioni del sistema, dei dati, dello sviluppo, delle prove e della convalida dei processi utilizzati;", "pages": [84, 84], "tags": ["macchina"], "always": false, "standards": []}, {"id": "MR-IV-A-o", "law": "MR", "section": "MR-DOC", "group": "All. IV, parte A — Documentazione tecnica (macchine e prodotti correlati)", "ref": "All. IV, parte A, lettera o)", "title": "Ricerche e prove per montaggio e messa in servizio sicuri", "text": "o) i risultati di ricerche e prove su componenti, accessori o sulla macchina o il prodotto correlato svolte dal fabbricante per stabilire se la macchina o il prodotto correlato, in conseguenza della sua progettazione o costruzione, possano essere montati e messi in servizio in condizioni di sicurezza.", "pages": [84, 84], "tags": ["macchina"], "always": false, "standards": []}, {"id": "MR-IV-B-a", "law": "MR", "section": "MR-DOC", "group": "All. IV, parte B — Documentazione tecnica (quasi-macchine)", "ref": "All. IV, parte B, lettera a)", "title": "Descrizione completa e funzione prevista", "text": "a) una descrizione completa della quasi-macchina e della sua funzione prevista ove incorporata o assemblata ad altre macchine o ad altre quasi-macchine o apparecchi;", "pages": [84, 84], "tags": ["quasi_macchina"], "always": false, "standards": []}, {"id": "MR-IV-B-b", "law": "MR", "section": "MR-DOC", "group": "All. IV, parte B — Documentazione tecnica (quasi-macchine)", "ref": "All. IV, parte B, lettera b)", "title": "Documentazione della valutazione del rischio", "text": "b) la documentazione relativa alla valutazione del rischio che dimostra la procedura seguita, inclusi:\ni) un elenco dei requisiti essenziali di sicurezza e di tutela della salute applicabili alla quasi-macchina,\nii) una descrizione delle misure di protezione attuate per eliminare i pericoli identificati o per ridurre i rischi e, se del caso, l'indicazione dei rischi residui;", "pages": [84, 84], "tags": ["quasi_macchina"], "always": false, "standards": ["EN ISO 12100:2010", "ISO/TR 14121-2:2012"]}, {"id": "MR-IV-B-c", "law": "MR", "section": "MR-DOC", "group": "All. IV, parte B — Documentazione tecnica (quasi-macchine)", "ref": "All. IV, parte B, lettera c)", "title": "Disegni e schemi di progettazione e fabbricazione", "text": "c) disegni e schemi di progettazione e fabbricazione della quasi-macchina nonché dei suoi componenti, sottoinsiemi e circuiti;", "pages": [84, 84], "tags": ["quasi_macchina"], "always": false, "standards": []}, {"id": "MR-IV-B-d", "law": "MR", "section": "MR-DOC", "group": "All. IV, parte B — Documentazione tecnica (quasi-macchine)", "ref": "All. IV, parte B, lettera d)", "title": "Descrizioni per la comprensione di disegni e funzionamento", "text": "d) le descrizioni e le spiegazioni necessarie alla comprensione dei disegni e degli schemi di cui alla lettera c) nonché del funzionamento della quasi-macchina;", "pages": [84, 84], "tags": ["quasi_macchina"], "always": false, "standards": []}, {"id": "MR-IV-B-e", "law": "MR", "section": "MR-DOC", "group": "All. IV, parte B — Documentazione tecnica (quasi-macchine)", "ref": "All. IV, parte B, lettera e)", "title": "Norme armonizzate / specifiche comuni applicate", "text": "e) i riferimenti delle norme armonizzate a norma dell'articolo 20, paragrafo 1, o delle specifiche comuni adottate dalla Commissione a norma dell'articolo 20, paragrafo 3, che sono state applicate per la progettazione e la fabbricazione della quasi-macchina. In caso di applicazione parziale delle norme armonizzate o delle specifiche comuni la documentazione tecnica deve specificare le parti che sono state applicate;", "pages": [85, 85], "tags": ["quasi_macchina"], "always": false, "standards": []}, {"id": "MR-IV-B-f", "law": "MR", "section": "MR-DOC", "group": "All. IV, parte B — Documentazione tecnica (quasi-macchine)", "ref": "All. IV, parte B, lettera f)", "title": "Altre specifiche tecniche applicate", "text": "f) se le norme armonizzate o le specifiche comuni non sono state applicate o lo sono state solo parzialmente, le descrizioni delle altre specifiche tecniche che sono state applicate al fine di soddisfare tutti i requisiti essenziali di sicurezza e di tutela della salute e di applicabili;", "pages": [85, 85], "tags": ["quasi_macchina"], "always": false, "standards": []}, {"id": "MR-IV-B-g", "law": "MR", "section": "MR-DOC", "group": "All. IV, parte B — Documentazione tecnica (quasi-macchine)", "ref": "All. IV, parte B, lettera g)", "title": "Relazioni di calcolo, prove, ispezioni ed esami", "text": "g) le relazioni e/o i risultati dei calcoli di progettazione, delle prove, delle ispezioni e degli esami effettuati per verificare la conformità della quasi-macchina rispetto ai requisiti essenziali di sicurezza e di tutela della salute applicabili;", "pages": [85, 85], "tags": ["quasi_macchina"], "always": false, "standards": ["EN ISO 13849-2:2012"]}, {"id": "MR-IV-B-h", "law": "MR", "section": "MR-DOC", "group": "All. IV, parte B — Documentazione tecnica (quasi-macchine)", "ref": "All. IV, parte B, lettera h)", "title": "Mezzi per assicurare la conformità in produzione", "text": "h) una descrizione dei mezzi usati dal fabbricante durante la produzione della quasi-macchina per assicurare la conformità della quasi-macchina fabbricata rispetto alle specifiche di progettazione;", "pages": [85, 85], "tags": ["quasi_macchina"], "always": false, "standards": ["EN ISO 9001:2015"]}, {"id": "MR-IV-B-i", "law": "MR", "section": "MR-DOC", "group": "All. IV, parte B — Documentazione tecnica (quasi-macchine)", "ref": "All. IV, parte B, lettera i)", "title": "Copia delle istruzioni di assemblaggio (All. XI)", "text": "i) una copia delle istruzioni di assemblaggio per la quasi-macchina di cui all'allegato XI;", "pages": [85, 85], "tags": ["quasi_macchina"], "always": false, "standards": ["EN IEC 82079-1:2020"]}, {"id": "MR-IV-B-j", "law": "MR", "section": "MR-DOC", "group": "All. IV, parte B — Documentazione tecnica (quasi-macchine)", "ref": "All. IV, parte B, lettera j)", "title": "Misure interne per la produzione in serie", "text": "j) nel caso di quasi-macchine fabbricate in serie, le misure interne che saranno attuate per garantire che tali quasi-macchine restino conformi ai requisiti essenziali di sicurezza e di tutela della salute applicati;", "pages": [85, 85], "tags": ["quasi_macchina"], "always": false, "standards": ["EN ISO 9001:2015"]}, {"id": "MR-IV-B-k", "law": "MR", "section": "MR-DOC", "group": "All. IV, parte B — Documentazione tecnica (quasi-macchine)", "ref": "All. IV, parte B, lettera k)", "title": "Codice sorgente / logica del software di sicurezza (su richiesta)", "text": "k) il codice sorgente o la logica di programmazione del software relativo alla sicurezza, su richiesta motivata da parte di un'autorità nazionale competente, a condizione che tale codice sorgente o logica di programmazione siano necessari affinché tali autorità siano in grado di verificare il rispetto dei requisiti essenziali di sicurezza e di tutela della salute di cui all'allegato III;", "pages": [85, 85], "tags": ["quasi_macchina"], "always": false, "standards": ["EN ISO 13849-1:2023", "EN IEC 62061:2021 + A1:2024"]}, {"id": "MR-IV-B-l", "law": "MR", "section": "MR-DOC", "group": "All. IV, parte B — Documentazione tecnica (quasi-macchine)", "ref": "All. IV, parte B, lettera l)", "title": "Sistemi basati su sensori, remoti o autonomi", "text": "l) per una quasi-macchina alimentata da sensori, azionata da remoto o autonoma, se le operazioni relative alla sicurezza sono controllate da dati provenienti da sensori, una descrizione, se del caso, delle caratteristiche generali, delle capacità e delle limitazioni del sistema, dei dati, dello sviluppo, delle prove e della convalida dei processi utilizzati;", "pages": [85, 85], "tags": ["quasi_macchina"], "always": false, "standards": []}, {"id": "MR-IV-B-m", "law": "MR", "section": "MR-DOC", "group": "All. IV, parte B — Documentazione tecnica (quasi-macchine)", "ref": "All. IV, parte B, lettera m)", "title": "Ricerche e prove per incorporazione sicura", "text": "m) i risultati di ricerche e prove su componenti, accessori o sulla quasi-macchina svolte dal fabbricante per stabilire se la macchina, in conseguenza della sua progettazione o costruzione, possa essere montata e incorporata in condizioni di sicurezza.", "pages": [85, 85], "tags": ["quasi_macchina"], "always": false, "standards": []}, {"id": "MR-V-A", "law": "MR", "section": "MR-DOC", "group": "All. V — Dichiarazioni", "ref": "All. V, parte A", "title": "Contenuto della dichiarazione di conformità UE", "text": "PARTE A\nDichiarazione di conformità UE di macchine e prodotti correlati n. … (1)\nLa dichiarazione di conformità UE deve riportare le indicazioni seguenti:\n1. Macchina o prodotto correlato (prodotto, tipo, modello, lotto o numero di serie) o macchina o prodotto correlato che ha subito modifiche sostanziali.\n2. Nome e indirizzo del fabbricante e, se del caso, del suo mandatario.\n3. Per le macchine di sollevamento destinate ad essere installate in modo permanente in un edificio o in una struttura e che non possono essere assemblate nei locali del fabbricante ma che possono essere montate solo sul luogo di utilizzazione, l'indirizzo di tale luogo.\n4. La presente dichiarazione di conformità è rilasciata sotto l'esclusiva responsabilità del fabbricante.\n5. Oggetto della dichiarazione (identificazione della macchina o del prodotto correlato che ne consenta la rintracciabilità; se necessario per l'identificazione della macchina o del prodotto correlato, si può includere un'immagine a colori sufficientemente chiara).\n6. L'oggetto della dichiarazione di cui al punto 5 è conforme alla normativa di armonizzazione dell'Unione seguente.\n7. Riferimenti alle norme armonizzate di cui all'articolo 20, paragrafo 1, o alle specifiche comuni adottate dalla Commissione conformemente all'articolo 20, paragrafo 3, che sono state applicate, compresa la data della puboppure riferimenti ad altre specifiche tecniche, compresa la data, in relazione alla quale si dichiara la conformità. In caso di applicazione parziale delle norme armonizzate o delle specifiche comuni la dichiarazione UE di conformità deve specificare le parti che sono state applicate.\n8. Laddove applicabile, l'organismo notificato… (nome, numero) … ha effettuato l'esame UE del tipo (modulo B) e ha emesso il certificato di esame UE del tipo… (riferimento a tale certificato), seguito dalla conformità al tipo basata sul controllo interno della produzione (modulo C) o la conformità basata sulla verifica di un unico prodotto (modulo G) o sulla garanzia qualità totale (modulo H).\n9. Laddove applicabile, la macchina o il prodotto correlato sono soggetti alla procedura di valutazione della conformità basata sul controllo interno della produzione (modulo A).\n10. Informazioni supplementari:\nFirmato a nome e per conto di: …\n(luogo e data del rilascio):\n(nome e cognome, funzione) (firma):\n(1) L'assegnazione di un numero, da parte del fabbricante, alla dichiarazione di conformità è opzionale.", "pages": [86, 86], "tags": ["macchina"], "always": false, "standards": ["EN ISO/IEC 17050-1:2010"]}, {"id": "MR-V-B", "law": "MR", "section": "MR-DOC", "group": "All. V — Dichiarazioni", "ref": "All. V, parte B", "title": "Contenuto della dichiarazione di incorporazione UE", "text": "Dichiarazione di incorporazione UE di quasi-macchine n. … (2)\nLa dichiarazione di incorporazione deve contenere gli elementi seguenti:\n1. Quasi-macchina (numero di prodotto, di tipo, di modello, di lotto o di serie).\n2. Nome e indirizzo del fabbricante e, se del caso, del suo mandatario.\n3. La presente dichiarazione di incorporazione è rilasciata sotto l'esclusiva responsabilità del fabbricante.\n4. Oggetto della dichiarazione (identificazione della quasi-macchina che ne consenta la rintracciabilità; se necessario per l'identificazione della quasi-macchina, si può includere un'immagine a colori sufficientemente chiara).\n5. Un'indicazione con la quale si dichiara esplicitamente quali requisiti essenziali di sicurezza e di tutela della salute di cui all’allegato III del regolamento (UE) 2023/1230 del Parlamento europeo e del Consiglio (3) sono applicati e rispettati e che la documentazione tecnica pertinente è stata compilata in conformità dell'allegato IV, parte B e, se del caso, un'indicazione con la quale si dichiara che la quasi-macchina è conforme rispetto ad altra normativa di armonizzazione dell'Unione pertinente.\n6. Riferimenti alle norme armonizzate di cui all'articolo 20, paragrafo 1, o alle specifiche comuni adottate dalla Commissione conformemente all'articolo 20, paragrafo 3, che sono state applicate, compresa la data della norma o della specifica comune, oppure riferimenti ad altre specifiche tecniche, compresa la data, in relazione alla quale si dichiara la conformità. In caso di applicazione parziale delle norme armonizzate o delle specifiche comuni la dichiarazione UE di incorporazione deve specificare le parti che sono state applicate.\n7. Un impegno a trasmettere, in risposta a una richiesta adeguatamente motivata da parte delle autorità nazionali, informazioni pertinenti sulle quasi-macchine. L'impegno deve comprendere le modalità di trasmissione e lasciare impregiudicati i diritti di proprietà intellettuale del fabbricante della quasi-macchina.\n8. Una dichiarazione secondo cui la quasi-macchina non deve essere messa in servizio finché la macchina finale in cui deve essere incorporata non è stata dichiarata conforme al presente regolamento.\n9. Informazioni supplementari:\nFirmato a nome e per conto di: …\n(luogo e data del rilascio):\n(nome e cognome, funzione) (firma):\n(2) L'assegnazione di un numero alla dichiarazione di conformità è opzionale. (3) Regolamento (UE) 2023/1230 del Parlamento europeo e del Consiglio, del 14 giugno 2023, relativo alle macchine e che abroga la direttiva 2006/42/CE del Parlamento europeo e del Consiglio e la direttiva 73/361/CEE del Consiglio (GU L 165 del 29.6.2023, pag. 1).", "pages": [87, 87], "tags": ["quasi_macchina"], "always": false, "standards": ["EN ISO/IEC 17050-1:2010"]}, {"id": "CRA-I-1-1", "law": "CRA", "section": "CRA-I", "group": "All. I, parte I — Proprietà di sicurezza del prodotto", "ref": "All. I, parte I, punto 1", "title": "Livello adeguato di cibersicurezza in base ai rischi", "text": "I prodotti con elementi digitali sono progettati, sviluppati e prodotti in modo da garantire un livello adeguato di cibersicurezza in base ai rischi.", "pages": [68, 68], "tags": ["cra"], "always": true, "standards": ["EN IEC 62443-4-2:2019", "prEN 40000-1-2", "ETSI EN 303 645 V3.1.3 (2024-09)", "EN IEC 62443-3-3:2019"]}, {"id": "CRA-I-1-2a", "law": "CRA", "section": "CRA-I", "group": "All. I, parte I — Proprietà di sicurezza del prodotto", "ref": "All. I, parte I, punto 2, lettera a)", "title": "Nessuna vulnerabilità sfruttabile nota", "text": "sono messi a disposizione sul mercato senza vulnerabilità sfruttabili note;", "pages": [68, 68], "tags": ["cra"], "always": false, "standards": ["EN IEC 62443-4-2:2019", "prEN 40000-1-2", "ETSI EN 303 645 V3.1.3 (2024-09)", "EN IEC 62443-3-3:2019"]}, {"id": "CRA-I-1-2b", "law": "CRA", "section": "CRA-I", "group": "All. I, parte I — Proprietà di sicurezza del prodotto", "ref": "All. I, parte I, punto 2, lettera b)", "title": "Configurazione sicura per impostazione predefinita", "text": "sono messi a disposizione sul mercato con una configurazione sicura per impostazione predefinita, salvo diverso accordo tra il fabbricante e l’utilizzatore commerciale in relazione a un prodotto su misura con elementi digitali, con la possibilità di ripristinare il prodotto allo stato originale;", "pages": [68, 68], "tags": ["cra"], "always": false, "standards": ["EN IEC 62443-4-2:2019", "prEN 40000-1-2", "ETSI EN 303 645 V3.1.3 (2024-09)", "EN IEC 62443-3-3:2019"]}, {"id": "CRA-I-1-2c", "law": "CRA", "section": "CRA-I", "group": "All. I, parte I — Proprietà di sicurezza del prodotto", "ref": "All. I, parte I, punto 2, lettera c)", "title": "Gestione delle vulnerabilità tramite aggiornamenti di sicurezza", "text": "garantiscono che le vulnerabilità possano essere affrontate mediante aggiornamenti di sicurezza, anche, se del caso, mediante aggiornamenti di sicurezza automatici installati entro un periodo di tempo adeguato, abilitato come impostazione predefinita, con un meccanismo di disattivazione chiaro e di facile utilizzo, attraverso la notifica agli utilizzatori degli aggiornamenti disponibili e la possibilità di rinviarli temporaneamente;", "pages": [68, 68], "tags": ["cra"], "always": false, "standards": ["EN IEC 62443-4-2:2019", "prEN 40000-1-2", "ETSI EN 303 645 V3.1.3 (2024-09)", "EN IEC 62443-3-3:2019"]}, {"id": "CRA-I-1-2d", "law": "CRA", "section": "CRA-I", "group": "All. I, parte I — Proprietà di sicurezza del prodotto", "ref": "All. I, parte I, punto 2, lettera d)", "title": "Protezione dall'accesso non autorizzato", "text": "garantiscono la protezione dall’accesso non autorizzato mediante adeguati meccanismi di controllo, tra cui, a titolo esemplificativo ma non esaustivo, sistemi di autenticazione e di gestione dell’identità o dell’accesso, e segnalano eventuali accessi non autorizzati;", "pages": [68, 68], "tags": ["cra"], "always": false, "standards": ["EN IEC 62443-4-2:2019", "prEN 40000-1-2", "ETSI EN 303 645 V3.1.3 (2024-09)", "EN IEC 62443-3-3:2019"]}, {"id": "CRA-I-1-2e", "law": "CRA", "section": "CRA-I", "group": "All. I, parte I — Proprietà di sicurezza del prodotto", "ref": "All. I, parte I, punto 2, lettera e)", "title": "Riservatezza dei dati", "text": "proteggono la riservatezza dei dati personali o di altro tipo conservati, trasmessi o altrimenti trattati, ad esempio criptando i pertinenti dati a riposo o in transito mediante meccanismi all’avanguardia, e utilizzando altri mezzi tecnici;", "pages": [68, 68], "tags": ["cra"], "always": false, "standards": ["EN IEC 62443-4-2:2019", "prEN 40000-1-2", "ETSI EN 303 645 V3.1.3 (2024-09)", "EN IEC 62443-3-3:2019"]}, {"id": "CRA-I-1-2f", "law": "CRA", "section": "CRA-I", "group": "All. I, parte I — Proprietà di sicurezza del prodotto", "ref": "All. I, parte I, punto 2, lettera f)", "title": "Integrità di dati, comandi, programmi e configurazione", "text": "proteggono l’integrità dei dati personali o di altro tipo conservati, trasmessi o altrimenti trattati, dei comandi, dei programmi e della configurazione da qualsiasi manipolazione o modifica non autorizzata da parte dell’utilizzatore, e segnalano le corruzioni;", "pages": [68, 68], "tags": ["cra"], "always": false, "standards": ["EN IEC 62443-4-2:2019", "prEN 40000-1-2", "ETSI EN 303 645 V3.1.3 (2024-09)", "EN IEC 62443-3-3:2019"]}, {"id": "CRA-I-1-2g", "law": "CRA", "section": "CRA-I", "group": "All. I, parte I — Proprietà di sicurezza del prodotto", "ref": "All. I, parte I, punto 2, lettera g)", "title": "Minimizzazione dei dati", "text": "trattano solo dati, personali o di altro tipo, adeguati, pertinenti e limitati a quanto necessario in relazione alla finalità prevista del prodotto con elementi digitali («minimizzazione dei dati»);", "pages": [68, 68], "tags": ["cra"], "always": false, "standards": ["EN IEC 62443-4-2:2019", "prEN 40000-1-2", "ETSI EN 303 645 V3.1.3 (2024-09)", "EN IEC 62443-3-3:2019"]}, {"id": "CRA-I-1-2h", "law": "CRA", "section": "CRA-I", "group": "All. I, parte I — Proprietà di sicurezza del prodotto", "ref": "All. I, parte I, punto 2, lettera h)", "title": "Disponibilità delle funzioni essenziali e resilienza (DoS)", "text": "proteggono la disponibilità delle funzioni essenziali e di base, anche dopo un incidente, anche attraverso misure di resilienza e di attenuazione contro gli attacchi di negazione del servizio (denial of service);", "pages": [68, 68], "tags": ["cra"], "always": false, "standards": ["EN IEC 62443-4-2:2019", "prEN 40000-1-2", "ETSI EN 303 645 V3.1.3 (2024-09)", "EN IEC 62443-3-3:2019"]}, {"id": "CRA-I-1-2i", "law": "CRA", "section": "CRA-I", "group": "All. I, parte I — Proprietà di sicurezza del prodotto", "ref": "All. I, parte I, punto 2, lettera i)", "title": "Impatto minimo su altri dispositivi o reti", "text": "riducono al minimo l’impatto negativo dei prodotti stessi o dei dispositivi connessi sulla disponibilità dei servizi forniti da altri dispositivi o reti;", "pages": [68, 68], "tags": ["cra"], "always": false, "standards": ["EN IEC 62443-4-2:2019", "prEN 40000-1-2", "ETSI EN 303 645 V3.1.3 (2024-09)", "EN IEC 62443-3-3:2019"]}, {"id": "CRA-I-1-2j", "law": "CRA", "section": "CRA-I", "group": "All. I, parte I — Proprietà di sicurezza del prodotto", "ref": "All. I, parte I, punto 2, lettera j)", "title": "Limitazione delle superfici di attacco", "text": "sono progettati, sviluppati e prodotti per limitare le superfici di attacco, comprese le interfacce esterne;", "pages": [68, 68], "tags": ["cra"], "always": false, "standards": ["EN IEC 62443-4-2:2019", "prEN 40000-1-2", "ETSI EN 303 645 V3.1.3 (2024-09)", "EN IEC 62443-3-3:2019"]}, {"id": "CRA-I-1-2k", "law": "CRA", "section": "CRA-I", "group": "All. I, parte I — Proprietà di sicurezza del prodotto", "ref": "All. I, parte I, punto 2, lettera k)", "title": "Attenuazione dell'impatto degli incidenti", "text": "sono progettati, sviluppati e prodotti per ridurre l’impatto degli incidenti utilizzando meccanismi e tecniche di attenuazione dello sfruttamento adeguati;", "pages": [68, 68], "tags": ["cra"], "always": false, "standards": ["EN IEC 62443-4-2:2019", "prEN 40000-1-2", "ETSI EN 303 645 V3.1.3 (2024-09)", "EN IEC 62443-3-3:2019"]}, {"id": "CRA-I-1-2l", "law": "CRA", "section": "CRA-I", "group": "All. I, parte I — Proprietà di sicurezza del prodotto", "ref": "All. I, parte I, punto 2, lettera l)", "title": "Registrazione e monitoraggio delle attività", "text": "forniscono informazioni sulla sicurezza registrando e monitorando le attività interne pertinenti, compresi l’accesso a dati, servizi o funzioni o la modifica degli stessi, con un meccanismo di disattivazione per l’utilizzatore;", "pages": [68, 68], "tags": ["cra"], "always": false, "standards": ["EN IEC 62443-4-2:2019", "prEN 40000-1-2", "ETSI EN 303 645 V3.1.3 (2024-09)", "EN IEC 62443-3-3:2019"]}, {"id": "CRA-I-1-2m", "law": "CRA", "section": "CRA-I", "group": "All. I, parte I — Proprietà di sicurezza del prodotto", "ref": "All. I, parte I, punto 2, lettera m)", "title": "Rimozione sicura di dati e impostazioni", "text": "offrono agli utenti la possibilità di rimuovere in modo sicuro e agevole, su base permanente, tutti i dati e tutte le impostazioni e, qualora tali dati possano essere trasferiti ad altri prodotti o sistemi, garantiscono che ciò avvenga in modo sicuro.", "pages": [68, 68], "tags": ["cra"], "always": false, "standards": ["EN IEC 62443-4-2:2019", "prEN 40000-1-2", "ETSI EN 303 645 V3.1.3 (2024-09)", "EN IEC 62443-3-3:2019"]}, {"id": "CRA-I-2-1", "law": "CRA", "section": "CRA-I", "group": "All. I, parte II — Gestione delle vulnerabilità", "ref": "All. I, parte II, punto 1", "title": "Identificazione delle vulnerabilità e SBOM", "text": "identificano e documentano le vulnerabilità e i componenti contenuti nel prodotto con elementi digitali, redigendo anche una distinta base del software in un formato di uso comune e leggibile da un dispositivo automatico, che includa almeno le dipendenze di primo livello del prodotto;", "pages": [68, 68], "tags": ["cra"], "always": true, "standards": ["EN IEC 62443-4-1:2018", "prEN 40000-1-3", "ISO/IEC 30111:2019", "ISO/IEC 29147:2018"]}, {"id": "CRA-I-2-2", "law": "CRA", "section": "CRA-I", "group": "All. I, parte II — Gestione delle vulnerabilità", "ref": "All. I, parte II, punto 2", "title": "Correzione tempestiva delle vulnerabilità", "text": "in relazione ai rischi posti dai prodotti con elementi digitali, affrontano e correggono tempestivamente le vulnerabilità, anche fornendo aggiornamenti di sicurezza; ove tecnicamente fattibile, nuovi aggiornamenti di sicurezza sono forniti separatamente dagli aggiornamenti della funzionalità;", "pages": [69, 69], "tags": ["cra"], "always": true, "standards": ["EN IEC 62443-4-1:2018", "prEN 40000-1-3", "ISO/IEC 30111:2019", "ISO/IEC 29147:2018"]}, {"id": "CRA-I-2-3", "law": "CRA", "section": "CRA-I", "group": "All. I, parte II — Gestione delle vulnerabilità", "ref": "All. I, parte II, punto 3", "title": "Prove e riesami periodici di sicurezza", "text": "effettuano prove e riesami efficaci e periodici della sicurezza del prodotto con elementi digitali;", "pages": [69, 69], "tags": ["cra"], "always": true, "standards": ["EN IEC 62443-4-1:2018", "prEN 40000-1-3", "ISO/IEC 30111:2019", "ISO/IEC 29147:2018"]}, {"id": "CRA-I-2-4", "law": "CRA", "section": "CRA-I", "group": "All. I, parte II — Gestione delle vulnerabilità", "ref": "All. I, parte II, punto 4", "title": "Divulgazione delle vulnerabilità risolte", "text": "una volta reso disponibile un aggiornamento di sicurezza, condividono e divulgano pubblicamente informazioni sulle vulnerabilità risolte, compresi una descrizione delle vulnerabilità, informazioni che consentano agli utilizzatori di identificare il prodotto con elementi digitali interessato, l’impatto delle vulnerabilità, la loro gravità e informazioni chiare e accessibili che aiutino gli utilizzatori a correggere le vulnerabilità; in casi debitamente giustificati, qualora ritengano che i rischi di sicurezza legati alla divulgazione siano superiori ai benefici in termini di sicurezza, i fabbricanti possono ritardare la divulgazione di informazioni su una vulnerabilità risolta fino a quando gli utilizzatori non abbiano avuto la possibilità di applicare la pertinente patch;", "pages": [69, 69], "tags": ["cra"], "always": true, "standards": ["EN IEC 62443-4-1:2018", "prEN 40000-1-3", "ISO/IEC 30111:2019", "ISO/IEC 29147:2018"]}, {"id": "CRA-I-2-5", "law": "CRA", "section": "CRA-I", "group": "All. I, parte II — Gestione delle vulnerabilità", "ref": "All. I, parte II, punto 5", "title": "Politica di divulgazione coordinata (CVD)", "text": "mettono in atto e applicano una politica di divulgazione coordinata delle vulnerabilità;", "pages": [69, 69], "tags": ["cra"], "always": true, "standards": ["EN IEC 62443-4-1:2018", "prEN 40000-1-3", "ISO/IEC 30111:2019", "ISO/IEC 29147:2018"]}, {"id": "CRA-I-2-6", "law": "CRA", "section": "CRA-I", "group": "All. I, parte II — Gestione delle vulnerabilità", "ref": "All. I, parte II, punto 6", "title": "Condivisione informazioni e contatto per segnalazioni", "text": "adottano misure per facilitare la condivisione di informazioni sulle potenziali vulnerabilità nel loro prodotto con elementi digitali e nei componenti di terzi contenuti in tale prodotto, fornendo anche un indirizzo di contatto per la segnalazione delle vulnerabilità individuate nel prodotto con elementi digitali;", "pages": [69, 69], "tags": ["cra"], "always": true, "standards": ["EN IEC 62443-4-1:2018", "prEN 40000-1-3", "ISO/IEC 30111:2019", "ISO/IEC 29147:2018"]}, {"id": "CRA-I-2-7", "law": "CRA", "section": "CRA-I", "group": "All. I, parte II — Gestione delle vulnerabilità", "ref": "All. I, parte II, punto 7", "title": "Distribuzione sicura degli aggiornamenti", "text": "prevedono meccanismi per distribuire in modo sicuro gli aggiornamenti dei prodotti con elementi digitali, per garantire che le vulnerabilità siano corrette o attenuate in modo tempestivo e, ove applicabile per gli aggiornamenti di sicurezza, in modo automatico;", "pages": [69, 69], "tags": ["cra"], "always": true, "standards": ["EN IEC 62443-4-1:2018", "prEN 40000-1-3", "ISO/IEC 30111:2019", "ISO/IEC 29147:2018"]}, {"id": "CRA-I-2-8", "law": "CRA", "section": "CRA-I", "group": "All. I, parte II — Gestione delle vulnerabilità", "ref": "All. I, parte II, punto 8", "title": "Diffusione tempestiva e gratuita degli aggiornamenti", "text": "garantiscono che, qualora disponibili, siano diffusi tempestivamente e gratuitamente, salvo diversamente convenuto tra un fabbricante e un utilizzatore commerciale in relazione a un prodotto su misura con elementi digitali, aggiornamenti di sicurezza per risolvere i problemi di sicurezza individuati, accompagnati da messaggi di avviso che forniscano agli utilizzatori le informazioni pertinenti, comprese le potenziali misure da adottare.", "pages": [69, 69], "tags": ["cra"], "always": true, "standards": ["EN IEC 62443-4-1:2018", "prEN 40000-1-3", "ISO/IEC 30111:2019", "ISO/IEC 29147:2018"]}, {"id": "CRA-ART7-1", "law": "CRA", "section": "CRA-OBB", "group": "Art. 7 — Prodotti con elementi digitali importanti", "ref": "Art. 7, par. 1", "title": "Prodotti con elementi digitali importanti", "text": "I prodotti con elementi digitali che hanno la funzionalità principale di una categoria di prodotti di cui all’allegato III sono considerati prodotti con elementi digitali importanti e sono soggetti alle procedure di valutazione della conformità di cui all’articolo 32, paragrafi 2 e 3. L’integrazione di un prodotto con elementi digitali che ha la funzionalità principale di una categoria di prodotti di cui all’allegato III non rende di per sé il prodotto in cui è integrato assoggettato alle procedure di valutazione della conformità di cui all’articolo 32, paragrafi 2 e 3.", "pages": [32, 32], "tags": ["cra"], "always": false, "standards": []}, {"id": "CRA-ART13-1", "law": "CRA", "section": "CRA-OBB", "group": "Art. 13 — Obblighi dei fabbricanti", "ref": "Art. 13, par. 1", "title": "Obblighi dei fabbricanti", "text": "All’atto dell’immissione sul mercato di un prodotto con elementi digitali, i fabbricanti assicurano che esso sia stato progettato, sviluppato e prodotto conformemente ai requisiti essenziali di cibersicurezza di cui all’allegato I, parte I.", "pages": [35, 35], "tags": ["cra"], "always": false, "standards": []}, {"id": "CRA-ART13-2", "law": "CRA", "section": "CRA-OBB", "group": "Art. 13 — Obblighi dei fabbricanti", "ref": "Art. 13, par. 2", "title": "Obblighi dei fabbricanti", "text": "Ai fini della conformità al paragrafo 1, i fabbricanti effettuano una valutazione dei rischi di cibersicurezza associati a un prodotto con elementi digitali e tengono conto dei risultati di tale valutazione durante le fasi di pianificazione, progettazione, sviluppo, produzione, consegna e manutenzione del prodotto con elementi digitali, allo scopo di ridurre al minimo i rischi di cibersicurezza, prevenire gli incidenti e ridurne al minimo il loro impatto, anche in relazione alla salute e alla sicurezza degli utilizzatori.", "pages": [35, 35], "tags": ["cra"], "always": false, "standards": ["EN IEC 62443-3-2:2020", "ISO/IEC 27005:2022", "prEN 40000-1-2"]}, {"id": "CRA-ART13-3", "law": "CRA", "section": "CRA-OBB", "group": "Art. 13 — Obblighi dei fabbricanti", "ref": "Art. 13, par. 3", "title": "Obblighi dei fabbricanti", "text": "La valutazione dei rischi di cibersicurezza è documentata e aggiornata, se del caso, durante un periodo di assistenza da determinare conformemente al paragrafo 8 del presente articolo. Tale valutazione comprende almeno un’analisi dei rischi di cibersicurezza basata sulla finalità prevista e sull’uso ragionevolmente prevedibile del prodotto con elementi digitali, nonché sulle sue condizioni d’uso, quali l’ambiente operativo o gli attivi da proteggere, tenendo conto della durata di utilizzo del prodotto prevista. La valutazione dei rischi di cibersicurezza indica se, ed eventualmente in che modo, i requisiti di sicurezza di cui all’allegato I, parte I, punto 2, sono applicabili al pertinente prodotto con elementi digitali e le modalità di attuazione di tali requisiti sulla base della valutazione dei rischi di cibersicurezza. Indica inoltre le modalità con cui il fabbricante intende applicare l’allegato I, parte I, punto 1, e i requisiti di gestione delle vulnerabilità di cui all’allegato I, parte II.", "pages": [35, 35], "tags": ["cra"], "always": false, "standards": ["EN IEC 62443-3-2:2020", "ISO/IEC 27005:2022", "prEN 40000-1-2"]}, {"id": "CRA-ART13-4", "law": "CRA", "section": "CRA-OBB", "group": "Art. 13 — Obblighi dei fabbricanti", "ref": "Art. 13, par. 4", "title": "Obblighi dei fabbricanti", "text": "All’atto dell’immissione sul mercato di un prodotto con elementi digitali, il fabbricante include la valutazione dei rischi di cibersicurezza di cui al paragrafo 3 del presente articolo nella documentazione tecnica richiesta a norma dell’articolo 31 e dell’allegato VII. Per i prodotti con elementi digitali di cui all’articolo 12, che sono soggetti anche ad altri atti giuridici dell’Unione, la valutazione dei rischi di cibersicurezza può far parte della valutazione dei rischi prevista da tali atti giuridici dell’Unione. Se alcuni requisiti essenziali di cibersicurezza non sono applicabili al prodotto con elementi digitali, il fabbricante fornisce una chiara giustificazione in tal senso nella suddetta documentazione tecnica.", "pages": [35, 35], "tags": ["cra"], "always": false, "standards": ["EN IEC 62443-3-2:2020"]}, {"id": "CRA-ART13-5", "law": "CRA", "section": "CRA-OBB", "group": "Art. 13 — Obblighi dei fabbricanti", "ref": "Art. 13, par. 5", "title": "Obblighi dei fabbricanti", "text": "Ai fini dell’adempimento dell’obbligo di cui al paragrafo 1, i fabbricanti esercitano la dovuta diligenza quando integrano componenti provenienti da terzi affinché tali componenti non compromettano la cibersicurezza del prodotto con elementi digitali, anche quando integrano componenti di software liberi e open source che non sono stati messi a disposizione sul mercato nel corso di un’attività commerciale.", "pages": [35, 35], "tags": ["cra"], "always": false, "standards": ["EN IEC 62443-4-1:2018"]}, {"id": "CRA-ART13-6", "law": "CRA", "section": "CRA-OBB", "group": "Art. 13 — Obblighi dei fabbricanti", "ref": "Art. 13, par. 6", "title": "Obblighi dei fabbricanti", "text": "Quando è individuata una vulnerabilità in un componente, compreso un componente open source, integrato nel prodotto con elementi digitali, i fabbricanti la segnalano alla persona o al soggetto che si occupa della fabbricazione o della manutenzione del componente e affrontano e correggono la vulnerabilità conformemente ai requisiti di gestione delle vulnerabilità di cui all’allegato I, parte II. Qualora abbiano sviluppato una modifica del software o dell’hardware per affrontare la vulnerabilità di tale componente, i fabbricanti condividono il codice o la documentazione pertinenti con la persona o il soggetto che si occupa della fabbricazione o della manutenzione del componente, se del caso in un formato leggibile da un dispositivo automatico.", "pages": [36, 36], "tags": ["cra"], "always": false, "standards": ["ISO/IEC 29147:2018", "ISO/IEC 30111:2019", "prEN 40000-1-3"]}, {"id": "CRA-ART13-7", "law": "CRA", "section": "CRA-OBB", "group": "Art. 13 — Obblighi dei fabbricanti", "ref": "Art. 13, par. 7", "title": "Obblighi dei fabbricanti", "text": "I fabbricanti documentano sistematicamente, in modo proporzionato alla natura e ai rischi di cibersicurezza, gli aspetti pertinenti di cibersicurezza relativi al prodotto con elementi digitali, comprese le vulnerabilità di cui vengono a conoscenza e qualsiasi informazione pertinente fornita da terzi e, se del caso, aggiornano la valutazione dei rischi di cibersicurezza del prodotto.", "pages": [36, 36], "tags": ["cra"], "always": false, "standards": []}, {"id": "CRA-ART13-8", "law": "CRA", "section": "CRA-OBB", "group": "Art. 13 — Obblighi dei fabbricanti", "ref": "Art. 13, par. 8", "title": "Obblighi dei fabbricanti", "text": "All’atto dell’immissione sul mercato di un prodotto con elementi digitali e per la durata del periodo di assistenza, i fabbricanti garantiscono che le vulnerabilità di tale prodotto, compresi i suoi componenti, siano gestite in modo efficace e in conformità dei requisiti essenziali di cibersicurezza di cui all’allegato I, parte II.\nI fabbricanti determinano il periodo di assistenza in modo che rifletta la durata di utilizzo prevista del prodotto, tenendo conto, in particolare, delle ragionevoli aspettative degli utilizzatori, della natura del prodotto, compresa la sua finalità prevista, nonché del pertinente diritto dell’Unione che determina la durata di vita dei prodotti con elementi digitali. Nel determinare il periodo di assistenza, i fabbricanti possono tenere conto anche dei periodi di assistenza dei prodotti con elementi digitali che offrono funzionalità analoghe immessi sul mercato da altri fabbricanti, della disponibilità dell’ambiente operativo, dei periodi di assistenza dei componenti integrati che forniscono funzioni essenziali e che provengono da terzi, nonché degli orientamenti pertinenti forniti dall’apposito gruppo di cooperazione amministrativa (ADCO) istituito a norma dell’articolo 52, paragrafo 15, e dalla Commissione. Le questioni da prendere in considerazione per determinare il periodo di assistenza sono prese in considerazione in modo da garantire la proporzionalità.\nFatto salvo il secondo comma, il periodo di assistenza è di almeno cinque anni. Se si prevede che il prodotto con elementi digitali sarà utilizzato per meno di cinque anni, il periodo di assistenza corrisponde alla durata di utilizzo prevista.\nTenendo conto delle raccomandazioni dell’ADCO di cui all’articolo 52, paragrafo 16, la Commissione può adottare atti delegati conformemente all’articolo 61 al fine di integrare il presente regolamento specificando il periodo minimo di assistenza per determinate categorie di prodotti qualora i dati di vigilanza del mercato suggeriscano l’inadeguatezza dei periodi di assistenza.\nI fabbricanti includono nella documentazione tecnica di cui all’allegato VII le informazioni prese in considerazione per determinare il periodo di assistenza di un prodotto con elementi digitali.\nI fabbricanti dispongono di politiche e procedure adeguate, comprese politiche di divulgazione coordinata delle vulnerabilità, di cui all’allegato I, parte II, punto 5, per trattare e correggere potenziali vulnerabilità del prodotto con elementi digitali segnalate da fonti interne o esterne.", "pages": [36, 36], "tags": ["cra"], "always": false, "standards": ["EN IEC 62443-4-1:2018", "ISO/IEC 30111:2019", "prEN 40000-1-3"]}, {"id": "CRA-ART13-9", "law": "CRA", "section": "CRA-OBB", "group": "Art. 13 — Obblighi dei fabbricanti", "ref": "Art. 13, par. 9", "title": "Obblighi dei fabbricanti", "text": "I fabbricanti garantiscono che ciascun aggiornamento di sicurezza di cui all’allegato I, parte II, punto 8, che è stato messo a disposizione degli utilizzatori durante il periodo di assistenza, rimanga disponibile dopo il rilascio per un minimo di dieci anni o per il restante periodo di assistenza, se quest’ultimo è superiore.", "pages": [36, 36], "tags": ["cra"], "always": false, "standards": []}, {"id": "CRA-ART13-10", "law": "CRA", "section": "CRA-OBB", "group": "Art. 13 — Obblighi dei fabbricanti", "ref": "Art. 13, par. 10", "title": "Obblighi dei fabbricanti", "text": "Il fabbricante che abbia immesso sul mercato versioni successive sostanzialmente modificate di un software può garantire la conformità al requisito essenziale di cibersicurezza di cui all’allegato I, parte II, punto 2, solo per l’ultima versione immessa sul mercato, a condizione che gli utilizzatori delle versioni precedentemente immesse sul mercato abbiano accesso gratuito all’ultima versione immessa sul mercato e non debbano sostenere costi aggiuntivi per adeguare l’ambiente hardware e software in cui utilizzano la versione originale del prodotto.", "pages": [36, 36], "tags": ["cra"], "always": false, "standards": []}, {"id": "CRA-ART13-11", "law": "CRA", "section": "CRA-OBB", "group": "Art. 13 — Obblighi dei fabbricanti", "ref": "Art. 13, par. 11", "title": "Obblighi dei fabbricanti", "text": "I fabbricanti possono tenere archivi pubblici di software per migliorare l’accesso degli utilizzatori alle versioni precedenti. In questi casi, gli utilizzatori sono informati in modo chiaro e facilmente accessibile dei rischi associati all’uso di software privi di assistenza.", "pages": [36, 36], "tags": ["cra"], "always": false, "standards": []}, {"id": "CRA-ART13-12", "law": "CRA", "section": "CRA-OBB", "group": "Art. 13 — Obblighi dei fabbricanti", "ref": "Art. 13, par. 12", "title": "Obblighi dei fabbricanti", "text": "Prima di immettere un prodotto con elementi digitali sul mercato, i fabbricanti redigono la documentazione tecnica di cui all’articolo 31.\nEssi seguono o fanno eseguire le procedure di valutazione della conformità prescelte di cui all’articolo 32.\nSe tale procedura di valutazione della conformità dimostra la conformità del prodotto con elementi digitali ai requisiti essenziali di cibersicurezza di cui all’allegato I, parte I, e dei processi messi in atto dal fabbricante ai requisiti essenziali di cibersicurezza di cui all’allegato I, parte II, i fabbricanti redigono la dichiarazione di conformità UE conformemente all’articolo 28 e appongono la marcatura CE conformemente all’articolo 30.", "pages": [36, 37], "tags": ["cra"], "always": false, "standards": []}, {"id": "CRA-ART13-13", "law": "CRA", "section": "CRA-OBB", "group": "Art. 13 — Obblighi dei fabbricanti", "ref": "Art. 13, par. 13", "title": "Obblighi dei fabbricanti", "text": "I fabbricanti tengono la documentazione tecnica e la dichiarazione di conformità UE a disposizione delle autorità di vigilanza del mercato per un periodo di almeno dieci anni dalla data di immissione sul mercato del prodotto con elementi digitali o per il periodo di assistenza, se quest’ultimo è superiore.", "pages": [37, 37], "tags": ["cra"], "always": false, "standards": []}, {"id": "CRA-ART13-14", "law": "CRA", "section": "CRA-OBB", "group": "Art. 13 — Obblighi dei fabbricanti", "ref": "Art. 13, par. 14", "title": "Obblighi dei fabbricanti", "text": "I fabbricanti si assicurano che siano predisposte le procedure necessarie affinché i prodotti con elementi digitali fabbricati nell’ambito di una produzione in serie rimangano conformi al presente regolamento. I fabbricanti tengono adeguatamente conto delle modifiche del processo di sviluppo e di produzione o della progettazione o delle caratteristiche del prodotto con elementi digitali, nonché delle modifiche delle norme armonizzate, dei sistemi europei di certificazione della cibersicurezza o delle specifiche comuni di cui all’articolo 27 con riferimento alle quali è dichiarata la conformità del prodotto con elementi digitali o mediante applicazione delle quali tale conformità è verificata.", "pages": [37, 37], "tags": ["cra"], "always": false, "standards": []}, {"id": "CRA-ART13-15", "law": "CRA", "section": "CRA-OBB", "group": "Art. 13 — Obblighi dei fabbricanti", "ref": "Art. 13, par. 15", "title": "Obblighi dei fabbricanti", "text": "I fabbricanti garantiscono che i loro prodotti con elementi digitali rechino un numero di tipo, di lotto o di serie o qualsiasi altro elemento che ne consenta l’identificazione, oppure, qualora ciò non sia possibile, che tali informazioni siano fornite sull’imballaggio o in un documento di accompagnamento del prodotto con elementi digitali.", "pages": [37, 37], "tags": ["cra"], "always": false, "standards": []}, {"id": "CRA-ART13-16", "law": "CRA", "section": "CRA-OBB", "group": "Art. 13 — Obblighi dei fabbricanti", "ref": "Art. 13, par. 16", "title": "Obblighi dei fabbricanti", "text": "I fabbricanti indicano il loro nome, la loro denominazione commerciale registrata o il loro marchio registrato, l’indirizzo postale, l’indirizzo di posta elettronica o altri dati di contatto digitale nonché, se disponibile, il sito web presso cui possono essere contattati, sul prodotto con elementi digitali, sull’imballaggio o in un documento di accompagnamento del prodotto con elementi digitali. Tali informazioni sono incluse anche nelle informazioni e nelle istruzioni per l’utilizzatore di cui all’allegato II. I dati di recapito sono redatti in una lingua facilmente comprensibile dagli utilizzatori e dalle autorità di vigilanza del mercato.", "pages": [37, 37], "tags": ["cra"], "always": false, "standards": []}, {"id": "CRA-ART13-17", "law": "CRA", "section": "CRA-OBB", "group": "Art. 13 — Obblighi dei fabbricanti", "ref": "Art. 13, par. 17", "title": "Obblighi dei fabbricanti", "text": "Ai fini del presente regolamento, i fabbricanti designano un punto di contatto unico che consenta agli utilizzatori di comunicare direttamente e rapidamente con loro, anche per facilitare la segnalazione di vulnerabilità del prodotto con elementi digitali.\nI fabbricanti garantiscono che il punto di contatto unico sia facilmente identificabile dagli utilizzatori. Essi includono inoltre il punto di contatto unico nelle informazioni e istruzioni per l’utilizzatore di cui all’allegato II.\nIl punto di contatto unico consente agli utilizzatori di scegliere i mezzi di comunicazione preferiti, senza limitarli agli strumenti automatizzati.", "pages": [37, 37], "tags": ["cra"], "always": false, "standards": ["ISO/IEC 29147:2018"]}, {"id": "CRA-ART13-18", "law": "CRA", "section": "CRA-OBB", "group": "Art. 13 — Obblighi dei fabbricanti", "ref": "Art. 13, par. 18", "title": "Obblighi dei fabbricanti", "text": "I fabbricanti provvedono affinché i prodotti con elementi digitali siano accompagnati dalle informazioni e dalle istruzioni per l’utilizzatore di cui all’allegato II in forma cartacea o elettronica. Tali informazioni e istruzioni sono fornite in una lingua facilmente comprensibile dagli utilizzatori e dalle autorità di vigilanza del mercato. Sono chiare, comprensibili, intelligibili e leggibili. Consentono un’installazione, un funzionamento e un utilizzo sicuri dei prodotti con elementi digitali. I fabbricanti mantengono a disposizione degli utilizzatori e delle autorità di vigilanza del mercato le informazioni e istruzioni per l’utilizzatore di cui all’allegato II per un periodo di almeno dieci anni dalla data in cui il prodotto con elementi digitali è stato immesso sul mercato o per il periodo di assistenza, se quest’ultimo è superiore. Qualora tali informazioni e istruzioni siano fornite online, i fabbricanti garantiscono che siano accessibili, di facile uso e disponibili online per un periodo di almeno dieci anni dalla data in cui il prodotto con elementi digitali è stato immesso sul mercato o per il periodo di assistenza, se quest’ultimo è superiore.", "pages": [37, 37], "tags": ["cra"], "always": false, "standards": ["EN IEC 82079-1:2020"]}, {"id": "CRA-ART13-19", "law": "CRA", "section": "CRA-OBB", "group": "Art. 13 — Obblighi dei fabbricanti", "ref": "Art. 13, par. 19", "title": "Obblighi dei fabbricanti", "text": "I fabbricanti garantiscono che la data finale del periodo di assistenza di cui al paragrafo 8, comprendente almeno il mese e l’anno, sia specificata in modo chiaro e comprensibile al momento dell’acquisto in modo facilmente accessibile e, se del caso, sul prodotto con elementi digitali, sul suo imballaggio o con mezzi digitali.\nOve tecnicamente fattibile alla luce della natura del prodotto con elementi digitali, i fabbricanti inviano una notifica agli utilizzatori per informarli che il loro prodotto con elementi digitali ha raggiunto la fine del periodo di assistenza.", "pages": [37, 37], "tags": ["cra"], "always": false, "standards": []}, {"id": "CRA-ART13-20", "law": "CRA", "section": "CRA-OBB", "group": "Art. 13 — Obblighi dei fabbricanti", "ref": "Art. 13, par. 20", "title": "Obblighi dei fabbricanti", "text": "I fabbricanti forniscono una copia della dichiarazione di conformità UE o una dichiarazione di conformità UE semplificata con il prodotto con elementi digitali. Se è fornita una dichiarazione di conformità UE semplificata, questa contiene l’esatto indirizzo Internet dove è possibile accedere alla dichiarazione di conformità UE completa.", "pages": [37, 37], "tags": ["cra"], "always": false, "standards": ["EN ISO/IEC 17050-1:2010"]}, {"id": "CRA-ART13-21", "law": "CRA", "section": "CRA-OBB", "group": "Art. 13 — Obblighi dei fabbricanti", "ref": "Art. 13, par. 21", "title": "Obblighi dei fabbricanti", "text": "A partire dall’immissione sul mercato e per la durata del periodo di assistenza, i fabbricanti che hanno la certezza o motivo di credere che il prodotto con elementi digitali o i processi messi in atto dal fabbricante non siano conformi ai requisiti essenziali di cibersicurezza di cui all’allegato I adottano immediatamente le misure correttive necessarie per rendere conformi il prodotto con elementi digitali o i processi del fabbricante oppure, a seconda dei casi, per ritirare o richiamare il prodotto.", "pages": [38, 38], "tags": ["cra"], "always": false, "standards": []}, {"id": "CRA-ART13-22", "law": "CRA", "section": "CRA-OBB", "group": "Art. 13 — Obblighi dei fabbricanti", "ref": "Art. 13, par. 22", "title": "Obblighi dei fabbricanti", "text": "I fabbricanti, su richiesta motivata di un’autorità di vigilanza del mercato, forniscono a tale autorità, in una lingua che può essere facilmente compresa da quest’ultima, tutte le informazioni e la documentazione, in formato cartaceo o elettronico, necessarie a dimostrare la conformità del prodotto con elementi digitali e dei processi messi in atto dal fabbricante ai requisiti essenziali di cibersicurezza di cui all’allegato I. I fabbricanti cooperano con tale autorità, su richiesta di quest’ultima, in merito a qualsiasi misura adottata per eliminare i rischi di cibersicurezza presentati dal prodotto con elementi digitali che hanno immesso sul mercato.", "pages": [38, 38], "tags": ["cra"], "always": false, "standards": []}, {"id": "CRA-ART13-23", "law": "CRA", "section": "CRA-OBB", "group": "Art. 13 — Obblighi dei fabbricanti", "ref": "Art. 13, par. 23", "title": "Obblighi dei fabbricanti", "text": "Il fabbricante che cessa l’attività e di conseguenza non è in grado di conformarsi al presente regolamento informa, prima che la cessazione dell’attività abbia effetto, le autorità di vigilanza del mercato competenti, nonché, con ogni mezzo disponibile e nella misura del possibile, gli utilizzatori dei prodotti pertinenti con elementi digitali interessati immessi sul mercato, dell’imminente cessazione dell’attività.", "pages": [38, 38], "tags": ["cra"], "always": false, "standards": []}, {"id": "CRA-ART14-1", "law": "CRA", "section": "CRA-OBB", "group": "Art. 14 — Obblighi di segnalazione dei fabbricanti", "ref": "Art. 14, par. 1", "title": "Obblighi di segnalazione dei fabbricanti", "text": "Un fabbricante notifica simultaneamente al CSIRT designato come coordinatore, conformemente al paragrafo 7 del presente articolo, e all’ENISA, qualsiasi vulnerabilità attivamente sfruttata contenuta nel prodotto con elementi digitali di cui viene a conoscenza. Il fabbricante notifica tale vulnerabilità attivamente sfruttata tramite la piattaforma unica di segnalazione istituita a norma dell’articolo 16.", "pages": [38, 38], "tags": ["cra"], "always": false, "standards": ["ISO/IEC 29147:2018", "ISO/IEC 27035-1:2023"]}, {"id": "CRA-ART14-2", "law": "CRA", "section": "CRA-OBB", "group": "Art. 14 — Obblighi di segnalazione dei fabbricanti", "ref": "Art. 14, par. 2", "title": "Obblighi di segnalazione dei fabbricanti", "text": "Ai fini della notifica di cui al paragrafo 1, il fabbricante presenta:\na) una notifica di preallarme di una vulnerabilità attivamente sfruttata, senza indebito ritardo e in ogni caso entro 24 ore dal momento in cui il fabbricante ne è venuto a conoscenza, che indichi, se del caso, gli Stati membri sul cui territorio il fabbricante sia al corrente del fatto che il suo prodotto con elementi digitali è stato messo a disposizione;\nb) a meno che non siano già state fornite le informazioni pertinenti, una notifica delle vulnerabilità, senza indebito ritardo e in ogni caso entro 72 ore dal momento in cui il fabbricante è venuto a conoscenza della vulnerabilità attivamente sfruttata, che fornisca informazioni generali, se disponibili, sul prodotto con elementi digitali interessato, sulla natura generale dello sfruttamento e della vulnerabilità in questione, nonché sulle eventuali misure correttive o di attenuazione adottate e sulle misure correttive o di attenuazione che gli utilizzatori possono adottare, e che indichi anche, se del caso, il grado di sensibilità attribuito dal fabbricante alle informazioni notificate;\nc) a meno che non siano già state fornite le informazioni pertinenti, una relazione finale, entro 14 giorni dalla messa a disposizione di una misura correttiva o di attenuazione, che comprenda almeno:\ni) una descrizione della vulnerabilità, compresi la sua gravità e il suo impatto;\nii) se disponibili, informazioni relative a qualsiasi soggetto malintenzionato che abbia sfruttato o che sfrutti la vulnerabilità;\niii) informazioni dettagliate relative all’aggiornamento di sicurezza o ad altre misure correttive messe a disposizione per porre rimedio alla vulnerabilità.", "pages": [38, 38], "tags": ["cra"], "always": false, "standards": ["ISO/IEC 29147:2018", "ISO/IEC 27035-1:2023"]}, {"id": "CRA-ART14-3", "law": "CRA", "section": "CRA-OBB", "group": "Art. 14 — Obblighi di segnalazione dei fabbricanti", "ref": "Art. 14, par. 3", "title": "Obblighi di segnalazione dei fabbricanti", "text": "Un fabbricante notifica simultaneamente al CSIRT designato come coordinatore, conformemente al paragrafo 7 del presente articolo, e all’ENISA, qualsiasi incidente grave che abbia un impatto sulla sicurezza del prodotto con elementi digitali di cui viene a conoscenza. Il fabbricante notifica tale incidente tramite la piattaforma unica di segnalazione istituita a norma dell’articolo 16.", "pages": [39, 39], "tags": ["cra"], "always": false, "standards": ["ISO/IEC 29147:2018", "ISO/IEC 27035-1:2023"]}, {"id": "CRA-ART14-4", "law": "CRA", "section": "CRA-OBB", "group": "Art. 14 — Obblighi di segnalazione dei fabbricanti", "ref": "Art. 14, par. 4", "title": "Obblighi di segnalazione dei fabbricanti", "text": "Ai fini della notifica di cui al paragrafo 3, il fabbricante presenta:\na) una notifica di preallarme di un incidente grave che ha un impatto sulla sicurezza del prodotto con elementi digitali, senza indebito ritardo e in ogni caso entro 24 ore dal momento in cui il fabbricante ne è venuto a conoscenza, che precisi, come minimo, se si sospetta che l’incidente sia il risultato di atti illegittimi o malevoli, e che indichi, se del caso, gli Stati membri sul cui territorio il fabbricante sia al corrente del fatto che il suo prodotto con elementi digitali è stato messo a disposizione;\nb) a meno che non siano già state fornite le informazioni pertinenti, una notifica dell’incidente, senza indebito ritardo e in ogni caso entro 72 ore dal momento in cui il fabbricante ne è venuto a conoscenza, che fornisca informazioni generali, se disponibili, sulla natura dell’incidente, una valutazione iniziale dell’incidente, nonché le eventuali misure correttive o di attenuazione adottate e le misure correttive o di attenuazione che gli utilizzatori possono adottare, e che indichi anche, se del caso, il grado di sensibilità attribuito dal fabbricante alle informazioni notificate;\nc) a meno che non siano già state fornite le informazioni pertinenti, una relazione finale entro un mese dalla trasmissione della notifica di incidente di cui alla lettera b), che comprenda almeno:\ni) una descrizione dettagliata dell’incidente, comprensiva della sua gravità e del suo impatto;\nii) il tipo di minaccia o la causa di fondo che ha probabilmente innescato l’incidente;\niii) le misure di attenuazione adottate e in corso;", "pages": [39, 39], "tags": ["cra"], "always": false, "standards": ["ISO/IEC 29147:2018", "ISO/IEC 27035-1:2023"]}, {"id": "CRA-ART14-5", "law": "CRA", "section": "CRA-OBB", "group": "Art. 14 — Obblighi di segnalazione dei fabbricanti", "ref": "Art. 14, par. 5", "title": "Obblighi di segnalazione dei fabbricanti", "text": "Ai fini del paragrafo 3, un incidente che ha un impatto sulla sicurezza del prodotto con elementi digitali è considerato grave se:\na) incide negativamente o è in grado di incidere negativamente sulla capacità di un prodotto con elementi digitali di proteggere la disponibilità, l’autenticità, l’integrità o la riservatezza di dati o funzioni sensibili o importanti; o\nb) ha portato o è in grado di portare all’introduzione o all’esecuzione di un codice maligno in un prodotto con elementi digitali o nei sistemi informativi e di rete di un utilizzatore del prodotto con elementi digitali.", "pages": [39, 39], "tags": ["cra"], "always": false, "standards": ["ISO/IEC 29147:2018", "ISO/IEC 27035-1:2023"]}, {"id": "CRA-ART14-7", "law": "CRA", "section": "CRA-OBB", "group": "Art. 14 — Obblighi di segnalazione dei fabbricanti", "ref": "Art. 14, par. 7", "title": "Obblighi di segnalazione dei fabbricanti", "text": "Le notifiche di cui ai paragrafi 1 e 3 del presente articolo sono trasmesse attraverso la piattaforma unica di segnalazione di cui all’articolo 16 utilizzando uno dei terminali per la notifica elettronica di cui all’articolo 16, paragrafo 1. La notifica è trasmessa utilizzando il terminale per la notifica elettronica del CSIRT designato come coordinatore dello Stato membro in cui i fabbricanti hanno lo stabilimento principale nell’Unione ed è contemporaneamente accessibile all’ENISA.\nAi fini del presente regolamento, si considera che un fabbricante abbia il suo stabilimento principale nell’Unione nello Stato membro in cui sono prevalentemente adottate le decisioni relative alla cibersicurezza dei suoi prodotti con elementi digitali. Se non è possibile determinare detto Stato membro, si considera che lo stabilimento principale sia nello Stato membro in cui il fabbricante ha lo stabilimento con il maggior numero di dipendenti nell’Unione.\nSe non ha uno stabilimento principale nell’Unione, il fabbricante trasmette le notifiche di cui ai paragrafi 1 e 3 utilizzando il terminale per la notifica elettronica del CSIRT designato come coordinatore nello Stato membro determinato secondo l’ordine seguente e sulla base delle informazioni a disposizione del fabbricante:\na) lo Stato membro in cui è stabilito il rappresentante autorizzato che agisce per conto del fabbricante per il maggior numero di prodotti con elementi digitali di tale fabbricante;\nb) lo Stato membro in cui è stabilito l’importatore che immette sul mercato il maggior numero di prodotti con elementi digitali di tale fabbricante;\nc) lo Stato membro in cui è stabilito il distributore che mette a disposizione sul mercato il maggior numero di prodotti con elementi digitali di tale fabbricante;\nd) lo Stato membro in cui è situato il maggior numero di utilizzatori di prodotti con elementi digitali di tale fabbricante.\nIn relazione al terzo comma, lettera d), un fabbricante può presentare notifiche relative a qualsiasi successiva vulnerabilità attivamente sfruttata o incidente grave che ha un impatto sulla sicurezza del prodotto con elementi digitali allo stesso CSIRT designato come coordinatore a cui ha presentato la prima notifica.", "pages": [39, 40], "tags": ["cra"], "always": false, "standards": ["ISO/IEC 29147:2018", "ISO/IEC 27035-1:2023"]}, {"id": "CRA-ART14-8", "law": "CRA", "section": "CRA-OBB", "group": "Art. 14 — Obblighi di segnalazione dei fabbricanti", "ref": "Art. 14, par. 8", "title": "Obblighi di segnalazione dei fabbricanti", "text": "Dal momento in cui è venuto a conoscenza di una vulnerabilità attivamente sfruttata o di un incidente grave avente un impatto sulla sicurezza del prodotto con elementi digitali, il fabbricante informa gli utilizzatori interessati del prodotto con elementi digitali e, se del caso, tutti gli utilizzatori, di tale vulnerabilità o incidente e, se necessario, di qualsiasi attenuazione dei rischi e misure correttive che gli utilizzatori possono adottare per attenuare l’impatto di tale vulnerabilità o incidente, se del caso in un formato strutturato, leggibile da un dispositivo automatico e che possa essere facilmente elaborato automaticamente. Se il fabbricante non informa tempestivamente gli utilizzatori del prodotto con elementi digitali, i CSIRT designati come coordinatori che hanno ricevuto la notifica possono fornire tali informazioni agli utilizzatori se ritenuto proporzionato e necessario per prevenire o attenuare l’impatto di tale vulnerabilità o incidente.", "pages": [40, 40], "tags": ["cra"], "always": false, "standards": ["ISO/IEC 29147:2018", "ISO/IEC 27035-1:2023"]}, {"id": "CRA-ART28-1", "law": "CRA", "section": "CRA-OBB", "group": "Art. 28 — Dichiarazione di conformità UE", "ref": "Art. 28, par. 1", "title": "Dichiarazione di conformità UE", "text": "La dichiarazione di conformità UE è redatta dai fabbricanti in conformità dell’articolo 13, paragrafo 12, e attesta il rispetto dei requisiti essenziali di cibersicurezza applicabili di cui all’allegato I.", "pages": [47, 47], "tags": ["cra"], "always": false, "standards": ["EN ISO/IEC 17050-1:2010"]}, {"id": "CRA-ART28-2", "law": "CRA", "section": "CRA-OBB", "group": "Art. 28 — Dichia

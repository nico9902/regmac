<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RegMac Desktop</title>
<style>
:root{
 --bg:#F5F7FA;--win:#F5F7FA;--panel:#FFFFFF;--line:#E2E8F0;--line2:#EEF2F6;
 --ink:#1E293B;--ink2:#475569;--mute:#64748B;--brand:#155EEF;--brand2:#EAF1FF;--brand3:#F8FAFC;--navy:#0B1F3A;--navy2:#132B4D;--onnavy:#F8FAFC;--onnavy2:#A9B6C9;
 --ok:#16A34A;--okbg:#EAF7EF;--part:#B45309;--partbg:#FEF4E6;--nc:#DC2626;--ncbg:#FDEEEE;--na:#94A3B8;--nabg:#F1F5F9;
 --serif:Georgia,"Times New Roman",serif;--shadow:0 20px 50px rgba(15,23,42,.12),0 1px 3px rgba(15,23,42,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0F172A;--win:#0F172A;--panel:#1E293B;--line:#334155;--line2:#273449;--ink:#F8FAFC;--ink2:#CBD5E1;--mute:#94A3B8;--brand:#3B82F6;--brand2:rgba(59,130,246,.16);--brand3:#172033;--navy:#0B1222;--navy2:#16213A;--onnavy:#F8FAFC;--onnavy2:#94A3B8;
 --ok:#4ADE80;--okbg:rgba(22,163,74,.18);--part:#F59E0B;--partbg:rgba(180,83,9,.22);--nc:#F87171;--ncbg:rgba(220,38,38,.18);--na:#94A3B8;--nabg:rgba(148,163,184,.12);--shadow:0 30px 80px #0008}}
:root[data-theme="dark"]{--bg:#0F172A;--win:#0F172A;--panel:#1E293B;--line:#334155;--line2:#273449;--ink:#F8FAFC;--ink2:#CBD5E1;--mute:#94A3B8;--brand:#3B82F6;--brand2:rgba(59,130,246,.16);--brand3:#172033;--navy:#0B1222;--navy2:#16213A;--onnavy:#F8FAFC;--onnavy2:#94A3B8;
 --ok:#4ADE80;--okbg:rgba(22,163,74,.18);--part:#F59E0B;--partbg:rgba(180,83,9,.22);--nc:#F87171;--ncbg:rgba(220,38,38,.18);--na:#94A3B8;--nabg:rgba(148,163,184,.12);--shadow:0 30px 80px #0008}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input:not([type=checkbox]):not([type=radio]),select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;color:var(--ink)}
textarea{resize:vertical;min-height:64px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid color-mix(in srgb,var(--brand) 55%,transparent);outline-offset:1px}
label.f{display:grid;gap:5px;font-size:12px;color:var(--ink2)}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:22px}h2{font-size:16px}h3{font-size:14px}
p{margin:0}
.mute{color:var(--mute)}.small{font-size:12px}.tiny{font-size:11px}
.row{display:flex;gap:10px;align-items:center}.grow{flex:1;min-width:0}.wrap{flex-wrap:wrap}
.stack{display:grid;gap:12px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px 12px;font-size:12px;font-weight:550;white-space:nowrap}
.btn:hover{border-color:color-mix(in srgb,var(--brand) 40%,var(--line))}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}


.btn.ghost{border-color:transparent;background:none;color:var(--brand)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:11px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:5px;padding:2px 7px;font-size:11px;background:var(--nabg);color:var(--ink2);white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.part{background:var(--partbg);color:var(--part)}.chip.nc{background:var(--ncbg);color:var(--nc)}.chip.brand{background:var(--brand2);color:var(--brand)}
.eyebrow{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:650}
svg.i{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* finestra desktop */
.stage{min-height:100%;display:grid;place-items:center;padding:20px 28px 150px}
.window{width:min(1360px,100%);height:min(860px,calc(100vh - 175px));min-height:600px;background:var(--win);border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.titlebar{height:38px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--win) 70%,var(--bg))}
.dots{display:flex;gap:7px}.dots span{width:12px;height:12px;border-radius:50%;background:#ff5f57}.dots span:nth-child(2){background:#febc2e}.dots span:nth-child(3){background:#28c840}
.titlebar .t{flex:1;text-align:center;font-size:12px;color:var(--mute);font-weight:550;margin-right:54px}

/* barra app */
.appbar{height:54px;flex:none;display:flex;align-items:center;gap:18px;padding:0 18px;background:var(--navy);color:var(--onnavy)}
.appbar .tab{color:var(--onnavy2)}.appbar .tab.on{background:var(--navy2);color:var(--onnavy);box-shadow:inset 0 -2px 0 var(--brand)}.appbar .who{color:var(--onnavy2)}.appbar .iconbtn{color:var(--onnavy2)}.appbar .iconbtn:hover{background:var(--navy2)}.appbar .avatar{background:var(--navy2);color:var(--onnavy)}
.logo{display:flex;align-items:center;gap:8px;font-weight:750;font-size:16px;letter-spacing:-.03em}
.logo img{width:28px;height:28px;border-radius:7px;display:block}
.tabs{display:flex;gap:2px}
.tab{border:0;background:none;padding:7px 12px;border-radius:7px;color:var(--ink2);font-weight:550;display:flex;gap:7px;align-items:center}
.tab.on{background:var(--brand2);color:var(--brand)}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink2)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--brand2);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:11px}
.iconbtn{border:0;background:none;padding:6px;border-radius:6px;color:var(--ink2);display:grid;place-items:center}
.iconbtn:hover{background:var(--brand3)}
.content{flex:1;min-height:0;overflow:auto}
.page{padding:24px 28px;max-width:1180px;margin:0 auto}

/* fascicoli */
.list{display:grid;gap:10px;margin-top:16px}
.mrow{display:grid;grid-template-columns:44px minmax(0,1.6fr) minmax(0,1fr) 190px 24px;gap:16px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--panel);text-align:left;width:100%}
.mrow:hover{border-color:color-mix(in srgb,var(--brand) 45%,var(--line))}
.micon{width:44px;height:44px;border-radius:9px;background:var(--brand3);border:1px solid var(--line);display:grid;place-items:center;color:var(--brand)}
.bar{height:6px;border-radius:4px;background:var(--line2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .ok{background:var(--ok)}.bar .part{background:var(--part)}.bar .nc{background:var(--nc)}.bar .na{background:var(--na);opacity:.6}

/* fascicolo */
.fhead{padding:14px 28px 0;background:var(--panel);border-bottom:1px solid var(--line)}
.crumb{font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center}
.crumb button{border:0;background:none;padding:0;color:var(--brand);font-weight:550}
.ftabs{display:flex;gap:4px;margin-top:12px}
.ftab{border:0;background:none;padding:9px 12px;border-bottom:2px solid transparent;color:var(--ink2);font-weight:550;display:flex;gap:6px;align-items:center}
.ftab.on{border-color:var(--brand);color:var(--brand)}
.ftab .n{font-size:10px;background:var(--line2);border-radius:9px;padding:0 6px;color:var(--ink2)}
.ftab .n.nc{background:var(--ncbg);color:var(--nc)}

/* valutazione */
.eval{display:grid;grid-template-columns:340px minmax(0,1fr);height:100%;min-height:0}
.side{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.side .top{padding:12px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.filters{display:flex;gap:4px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:none;border-radius:20px;padding:2px 9px;font-size:11px;color:var(--ink2)}
.filters button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.tree{overflow:auto;flex:1;padding:6px 6px 16px}
.grp{margin-top:4px}
.ghead{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;font-weight:600;font-size:12px;color:var(--ink);width:100%;border:0;background:none;text-align:left}
.ghead:hover{background:var(--brand3)}
.ghead .cnt{margin-left:auto;font-weight:500;color:var(--mute);font-size:11px}
.ghead .menu{opacity:0;border:0;background:none;color:var(--mute);padding:0 2px}
.ghead:hover .menu{opacity:1}
.law{padding:12px 8px 4px;font-size:10px;letter-spacing:.12em;font-weight:700;color:var(--brand);text-transform:uppercase}
.item{display:flex;gap:8px;align-items:baseline;width:100%;border:0;background:none;text-align:left;padding:5px 8px 5px 20px;border-radius:6px;font-size:12px;color:var(--ink2);line-height:1.4}
.item:hover{background:var(--brand3)}
.item.on{background:var(--brand2);color:var(--brand);font-weight:600}
.item .ref{color:var(--mute);font-size:11px;min-width:62px;white-space:nowrap;font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line);flex:none;align-self:center}
.dot.COMPLIANT{background:var(--ok);border-color:var(--ok)}.dot.PARTIAL{background:var(--part);border-color:var(--part)}.dot.NON_COMPLIANT{background:var(--nc);border-color:var(--nc)}.dot.NOT_APPLICABLE{background:var(--na);border-color:var(--na);opacity:.55}
.prog{padding:10px 12px;border-top:1px solid var(--line);font-size:11px;color:var(--mute);display:grid;gap:6px}
.detail{overflow:auto;min-height:0}
.dwrap{padding:22px 32px 40px;max-width:900px}
.legal{font-family:var(--serif);font-size:15px;line-height:1.75;color:var(--ink);border-left:3px solid var(--line);padding:2px 0 2px 18px;white-space:pre-line}
.status{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sbtn{border:1.5px solid var(--line);background:var(--panel);border-radius:9px;padding:10px;display:grid;gap:2px;text-align:left}
.sbtn b{font-size:13px}.sbtn span{font-size:11px;color:var(--mute)}
.sbtn kbd{float:right;font:10px ui-monospace,monospace;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--mute)}
.sbtn.on.COMPLIANT{border-color:var(--ok);background:var(--okbg)}.sbtn.on.COMPLIANT b{color:var(--ok)}
.sbtn.on.PARTIAL{border-color:var(--part);background:var(--partbg)}.sbtn.on.PARTIAL b{color:var(--part)}
.sbtn.on.NON_COMPLIANT{border-color:var(--nc);background:var(--ncbg)}.sbtn.on.NON_COMPLIANT b{color:var(--nc)}
.sbtn.on.NOT_APPLICABLE{border-color:var(--na);background:var(--nabg)}
.box{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--panel)}
.section-t{display:flex;align-items:center;gap:8px;margin:22px 0 10px;font-size:12px;font-weight:650;color:var(--ink2);text-transform:uppercase;letter-spacing:.08em}
.docref{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:12px;background:var(--brand3)}
.ai{border:1px dashed color-mix(in srgb,var(--brand) 50%,var(--line));background:var(--brand3);border-radius:10px;padding:14px}
.ai q{display:block;font-family:var(--serif);font-style:italic;margin:6px 0;padding-left:10px;border-left:2px solid var(--brand)}
.navbar{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;padding:12px 32px;background:color-mix(in srgb,var(--win) 92%,transparent);backdrop-filter:blur(6px);border-top:1px solid var(--line)}
kbd{font:11px ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel);color:var(--ink2)}

/* panoramica */
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kpi{padding:14px 16px}.kpi strong{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:4px}
.steps{display:grid;gap:0}
.step{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line2)}
.step:first-child{border-top:0}
.sn{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--line2);color:var(--ink2);flex:none}
.sn.done{background:var(--ok);color:#fff}.sn.cur{background:var(--brand);color:#fff}
dl.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;margin:0;font-size:12px}dl.kv dt{color:var(--mute)}dl.kv dd{margin:0}

table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-weight:600;color:var(--mute);font-size:11px;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:0}

/* rapporto */
.rep{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.paper{background:#fff;color:#1b1b1b;border-radius:4px;box-shadow:0 4px 24px #0002;padding:44px 50px;aspect-ratio:1/1.414;position:relative;overflow:hidden;font-size:11px}
.paper h1{font-size:18px;color:#1b1b1b}.paper .lh{display:flex;justify-content:space-between;border-bottom:2px solid #155EEF;padding-bottom:10px;margin-bottom:18px}
.paper .wm{position:absolute;inset:0;display:grid;place-items:center;font-size:110px;font-weight:800;color:#0000000b;transform:rotate(-30deg);pointer-events:none}
.paper table td,.paper table th{color:#1b1b1b;border-color:#ddd;padding:5px 6px}
.paper .verdict{border:1.5px solid #DC2626;color:#DC2626;padding:8px 12px;border-radius:4px;margin:12px 0;font-weight:700}
.block{display:flex;gap:9px;align-items:flex-start;padding:8px 0;font-size:12px;border-top:1px solid var(--line2)}
.block:first-child{border-top:0}

/* modale */
.ov{position:fixed;inset:0;background:#0b1a1666;display:grid;place-items:center;z-index:20;padding:20px;backdrop-filter:blur(2px)}
.modal{background:var(--win);border:1px solid var(--line);border-radius:14px;width:min(720px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.mh{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.mb{padding:20px 22px;overflow:auto}
.mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.wsteps{display:flex;gap:6px}.wsteps span{height:4px;width:46px;border-radius:3px;background:var(--line)}.wsteps span.on{background:var(--brand)}
.q{display:flex;align-items:center;gap:14px;padding:11px 0;border-top:1px solid var(--line2)}
.q:first-child{border-top:0}
.yn{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex:none}
.yn button{border:0;background:var(--panel);padding:5px 12px;font-size:12px;color:var(--ink2)}
.yn button+button{border-left:1px solid var(--line)}
.yn button.on{background:var(--brand);color:#fff}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:1.5px solid var(--line);border-radius:10px;padding:12px;text-align:left;background:var(--panel);display:grid;gap:3px}
.opt.on{border-color:var(--brand);background:var(--brand3)}
.count{font-size:34px;font-weight:650;letter-spacing:-.03em;color:var(--brand)}

/* primo avvio */
.welcome{height:100%;display:grid;grid-template-columns:1fr 1fr}
.welcome .l{background:var(--navy);color:#fff;padding:48px;display:flex;flex-direction:column;gap:18px}
.welcome .l p{color:#ffffffcc;font-size:14px;line-height:1.7}
.welcome .r{padding:48px;display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:520px}
.welcome li{margin:6px 0;color:#ffffffdd}

/* navigatore prototipo */
.proto{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:4px;align-items:center;background:#0B1F3A;color:#CBD5E1;border-radius:12px;padding:6px;box-shadow:0 8px 30px #0005;z-index:30;max-width:calc(100% - 24px);overflow:auto}
.proto span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:0 8px;color:#94A3B8;font-weight:700;white-space:nowrap}
.proto button{border:0;background:none;color:#CBD5E1;border-radius:7px;padding:6px 10px;font-size:12px;white-space:nowrap}
.proto button.on{background:#155EEF;color:#fff}
.note{position:fixed;left:50%;transform:translateX(-50%);bottom:64px;width:min(900px,calc(100% - 24px));background:#fffbea;color:#5b4a14;border:1px solid #ecd98d;border-radius:10px;padding:9px 36px 9px 14px;font-size:12px;line-height:1.5;z-index:25;box-shadow:0 6px 20px #0002}
.note b{margin-right:6px}
.note button{position:absolute;right:6px;top:4px;border:0;background:none;color:#8a7524;font-size:16px}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:var(--win);padding:9px 14px;border-radius:8px;font-size:12px;z-index:40}
@media (max-width:900px){.eval{grid-template-columns:1fr}.side{max-height:300px}.grid2,.rep,.welcome{grid-template-columns:1fr}.grid3{grid-template-columns:1fr}.mrow{grid-template-columns:44px 1fr}.mrow>:nth-child(n+3){display:none}.note{display:none}.stage{padding:0 0 80px}.window{border-radius:0;height:calc(100vh - 70px)}}
/* ---- pre-assessment ---- */
.btn.danger{color:var(--nc)}.btn.danger:hover{border-color:var(--nc)}.btn.danger.pri{background:var(--nc);border-color:var(--nc);color:#fff}
.rowdel{display:grid;place-items:center;width:28px;height:28px;border-radius:6px;color:var(--mute)}.rowdel:hover{background:var(--ncbg);color:var(--nc)}
.toast .undo{margin-left:10px;border:0;background:none;color:#93C5FD;font-weight:650;cursor:pointer}
.chip.und{background:var(--nabg);color:var(--mute)}.chip.na{background:var(--nabg);color:var(--na)}
.dot.OK{background:var(--ok);border-color:var(--ok)}.dot.PART{background:var(--part);border-color:var(--part)}.dot.NC{background:var(--nc);border-color:var(--nc)}.dot.INS{background:var(--mute);border-color:var(--mute)}.dot.NA{background:var(--na);border-color:var(--na);opacity:.5}.dot.Q{border-style:dashed}
.ok-mark{color:var(--ok);display:flex}.doubt{width:15px;height:15px;border-radius:50%;background:var(--partbg);color:var(--part);font-size:10px;font-weight:800;display:grid;place-items:center;flex:none}
.ghead{padding:8px 8px 2px;font-size:11px;font-weight:650;color:var(--mute)}
.pt{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel);margin-top:8px}
.pt q,.card q,td q{display:block;font-family:var(--serif);font-style:italic;font-size:13px;margin:6px 0 3px;padding-left:10px;border-left:2px solid var(--brand);quotes:"«" "»"}
.pn{width:22px;height:22px;border-radius:50%;background:var(--brand2);color:var(--brand);font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
.yn button.on.ok{background:var(--ok)}.yn button.on.nc{background:var(--nc)}.yn button.on.und{background:var(--mute)}
.pbar{height:4px;width:60px;background:var(--line2);border-radius:3px;overflow:hidden}.pbar i{display:block;height:100%}
.score{font-size:46px;font-weight:650;letter-spacing:-.03em;line-height:1;color:var(--ink)}
.sc-mini{font-size:20px;font-weight:650;line-height:1.1}
.range{position:relative;height:8px;background:color-mix(in srgb,var(--nc) 22%,var(--line2));border-radius:5px;overflow:hidden}.range i{position:absolute;left:0;top:0;bottom:0}.range .mx{background:color-mix(in srgb,var(--brand) 28%,var(--panel))}.range .sc{background:var(--brand)}
.lg{display:inline-block;width:10px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}.lg.sc{background:var(--brand)}.lg.mx{background:color-mix(in srgb,var(--brand) 28%,var(--panel))}.lg.rest{background:color-mix(in srgb,var(--nc) 22%,var(--line2))}
.gp{padding:4px 0}.gp+.gp{border-top:1px dashed var(--line);padding-top:7px;margin-top:3px}
.bar .fill{background:var(--ok)}.bar .fill.brand{background:var(--brand)}
.mini{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid}.mini b{font-size:18px}
.run{margin-bottom:14px;border-color:color-mix(in srgb,var(--brand) 35%,var(--line))}.run .bar{margin-top:10px}
.run.sm{padding:10px;margin:0}.run.sm p{display:none}
.spin{display:inline-flex;color:var(--brand)}.spin svg{animation:rot 2.4s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.legalbox{margin-top:16px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--panel)}.legalbox summary{cursor:pointer;font-size:12px;color:var(--ink2);font-weight:550}
.q.unsure{background:var(--partbg);border-radius:8px;padding:11px 10px;margin:4px -10px}
.linkbtn{border:0;background:none;padding:0;text-align:left;color:var(--ink);font-size:12px}.linkbtn:hover b{color:var(--brand)}
.mrow{grid-template-columns:44px minmax(0,1.3fr) minmax(0,1.2fr) 210px 28px}

<script>
const CAT={"requirements": [{"id": "MR-III-B1", "law": "MR", "section": "MR-III", "group": "Allegato III — Parte B: Principi generali", "ref": "All. III, parte B, punto 1", "title": "Valutazione e riduzione del rischio", "text": "Il fabbricante di una macchina o di un prodotto correlato deve provvedere affinché sia effettuata una valutazione del rischio per stabilire i requisiti essenziali di sicurezza e di tutela della salute che concernono la macchina o il prodotto correlato. La macchina o il prodotto correlato devono inoltre essere progettati e costruiti per eliminare i rischi o, ove non sia possibile, ridurre al minimo tutti i rischi pertinenti, tenendo conto dei risultati della valutazione del rischio.\nCon il processo iterativo della valutazione del rischio e della riduzione del rischio di cui al primo comma, il fabbricante:\na) stabilisce i limiti della macchina o del prodotto correlato, il che comprende l'uso previsto e l'uso scorretto ragionevolmente prevedibile;\nb) individua i pericoli cui può dare origine la macchina o il prodotto correlato e le situazioni pericolose che ne derivano;\nc) stima i rischi, tenendo conto della gravità dell'eventuale lesione o danno alla salute e della probabilità che si verifichi;\nd) valuta i rischi al fine di stabilire se sia richiesta una riduzione del rischio conformemente all'obiettivo del presente regolamento;\ne) elimina i pericoli o riduce i rischi che ne derivano, applicando le misure di protezione nell'ordine indicato nel punto 1.1.2, lettera b).\nLa valutazione del rischio e la riduzione del rischio includono i pericoli che possono manifestarsi durante il ciclo di vita della macchina o del prodotto correlato prevedibili al momento dell'immissione della macchina o del prodotto correlato sul mercato come un'evoluzione prevista del suo comportamento o della sua logica integralmente o parzialmente autoevolutivi in ragione del fatto che tale macchina o prodotto correlato è progettato per funzionare con livelli variabili di autonomia. La valutazione del rischio e la riduzione del rischio comprendono i rischi derivanti dalle interazioni tra macchine che per raggiungere uno stesso risultato sono disposte e comandate in modo da avere un funzionamento solidale, formando così una macchina come definita all'articolo 3, punto 1), lettera d).", "pages": [44, 45], "tags": ["generale"], "always": true, "standards": ["EN ISO 12100:2010", "ISO/TR 14121-2:2012"]}, {"id": "MR-III-1.1.1", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.1. Considerazioni generali", "ref": "All. III, punto 1.1.1", "title": "Applicabilità", "text": "Gli obblighi previsti dai requisiti essenziali di sicurezza e di tutela della salute si applicano alle quasi-macchine nella misura in cui tali requisiti sono pertinenti.\nI requisiti pertinenti relativi alle quasi-macchine non riguardano i requisiti che possono essere soddisfatti solo al momento dell'incorporazione della quasi-macchina. Tuttavia, i principi di integrazione della sicurezza di cui al punto 1.1.2 sono applicabili in tutti i casi.", "pages": [45, 45], "tags": ["generale"], "always": false, "standards": []}, {"id": "MR-III-1.1.2", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.1. Considerazioni generali", "ref": "All. III, punto 1.1.2", "title": "Principi d'integrazione della sicurezza", "text": "a) Per progettazione e costruzione, le macchine o i prodotti correlati devono essere atti a funzionare, ad essere azionati, ad essere regolati e a subire la manutenzione senza che tali operazioni espongano a rischi le persone, se effettuate nelle condizioni previste tenendo anche conto dell'uso scorretto ragionevolmente prevedibile. Le misure di protezione devono avere lo scopo di eliminare ogni rischio durante l'esistenza prevedibile della macchina o del prodotto correlato, comprese le fasi di trasporto, montaggio, smontaggio, smantellamento (messa fuori servizio) e rottamazione.\nb) Per la scelta delle soluzioni più opportune il fabbricante deve applicare i principi seguenti, nell'ordine indicato:\ni) eliminare i pericoli o, qualora non sia possibile, ridurre al minimo i rischi (integrazione della sicurezza nella progettazione e nella costruzione della macchina o dei prodotti correlati);\nii) adottare i necessari provvedimenti protettivi contro i rischi che non possono essere eliminati;\niii) informare gli utilizzatori dei rischi residui dovuti all'incompleta efficacia delle misure di protezione adottate, indicare se è richiesta una formazione particolare e segnalare se è necessario prevedere un dispositivo di protezione individuale.\nc) In sede di progettazione e di costruzione di una macchina o di un prodotto correlato, nonché all'atto della redazione delle istruzioni per l'uso, il fabbricante deve prendere in considerazione non solo l'uso previsto della macchina o del prodotto correlato, ma anche l'uso scorretto ragionevolmente prevedibile. La macchina o il prodotto correlato devono essere progettati e costruiti in modo da evitare che siano utilizzati in modo anormale, se ciò può comportare un rischio. Negli altri casi le istruzioni per l'uso devono richiamare l'attenzione dell'utilizzatore sulle controindicazioni nell'uso della macchina o del prodotto correlato che potrebbero presentarsi, in base all'esperienza.\nd) La macchina o il prodotto correlato devono essere progettati e costruiti tenendo conto delle limitazioni imposte all'operatore dall'uso necessario o prevedibile delle attrezzature di protezione individuale.\ne) La macchina o il prodotto correlato, devono essere progettati e costruiti in modo tale da consentire all'utilizzatore, se del caso, di verificare le funzioni di sicurezza. La macchina o il prodotto correlato devono essere forniti completi di tutte le attrezzature e gli accessori speciali e, se del caso, della descrizione delle procedure di prova funzionale specifiche, essenziali per poterli verificare, regolare, eseguirne la manutenzione e utilizzarli in condizioni di sicurezza.", "pages": [45, 46], "tags": ["generale"], "always": true, "standards": ["EN ISO 12100:2010", "EN ISO 11161:2007 + A1:2010"]}, {"id": "MR-III-1.1.3", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.1. Considerazioni generali", "ref": "All. III, punto 1.1.3", "title": "Materiali e prodotti", "text": "I materiali utilizzati per la costruzione di macchine o dei prodotti correlati o i prodotti utilizzati od originati durante la loro utilizzazione non devono presentare rischi per la salute e la sicurezza delle persone. In particolare, se sono usati dei fluidi, le macchine o i prodotti correlati devono essere progettati e costruiti in modo da prevenire rischi dovuti al riempimento, all'utilizzazione, al recupero e all'evacuazione.", "pages": [46, 46], "tags": ["generale"], "always": false, "standards": []}, {"id": "MR-III-1.1.4", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.1. Considerazioni generali", "ref": "All. III, punto 1.1.4", "title": "Illuminazione", "text": "Le macchine o i prodotti correlati devono essere forniti di un'illuminazione incorporata adeguata alle operazioni laddove, malgrado un'illuminazione ambiente avente un valore normale, la mancanza di tale dispositivo potrebbe determinare rischi.\nLe macchine o i prodotti correlati devono essere progettati e costruiti in modo che non vi siano zone d'ombra che possano causare disturbo, né fastidiosi abbagliamenti, né effetti stroboscopici pericolosi sugli elementi mobili dovuti all'illuminazione.\nLe parti interne che devono essere ispezionate e regolate frequentemente devono essere munite di opportuni dispositivi di illuminazione; lo stesso dicasi per le zone di manutenzione.", "pages": [46, 46], "tags": ["generale"], "always": false, "standards": ["EN 1837:2020"]}, {"id": "MR-III-1.1.5", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.1. Considerazioni generali", "ref": "All. III, punto 1.1.5", "title": "Progettazione di una macchina o di un prodotto correlato ai fini della movimentazione", "text": "La macchina o il prodotto correlato o ciascuno dei suoi diversi elementi devono:\na) poter essere movimentati e trasportati in modo sicuro,\nb) essere imballati o progettati per essere immagazzinati in modo sicuro e senza deterioramenti.\nDurante il trasporto della macchina o del prodotto correlato o dei suoi elementi non devono potersi verificare spostamenti intempestivi né pericoli dovuti all'instabilità se la macchina o il prodotto correlato o i suoi elementi sono sottoposti a movimentazione secondo le istruzioni.\nSe la massa, le dimensioni o la forma di una macchina o di un prodotto correlato o dei suoi vari elementi non ne consentono lo spostamento a mano, la macchina o il prodotto correlato o ciascuno dei suoi vari elementi devono essere:\na) muniti di accessori che consentano di afferrarli con un mezzo di sollevamento; oppure\nb) progettati in modo da consentire il fissaggio di detti accessori; oppure\nc) di forma tale che i normali mezzi di sollevamento possano adattarvisi facilmente.\nSe la macchina il un prodotto correlato o uno dei suoi elementi devono essere spostati a mano, devono essere:\na) facilmente spostabili; oppure\nb) muniti di dispositivi di presa che ne consentano la movimentazione in modo sicuro.\nSono necessarie disposizioni speciali per il trasporto di utensili e/o di parti di macchine o di prodotti correlati, anche leggeri, potenzialmente pericolosi.", "pages": [46, 47], "tags": ["generale"], "always": false, "standards": ["EN 1005-2:2003+A1:2008"]}, {"id": "MR-III-1.1.6", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.1. Considerazioni generali", "ref": "All. III, punto 1.1.6", "title": "Ergonomia", "text": "Nelle condizioni d'uso previste devono essere eliminati o ridotti al minimo possibile il disagio, la fatica e le tensioni psichiche e fisiche (stress) dell'operatore, tenuto conto almeno dei principi seguenti dell'ergonomia:\na) tener conto della variabilità delle dimensioni fisiche, della forza e della resistenza dell'operatore;\nb) evitare la necessità di movimenti o posture lavorativi impegnativi e sforzi manuali superiori alla capacità dell'operatore;\nc) offrire lo spazio necessario per i movimenti delle parti del corpo dell'operatore,\nd) evitare un ritmo di lavoro condizionato dalla macchina;\ne) evitare un controllo che richiede una concentrazione prolungata;\nf) adeguare l'interfaccia tra uomo e macchina alle caratteristiche prevedibili degli operatori, anche rispetto a una macchina o a un prodotto correlato dotati di un comportamento o una logica integralmente o parzialmente auto-evolutivi e che sono progettati per funzionare con livelli variabili di autonomia;\ng) se del caso, adeguare una macchina o un prodotto correlato dotati di un comportamento o una logica integralmente o parzialmente auto-evolutivi e che sono progettati per funzionare con livelli variabili di autonomia affinché rispondano alle persone adeguatamente e appropriatamente (ad esempio verbalmente attraverso parole e non verbalmente attraverso gesti, espressioni facciali o movimento del corpo) e comunichino le loro azioni pianificate (ad esempio cosa faranno e perché) agli operatori in maniera comprensibile.", "pages": [47, 47], "tags": ["generale"], "always": false, "standards": ["EN 614-1:2006+A1:2009", "EN 614-2:2000+A1:2008", "EN 1005-3:2002+A1:2008", "EN 1005-4:2005+A1:2008"]}, {"id": "MR-III-1.1.7", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.1. Considerazioni generali", "ref": "All. III, punto 1.1.7", "title": "Postazioni di lavoro", "text": "La postazione di lavoro deve essere progettata e costruita in modo da evitare ogni rischio derivante dai gas di scarico o dalla mancanza di ossigeno.\nSe la macchina o il prodotto correlato sono destinati ad essere utilizzati in un ambiente pericoloso che presenta rischi per la salute e la sicurezza dell'operatore o se la macchina stessa o il prodotto correlato stesso generano un ambiente pericoloso, devono essere previsti i mezzi adeguati ad assicurare che l'operatore lavori in buone condizioni e sia protetto da ogni pericolo prevedibile.\nSe del caso, la postazione di lavoro deve essere dotata di una cabina adeguata, progettata, costruita o attrezzata in modo da soddisfare i suddetti requisiti. L'uscita deve consentire un rapido abbandono della macchina. Si deve inoltre, se del caso, prevedere un'uscita di sicurezza in una direzione diversa dall'uscita normale.", "pages": [47, 47], "tags": ["generale"], "always": false, "standards": ["EN 614-1:2006+A1:2009", "EN 1005-4:2005+A1:2008"]}, {"id": "MR-III-1.1.8", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.1. Considerazioni generali", "ref": "All. III, punto 1.1.8", "title": "Sedili", "text": "Ove appropriato e se le condizioni di lavoro lo consentono, nella postazione di lavoro integrata alla macchina o al prodotto correlato deve essere prevista l'installazione di sedili.\nSe l'operatore è destinato a lavorare seduto e la postazione di lavoro è parte integrante della macchina o del prodotto correlato, il sedile deve essere fornito unitamente alla macchina o al prodotto correlato.\nIl sedile dell'operatore deve renderlo capace di mantenere una posizione stabile. Inoltre il sedile e la sua distanza dai dispositivi di comando devono potersi adattare all'operatore.\nSe la macchina o il prodotto correlato sono sottoposti a vibrazioni, il sedile deve essere progettato e costruito in modo da ridurre al livello più basso ragionevolmente possibile le vibrazioni trasmesse all'operatore. Il sedile deve essere ancorato in modo da resistere a tutte le sollecitazioni che può subire. Se sotto i piedi dell'operatore non esiste alcun piano di appoggio, egli deve disporre di un poggiapiedi antisdrucciolo.", "pages": [47, 47], "tags": ["generale"], "always": false, "standards": []}, {"id": "MR-III-1.1.9-c1", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.1. Considerazioni generali", "ref": "All. III, punto 1.1.9, comma 1", "title": "Protezione dall'alterazione — comma 1", "text": "La macchina o il prodotto correlato devono essere progettati e costruiti in modo tale da fare sì che il collegamento ad essi di un altro dispositivo, tramite qualsiasi caratteristica del dispositivo connesso stesso o tramite qualsiasi dispositivo remoto che comunica con la macchina o il prodotto correlato, non determini una situazione pericolosa.", "pages": [47, 47], "tags": ["generale"], "always": false, "standards": ["ISO/TR 22100-4:2018", "IEC TS 63074:2023", "EN IEC 62443-4-2:2019", "EN IEC 62443-3-3:2019"]}, {"id": "MR-III-1.1.9-c2", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.1. Considerazioni generali", "ref": "All. III, punto 1.1.9, comma 2", "title": "Protezione dall'alterazione — comma 2", "text": "I componenti hardware che trasmettono segnali o dati, importanti per il collegamento o l'accesso a software che sono fondamentali affinché la macchina o il prodotto correlato rispettino i pertinenti requisiti essenziali di sicurezza e di tutela della salute, devono essere progettati in modo tale da essere adeguatamente protetti da un'alterazione accidentale o intenzionale. La macchina o il prodotto correlato devono raccogliere prove in merito a un intervento legittimo o illegittimo su tali componenti hardware, se importante per il collegamento o l'accesso al software critico per la conformità della macchina o del prodotto correlato.", "pages": [48, 48], "tags": ["generale"], "always": false, "standards": ["ISO/TR 22100-4:2018", "IEC TS 63074:2023", "EN IEC 62443-4-2:2019", "EN IEC 62443-3-3:2019"]}, {"id": "MR-III-1.1.9-c3", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.1. Considerazioni generali", "ref": "All. III, punto 1.1.9, comma 3", "title": "Protezione dall'alterazione — comma 3", "text": "Software e dati critici per il rispetto da parte della macchina o del prodotto correlato dei pertinenti requisiti essenziali di sicurezza e di tutela della devono essere individuati come tali e devono essere adeguatamente protetti da un'alterazione accidentale o intenzionale.", "pages": [48, 48], "tags": ["generale"], "always": false, "standards": ["ISO/TR 22100-4:2018", "IEC TS 63074:2023", "EN IEC 62443-4-2:2019", "EN IEC 62443-3-3:2019"]}, {"id": "MR-III-1.1.9-c4", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.1. Considerazioni generali", "ref": "All. III, punto 1.1.9, comma 4", "title": "Protezione dall'alterazione — comma 4", "text": "La macchina o il prodotto correlato devono individuare il software installato sullo stesso, necessario per il suo funzionamento in condizioni di sicurezza, e devono essere in grado di fornire tali informazioni in qualsiasi momento in un formato facilmente accessibile.", "pages": [48, 48], "tags": ["generale"], "always": false, "standards": ["ISO/TR 22100-4:2018", "IEC TS 63074:2023", "EN IEC 62443-4-2:2019", "EN IEC 62443-3-3:2019"]}, {"id": "MR-III-1.1.9-c5", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.1. Considerazioni generali", "ref": "All. III, punto 1.1.9, comma 5", "title": "Protezione dall'alterazione — comma 5", "text": "La macchina o il prodotto correlato devono raccogliere prove di un intervento legittimo o illegittimo sul software o di una modifica del software installato sulla macchina o sul prodotto correlato o della sua configurazione.", "pages": [48, 48], "tags": ["generale"], "always": false, "standards": ["ISO/TR 22100-4:2018", "IEC TS 63074:2023", "EN IEC 62443-4-2:2019", "EN IEC 62443-3-3:2019"]}, {"id": "MR-III-1.2.1-c1", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.2. Sistemi di comando", "ref": "All. III, punto 1.2.1, comma 1", "title": "Sicurezza ed affidabilità dei sistemi di comando — comma 1", "text": "I sistemi di comando devono essere progettati e costruiti in modo da evitare l'insorgere di situazioni pericolose.", "pages": [48, 48], "tags": ["generale"], "always": false, "standards": ["EN ISO 13849-1:2023", "EN ISO 13849-2:2012", "EN IEC 62061:2021 + A1:2024", "EN 60204-1:2018"]}, {"id": "MR-III-1.2.1-1a", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.2. Sistemi di comando", "ref": "All. III, punto 1.2.1, elenco 1, lettera a)", "title": "Sicurezza ed affidabilità dei sistemi di comando — elenco 1, lett. a)", "text": "I sistemi di comando devono essere progettati e costruiti in modo tale che:\na) riescano a resistere, se del caso, a circostanze e rischi, a previste sollecitazioni di servizio e ad influssi esterni intenzionali o meno, compresi tentativi deliberati ragionevolmente prevedibili da parte di terzi che conducono a una situazione pericolosa;", "pages": [48, 48], "tags": ["generale"], "always": false, "standards": ["EN ISO 13849-1:2023", "EN ISO 13849-2:2012", "EN IEC 62061:2021 + A1:2024", "EN 60204-1:2018"]}, {"id": "MR-III-1.2.1-1b", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.2. Sistemi di comando", "ref": "All. III, punto 1.2.1, elenco 1, lettera b)", "title": "Sicurezza ed affidabilità dei sistemi di comando — elenco 1, lett. b)", "text": "I sistemi di comando devono essere progettati e costruiti in modo tale che:\nb) un'avaria nell'hardware o nella logica del sistema di comando non crei situazioni pericolose;", "pages": [48, 48], "tags": ["generale"], "always": false, "standards": ["EN ISO 13849-1:2023", "EN ISO 13849-2:2012", "EN IEC 62061:2021 + A1:2024", "EN 60204-1:2018"]}, {"id": "MR-III-1.2.1-1c", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.2. Sistemi di comando", "ref": "All. III, punto 1.2.1, elenco 1, lettera c)", "title": "Sicurezza ed affidabilità dei sistemi di comando — elenco 1, lett. c)", "text": "I sistemi di comando devono essere progettati e costruiti in modo tale che:\nc) errori della logica del sistema di comando non creino situazioni pericolose;", "pages": [48, 48], "tags": ["generale"], "always": false, "standards": ["EN ISO 13849-1:2023", "EN ISO 13849-2:2012", "EN IEC 62061:2021 + A1:2024", "EN 60204-1:2018"]}, {"id": "MR-III-1.2.1-1d", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.2. Sistemi di comando", "ref": "All. III, punto 1.2.1, elenco 1, lettera d)", "title": "Sicurezza ed affidabilità dei sistemi di comando — elenco 1, lett. d)", "text": "I sistemi di comando devono essere progettati e costruiti in modo tale che:\nd) i limiti delle funzioni di sicurezza siano stabiliti come parte della valutazione del rischio effettuata dal fabbricante e non siano consentite modifiche alle impostazioni o alle norme generate dalla macchina o dal prodotto correlato o dagli operatori, neanche durante la fase di apprendimento della macchina o del prodotto correlato, qualora tali modifiche possano determinare situazioni pericolose;", "pages": [48, 48], "tags": ["generale"], "always": false, "standards": ["EN ISO 13849-1:2023", "EN ISO 13849-2:2012", "EN IEC 62061:2021 + A1:2024", "EN 60204-1:2018"]}, {"id": "MR-III-1.2.1-1e", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.2. Sistemi di comando", "ref": "All. III, punto 1.2.1, elenco 1, lettera e)", "title": "Sicurezza ed affidabilità dei sistemi di comando — elenco 1, lett. e)", "text": "I sistemi di comando devono essere progettati e costruiti in modo tale che:\ne) errori umani ragionevolmente prevedibili nelle manovre non creino situazioni pericolose;", "pages": [48, 48], "tags": ["generale"], "always": false, "standards": ["EN ISO 13849-1:2023", "EN ISO 13849-2:2012", "EN IEC 62061:2021 + A1:2024", "EN 60204-1:2018"]}, {"id": "MR-III-1.2.1-1f", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.2. Sistemi di comando", "ref": "All. III, punto 1.2.1, elenco 1, lettera f)", "title": "Sicurezza ed affidabilità dei sistemi di comando — elenco 1, lett. f)", "text": "I sistemi di comando devono essere progettati e costruiti in modo tale che:\nf) la registrazione di tracciamento dei dati generati in relazione a un intervento e delle versioni del software di sicurezza caricato dopo l'immissione sul mercato o la messa in servizio della macchina o del prodotto correlato sia consentita per cinque anni dopo tale caricamento, esclusivamente al fine di dimostrare la conformità della macchina o del prodotto correlato rispetto al presente allegato a fronte di una richiesta motivata da parte di un'autorità nazionale competente.", "pages": [48, 48], "tags": ["generale"], "always": false, "standards": ["EN ISO 13849-1:2023", "EN ISO 13849-2:2012", "EN IEC 62061:2021 + A1:2024", "EN 60204-1:2018"]}, {"id": "MR-III-1.2.1-2a", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.2. Sistemi di comando", "ref": "All. III, punto 1.2.1, elenco 2, lettera a)", "title": "Sicurezza ed affidabilità dei sistemi di comando — elenco 2, lett. a)", "text": "I sistemi di controllo delle macchine o dei prodotti correlati dotati di un comportamento o una logica integralmente o parzialmente auto-evolutivi e che sono progettati per funzionare con livelli variabili di autonomia devono essere progettati e costruiti in maniera tale da:\na) non essere la causa di azioni, da parte della macchina o del prodotto correlato, che vanno oltre il suo compito e il suo spazio di movimento definiti;", "pages": [48, 48], "tags": ["generale"], "always": false, "standards": ["EN ISO 13849-1:2023", "EN ISO 13849-2:2012", "EN IEC 62061:2021 + A1:2024", "EN 60204-1:2018"]}, {"id": "MR-III-1.2.1-2b", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.2. Sistemi di comando", "ref": "All. III, punto 1.2.1, elenco 2, lettera b)", "title": "Sicurezza ed affidabilità dei sistemi di comando — elenco 2, lett. b)", "text": "I sistemi di controllo delle macchine o dei prodotti correlati dotati di un comportamento o una logica integralmente o parzialmente auto-evolutivi e che sono progettati per funzionare con livelli variabili di autonomia devono essere progettati e costruiti in maniera tale da:\nb) consentire che siano registrati i dati relativi al processo decisionale in materia di sicurezza per i sistemi di sicurezza basati su software che garantiscono la funzione di sicurezza, compresi i componenti di sicurezza, dopo che la macchina o il prodotto correlato sono stati immessi sul mercato o messi in servizio, e che tali dati siano conservati per un anno dopo la loro raccolta, esclusivamente per dimostrare la conformità della macchina o del prodotto correlato al presente allegato a seguito di una richiesta motivata da parte di un'autorità nazionale competente;", "pages": [48, 48], "tags": ["generale"], "always": false, "standards": ["EN ISO 13849-1:2023", "EN ISO 13849-2:2012", "EN IEC 62061:2021 + A1:2024", "EN 60204-1:2018"]}, {"id": "MR-III-1.2.1-2c", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.2. Sistemi di comando", "ref": "All. III, punto 1.2.1, elenco 2, lettera c)", "title": "Sicurezza ed affidabilità dei sistemi di comando — elenco 2, lett. c)", "text": "I sistemi di controllo delle macchine o dei prodotti correlati dotati di un comportamento o una logica integralmente o parzialmente auto-evolutivi e che sono progettati per funzionare con livelli variabili di autonomia devono essere progettati e costruiti in maniera tale da:\nc) consentire in qualsiasi momento la correzione della macchina o del prodotto correlato al fine di preservarne la sicurezza intrinseca.", "pages": [48, 48], "tags": ["generale"], "always": false, "standards": ["EN ISO 13849-1:2023", "EN ISO 13849-2:2012", "EN IEC 62061:2021 + A1:2024", "EN 60204-1:2018"]}, {"id": "MR-III-1.2.1-3a", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.2. Sistemi di comando", "ref": "All. III, punto 1.2.1, elenco 3, lettera a)", "title": "Sicurezza ed affidabilità dei sistemi di comando — elenco 3, lett. a)", "text": "Particolare attenzione deve essere prestata a quanto segue:\na) la macchina o il prodotto correlato non devono avviarsi in modo inatteso;", "pages": [49, 49], "tags": ["generale"], "always": false, "standards": ["EN ISO 13849-1:2023", "EN ISO 13849-2:2012", "EN IEC 62061:2021 + A1:2024", "EN 60204-1:2018"]}, {"id": "MR-III-1.2.1-3b", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.2. Sistemi di comando", "ref": "All. III, punto 1.2.1, elenco 3, lettera b)", "title": "Sicurezza ed affidabilità dei sistemi di comando — elenco 3, lett. b)", "text": "Particolare attenzione deve essere prestata a quanto segue:\nb) i parametri della macchina o del prodotto correlato non devono cambiare in modo incontrollato, laddove tale cambiamento possa portare a situazioni pericolose;", "pages": [49, 49], "tags": ["generale"], "always": false, "standards": ["EN ISO 13849-1:2023", "EN ISO 13849-2:2012", "EN IEC 62061:2021 + A1:2024", "EN 60204-1:2018"]}, {"id": "MR-III-1.2.1-3c", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.2. Sistemi di comando", "ref": "All. III, punto 1.2.1, elenco 3, lettera c)", "title": "Sicurezza ed affidabilità dei sistemi di comando — elenco 3, lett. c)", "text": "Particolare attenzione deve essere prestata a quanto segue:\nc) devono essere evitate le modifiche delle impostazioni o delle norme, generate dalla macchina o dal prodotto correlato o dagli operatori, anche durante la fase di apprendimento della macchina o del prodotto correlato, qualora tali modifiche possano determinare situazioni pericolose;", "pages": [49, 49], "tags": ["generale"], "always": false, "standards": ["EN ISO 13849-1:2023", "EN ISO 13849-2:2012", "EN IEC 62061:2021 + A1:2024", "EN 60204-1:2018"]}, {"id": "MR-III-1.2.1-3d", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.2. Sistemi di comando", "ref": "All. III, punto 1.2.1, elenco 3, lettera d)", "title": "Sicurezza ed affidabilità dei sistemi di comando — elenco 3, lett. d)", "text": "Particolare attenzione deve essere prestata a quanto segue:\nd) non deve essere impedito l'arresto della macchina o del prodotto correlato, se l'ordine di arresto è già stato dato;", "pages": [49, 49], "tags": ["generale"], "always": false, "standards": ["EN ISO 13849-1:2023", "EN ISO 13849-2:2012", "EN IEC 62061:2021 + A1:2024", "EN 60204-1:2018"]}, {"id": "MR-III-1.2.1-3e", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.2. Sistemi di comando", "ref": "All. III, punto 1.2.1, elenco 3, lettera e)", "title": "Sicurezza ed affidabilità dei sistemi di comando — elenco 3, lett. e)", "text": "Particolare attenzione deve essere prestata a quanto segue:\ne) nessun elemento mobile della macchina o del prodotto o pezzo correlato trattenuto dalla macchina o dal prodotto correlato deve cadere o essere espulso;", "pages": [49, 49], "tags": ["generale"], "always": false, "standards": ["EN ISO 13849-1:2023", "EN ISO 13849-2:2012", "EN IEC 62061:2021 + A1:2024", "EN 60204-1:2018"]}, {"id": "MR-III-1.2.1-3f", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.2. Sistemi di comando", "ref": "All. III, punto 1.2.1, elenco 3, lettera f)", "title": "Sicurezza ed affidabilità dei sistemi di comando — elenco 3, lett. f)", "text": "Particolare attenzione deve essere prestata a quanto segue:\nf) non deve essere impedito l'arresto manuale o automatico degli elementi mobili di qualsiasi tipo;", "pages": [49, 49], "tags": ["generale"], "always": false, "standards": ["EN ISO 13849-1:2023", "EN ISO 13849-2:2012", "EN IEC 62061:2021 + A1:2024", "EN 60204-1:2018"]}, {"id": "MR-III-1.2.1-3g", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.2. Sistemi di comando", "ref": "All. III, punto 1.2.1, elenco 3, lettera g)", "title": "Sicurezza ed affidabilità dei sistemi di comando — elenco 3, lett. g)", "text": "Particolare attenzione deve essere prestata a quanto segue:\ng) i dispositivi di protezione devono rimanere pienamente efficaci o dare un comando di arresto;", "pages": [49, 49], "tags": ["generale"], "always": false, "standards": ["EN ISO 13849-1:2023", "EN ISO 13849-2:2012", "EN IEC 62061:2021 + A1:2024", "EN 60204-1:2018"]}, {"id": "MR-III-1.2.1-3h", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.2. Sistemi di comando", "ref": "All. III, punto 1.2.1, elenco 3, lettera h)", "title": "Sicurezza ed affidabilità dei sistemi di comando — elenco 3, lett. h)", "text": "Particolare attenzione deve essere prestata a quanto segue:\nh) le parti del sistema di controllo legate alla sicurezza si devono applicare in modo coerente all'interezza di un insieme di macchine o di prodotti correlati o di semi-macchine o di una loro combinazione.", "pages": [49, 49], "tags": ["generale"], "always": false, "standards": ["EN ISO 13849-1:2023", "EN ISO 13849-2:2012", "EN IEC 62061:2021 + A1:2024", "EN 60204-1:2018"]}, {"id": "MR-III-1.2.1-c2", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.2. Sistemi di comando", "ref": "All. III, punto 1.2.1, comma 2", "title": "Sicurezza ed affidabilità dei sistemi di comando — comma 2", "text": "In caso di comando wireless, un guasto della comunicazione o della connessione o una connessione difettosa non deve comportare una situazione pericolosa.", "pages": [49, 49], "tags": ["generale"], "always": false, "standards": ["EN ISO 13849-1:2023", "EN ISO 13849-2:2012", "EN IEC 62061:2021 + A1:2024", "EN 60204-1:2018"]}, {"id": "MR-III-1.2.2", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.2. Sistemi di comando", "ref": "All. III, punto 1.2.2", "title": "Dispositivi di comando", "text": "I dispositivi di comando devono essere:\na) chiaramente visibili e individuabili utilizzando, se del caso, pittogrammi;\nb) disposti in modo da garantire una manovra sicura, univoca e rapida;\nc) progettati in modo tale che il movimento del dispositivo di comando sia coerente con l'azione del comando;\nd) situati fuori delle zone pericolose tranne il caso, all'occorrenza, di taluni dispositivi di comando, come un arresto di emergenza o una pulsantiera pensile;\ne) sistemati in modo che la loro manovra non causi rischi supplementari;\nf) progettati o protetti in modo che l'azione comandata, se comporta un pericolo, possa avvenire soltanto in seguito ad un'azione deliberata;\ng) fabbricati in modo da resistere alle sollecitazioni prevedibili, prestando particolare attenzione ai dispositivi di arresto di emergenza che possono essere soggetti a notevoli sollecitazioni.\nSe un dispositivo di comando è progettato e costruito per consentire varie azioni differenti, vale a dire se la sua azione non è univoca, l'azione comandata deve essere chiaramente indicata e, all'occorrenza, confermata.\nLa posizione e la corsa dei dispositivi di comando, nonché lo sforzo richiesto devono essere compatibili con l'azione comandata, tenendo conto dei principi ergonomici.\nLe macchine o i prodotti correlati devono essere muniti di indicatori necessari per un funzionamento sicuro. Dalle postazioni di comando l'operatore deve poter leggere i suddetti indicatori.\nDa ogni postazione di comando l'operatore deve poter essere in grado di assicurarsi dell'assenza di persone nelle zone pericolose oppure il sistema di comando deve essere progettato e costruito in modo che l'avviamento sia impedito fintanto che qualsiasi persona si trova nella zona pericolosa.\nQualora nessuna di tali possibilità sia applicabile, prima dell'avviamento della macchina o del prodotto correlato deve essere emesso un segnale di avvertimento sonoro e/o visivo. Le persone esposte devono avere il tempo di abbandonare la zona pericolosa o impedire l'avviamento della macchina.\nSe necessario, vanno previsti mezzi per assicurarsi che la macchina o il prodotto correlato possano essere comandati solo dalle postazioni di comando situate in una o più zone o posti prestabiliti.\nQuando vi sono più postazioni di comando, il sistema di comando deve essere progettato in modo che l'impiego di una di esse renda impossibile l'uso delle altre, ad eccezione dei comandi di arresto e degli arresti di emergenza.\nQuando la macchina o il prodotto correlato sono muniti di più postazioni di manovra, ognuna di esse deve disporre di tutti i dispositivi di comando necessari, senza ostacolare né mettere in situazione pericolosa mutuamente gli operatori.", "pages": [49, 50], "tags": ["generale"], "always": false, "standards": ["EN 894-1:1997+A1:2008", "EN 894-3:2000+A1:2008", "EN 894-4:2010", "EN 61310-3:2008"]}, {"id": "MR-III-1.2.3", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.2. Sistemi di comando", "ref": "All. III, punto 1.2.3", "title": "Avviamento", "text": "L'avviamento di una macchina o di un prodotto correlato deve essere possibile soltanto tramite un'azione volontaria su un dispositivo di comando previsto a tal fine.\nIl medesimo requisito si applica:\na) alla rimessa in marcia dopo un arresto, indipendentemente dall'origine;\nb) all'effettuazione di una modifica rilevante delle condizioni di funzionamento.\nTuttavia, purché ciò non generi situazioni pericolose, la rimessa in marcia o la modifica delle condizioni di funzionamento può essere effettuata tramite un'azione volontaria su un dispositivo diverso dal dispositivo di comando previsto a tal fine.\nPer le macchine o i prodotti correlati a funzionamento automatico, l'avviamento degli stessi, la rimessa in marcia dopo un arresto o la modifica delle condizioni di funzionamento possono essere effettuati senza intervento esterno, se ciò non produce situazioni pericolose.\nQuando la macchina o il prodotto correlato sono muniti di vari dispositivi di comando dell'avviamento e gli operatori possono pertanto mettersi mutuamente in pericolo, devono essere installati dispositivi supplementari per eliminare tali rischi. Se per ragioni di sicurezza l'avviamento e/o l'arresto devono essere effettuati in una sequenza specifica, opportuni dispositivi devono garantire che tali operazioni siano eseguite nell'ordine corretto.", "pages": [50, 50], "tags": ["generale"], "always": false, "standards": ["EN ISO 14118:2018", "EN 60204-1:2018", "EN ISO 13849-1:2023"]}, {"id": "MR-III-1.2.4.1", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.2. Sistemi di comando", "ref": "All. III, punto 1.2.4.1", "title": "Arresto normale", "text": "La macchina o il prodotto correlato devono essere muniti di un dispositivo di comando che consenta l'arresto generale in condizioni di sicurezza.\nOgni postazione di lavoro deve essere munita di un dispositivo di comando che consenta di arrestare, in funzione dei pericoli esistenti, tutte le funzioni della macchina o del prodotto correlato o unicamente una di esse, in modo che la macchina o il prodotto correlato siano portati in condizioni di sicurezza.\nIl comando di arresto della macchina o del prodotto correlato deve avere priorità rispetto ai comandi di avviamento.\nOttenuto l'arresto della macchina o del prodotto correlato o delle loro funzioni pericolose, si deve interrompere l'alimentazione dei relativi azionatori.", "pages": [50, 50], "tags": ["generale"], "always": false, "standards": ["EN 60204-1:2018", "EN ISO 13849-1:2023"]}, {"id": "MR-III-1.2.4.2", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.2. Sistemi di comando", "ref": "All. III, punto 1.2.4.2", "title": "Arresto operativo", "text": "Se, per motivi operativi, è necessario un comando di arresto che non interrompe l'alimentazione degli azionatori, la condizione di arresto deve essere monitorata e mantenuta.", "pages": [50, 50], "tags": ["generale"], "always": false, "standards": ["EN 60204-1:2018", "EN ISO 13849-1:2023"]}, {"id": "MR-III-1.2.4.3", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.2. Sistemi di comando", "ref": "All. III, punto 1.2.4.3", "title": "Arresto di emergenza", "text": "La macchina o il prodotto correlato devono essere muniti di uno o più dispositivi di arresto di emergenza, che consentano di evitare situazioni di pericolo attuali o imminenti.\nSi applicano le eccezioni seguenti:\na) le macchine o i prodotti correlati per i quali il dispositivo di arresto di emergenza non può ridurre il rischio, perché non riduce il tempo per ottenere l'arresto normale oppure perché non permette di prendere le misure specifiche che il rischio richiede;\nb) le macchine o i prodotti correlati portatili tenuti o condotti a mano.\nIl dispositivo deve:\na) comprendere dispositivi di comando chiaramente individuabili, ben visibili e rapidamente accessibili;\nb) provocare l'arresto del processo pericoloso nel tempo più breve possibile, senza creare rischi supplementari;\nc) quando necessario avviare, o permettere di avviare, alcuni movimenti di salvaguardia.\nQuando si smette di azionare il dispositivo di arresto di emergenza dopo un ordine di arresto, tale ordine deve essere mantenuto da un blocco del dispositivo di arresto di emergenza, sino al suo sblocco; non deve essere possibile ottenere il blocco del dispositivo senza che quest'ultimo generi un ordine di arresto; lo sblocco del dispositivo deve essere possibile soltanto con una apposita manovra e non deve riavviare la macchina o il prodotto correlato, ma soltanto consentirne la rimessa in funzione.\nLa funzione di arresto di emergenza deve essere sempre disponibile e operativa a prescindere dalla modalità di funzionamento.\nI dispositivi di arresto di emergenza devono offrire soluzioni di riserva ad altre misure di protezione e non sostituirsi ad esse.", "pages": [50, 51], "tags": ["generale"], "always": false, "standards": ["EN ISO 13850:2015", "EN 60204-1:2018"]}, {"id": "MR-III-1.2.4.4", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.2. Sistemi di comando", "ref": "All. III, punto 1.2.4.4", "title": "Insiemi di macchine o di prodotti correlati", "text": "Nel caso di una macchina o di un prodotto correlato o di elementi di una macchina o di un prodotto correlato progettati per lavorare assemblati, la macchina o il prodotto correlato devono essere progettati e costruiti in modo tale che i comandi di arresto, compresi i dispositivi di arresto di emergenza, possano bloccare non soltanto la macchina stessa o il prodotto correlato stesso ma anche tutte le attrezzature collegate, qualora il loro mantenimento in funzione possa costituire un pericolo.", "pages": [51, 51], "tags": ["generale"], "always": false, "standards": ["EN ISO 11161:2007 + A1:2010", "EN ISO 13850:2015"]}, {"id": "MR-III-1.2.5", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.2. Sistemi di comando", "ref": "All. III, punto 1.2.5", "title": "Selezione del modo di comando o di funzionamento", "text": "Il modo di comando o di funzionamento selezionato deve avere la priorità su tutti gli altri modi di comando o di funzionamento, salvo l'arresto di emergenza.\nSe è stato progettato e costruito per consentire diversi modi di comando o di funzionamento che necessitano di misure di protezione e/o di procedure di lavoro diverse, la macchina o il prodotto correlato devono essere muniti di un selettore di modo di comando o di funzionamento che possa essere bloccato in ogni posizione. A ciascuna posizione del selettore, che deve essere chiaramente individuabile, deve corrispondere un solo modo di comando o di funzionamento.\nIl selettore può essere sostituito da altri mezzi di selezione che limitino l'utilizzo di talune funzioni della macchina o del prodotto correlato a talune categorie di operatori.\nSe per alcune operazioni la macchina o il prodotto correlato devono poter funzionare con un riparo spostato o rimosso e/o con il dispositivo di protezione neutralizzato, il selettore del modo di comando o di funzionamento deve simultaneamente:\na) escludere tutti gli altri modi di comando o di funzionamento;\nb) consentire l'attivazione delle funzioni pericolose soltanto mediante dispositivi di comando che necessitano di un'azione continuata;\nc) consentire l'attivazione delle funzioni pericolose soltanto in condizioni di minor rischio, evitando i pericoli derivanti dal succedersi delle sequenze;\nd) impedire qualsiasi attivazione delle funzioni pericolose mediante un'azione volontaria o involontaria sui sensori della macchina o del prodotto correlato.\nSe queste quattro condizioni non possono essere soddisfatte simultaneamente, il selettore del modo di comando o di funzionamento deve attivare altre misure di protezione progettate e costruite per garantire una zona di intervento sicura.\nInoltre, alla postazione di manovra l'operatore deve avere la padronanza del funzionamento degli elementi sui quali agisce.", "pages": [51, 51], "tags": ["generale"], "always": false, "standards": ["EN 60204-1:2018", "EN ISO 13849-1:2023", "EN IEC 62061:2021 + A1:2024"]}, {"id": "MR-III-1.2.6", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.2. Sistemi di comando", "ref": "All. III, punto 1.2.6", "title": "Guasto del circuito di alimentazione di energia o della connessione alla rete di comunicazione", "text": "L'interruzione, il ripristino dopo un'interruzione o la variazione, di qualsiasi tipo, dell'alimentazione di energia o della connessione alla rete di comunicazione della macchina o del prodotto correlato non deve creare situazioni pericolose.\nParticolare attenzione deve essere prestata a quanto segue:\na) la macchina o il prodotto correlato non devono avviarsi in modo inatteso;\nb) i parametri della macchina non devono cambiare in modo incontrollato, quando tale cambiamento può portare a situazioni pericolose;\nc) non deve essere impedito l'arresto della macchina o del prodotto correlato, se l'ordine di arresto è già stato dato;\nd) nessun elemento mobile della macchina o del prodotto o pezzo correlato trattenuto dalla macchina o dal prodotto correlato deve cadere o essere espulso;\ne) non deve essere impedito l'arresto manuale o automatico degli elementi mobili di qualsiasi tipo;\nf) i dispositivi di protezione devono rimanere pienamente efficaci o dare un comando di arresto.", "pages": [52, 52], "tags": ["generale"], "always": false, "standards": ["EN 60204-1:2018", "EN ISO 14118:2018", "EN ISO 13849-1:2023"]}, {"id": "MR-III-1.3.1", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.3. Misure di protezione contro i rischi meccanici", "ref": "All. III, punto 1.3.1", "title": "Rischio di perdita di stabilità", "text": "La macchina o il prodotto correlato, elementi e attrezzature compresi, devono avere una stabilità tale da evitare il rovesciamento, la caduta o gli spostamenti non comandati durante il trasporto, il montaggio, lo smontaggio e tutte le altre azioni che interessano la macchina e il prodotto correlato.\nSe la forma stessa della macchina o del prodotto correlato o la sua installazione prevista non garantiscono sufficiente stabilità, devono essere previsti ed indicati nelle istruzioni per l'uso appositi mezzi di fissaggio.", "pages": [52, 52], "tags": ["generale"], "always": false, "standards": []}, {"id": "MR-III-1.3.2", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.3. Misure di protezione contro i rischi meccanici", "ref": "All. III, punto 1.3.2", "title": "Rischio di rottura durante il funzionamento", "text": "Gli elementi delle macchine o dei prodotti correlati, nonché i loro organi di collegamento, devono resistere agli sforzi cui devono essere sottoposti durante l'utilizzazione.\nI materiali utilizzati devono presentare caratteristiche di resistenza sufficienti e adeguate all'ambiente di utilizzazione, previsto dal fabbricante, in particolare per quanto riguarda i fenomeni di fatica, invecchiamento, corrosione e abrasione.\nNelle istruzioni per l'uso devono essere indicati i tipi e le frequenze delle ispezioni e manutenzioni necessarie per motivi di sicurezza. Devono essere indicati dove appropriato gli elementi soggetti ad usura, nonché i criteri di sostituzione.\nSe nonostante le precauzioni prese sussistono rischi di disintegrazione o di rottura, gli elementi in questione devono essere montati, disposti o protetti in modo che i loro eventuali frammenti vengano trattenuti evitando situazioni pericolose.\nLe tubazioni rigide o elastiche contenenti fluidi, in particolare ad alta pressione, devono poter sopportare le sollecitazioni interne ed esterne previste e devono essere solidamente fissate o protette affinché, in caso di rottura, esse non presentino rischi.\nIn caso di alimentazione automatica del materiale da lavorare verso l'utensile, devono essere soddisfatte le condizioni seguenti per evitare rischi per le persone:\na) al momento del contatto tra l’utensile e il pezzo, l'utensile deve aver raggiunto le sue normali condizioni di lavoro;\nb) al momento dell'avviamento e/o dell'arresto dell'utensile (volontario o accidentale), il movimento di alimentazione e il movimento dell'utensile devono essere coordinati.", "pages": [52, 52], "tags": ["generale"], "always": false, "standards": ["EN ISO 4413:2010", "EN ISO 4414:2010"]}, {"id": "MR-III-1.3.3", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.3. Misure di protezione contro i rischi meccanici", "ref": "All. III, punto 1.3.3", "title": "Rischi dovuti alla caduta o alla proiezione di oggetti", "text": "Devono essere prese precauzioni per evitare i rischi derivanti dalla caduta o dalla proiezione di oggetti.", "pages": [53, 53], "tags": ["generale"], "always": false, "standards": ["EN ISO 14120:2015"]}, {"id": "MR-III-1.3.4", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.3. Misure di protezione contro i rischi meccanici", "ref": "All. III, punto 1.3.4", "title": "Rischi dovuti a superfici, spigoli o angoli", "text": "Gli elementi accessibili della macchina o di un prodotto correlato devono essere privi, entro i limiti consentiti dalle loro funzioni, di angoli acuti e di spigoli vivi, nonché di superfici rugose che possono causare lesioni.", "pages": [53, 53], "tags": ["generale"], "always": false, "standards": []}, {"id": "MR-III-1.3.5", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.3. Misure di protezione contro i rischi meccanici", "ref": "All. III, punto 1.3.5", "title": "Rischi dovuti a una macchina o a un prodotto correlato combinati", "text": "Quando è previsto che la macchina o il prodotto correlato possano eseguire diversi tipi di operazioni con ripresa manuale del pezzo fra ogni operazione (macchina o prodotto correlato combinati), essi devono essere progettati e costruiti in modo che ciascun elemento possa essere utilizzato separatamente senza che gli altri elementi costituiscano un rischio per le persone esposte.\nA tal fine, gli elementi che non siano protetti devono poter essere messi in moto o arrestati individualmente.", "pages": [53, 53], "tags": ["generale"], "always": false, "standards": []}, {"id": "MR-III-1.3.6", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.3. Misure di protezione contro i rischi meccanici", "ref": "All. III, punto 1.3.6", "title": "Rischi connessi alle variazioni delle condizioni di funzionamento", "text": "Quando possono effettuare operazioni in condizioni di impiego diverse, la macchina o il prodotto correlato devono essere progettati e costruiti in modo che la scelta e la regolazione di tali condizioni possano essere effettuate in modo sicuro e affidabile.", "pages": [53, 53], "tags": ["generale"], "always": false, "standards": []}, {"id": "MR-III-1.3.7", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.3. Misure di protezione contro i rischi meccanici", "ref": "All. III, punto 1.3.7", "title": "Rischi dovuti a elementi mobili", "text": "Gli elementi mobili della macchina o del prodotto correlato devono essere progettati e costruiti per evitare i rischi di contatto che possono provocare infortuni oppure, se i rischi persistono, essere muniti di ripari o dispositivi di protezione.\nDevono essere adottate tutte le misure necessarie per impedire un bloccaggio improvviso degli elementi mobili. Nei casi in cui, malgrado le precauzioni prese, possa verificarsi un bloccaggio, dovranno essere previsti, ove opportuno, i dispositivi di protezione specifici e gli utensili specifici necessari per permettere lo sbloccaggio in modo sicuro.\nLe istruzioni per l'uso e, ove possibile, un'indicazione sulla macchina o sul prodotto correlato devono individuare tali dispositivi di protezione specifici e la modalità di impiego.\nLa prevenzione di rischi derivanti da contatto che determinano situazioni di pericolo e le tensioni psichiche che possono essere causate dall'interazione con la macchina deve essere adeguata in relazione a:\na) coesistenza uomo-macchina in uno spazio condiviso in assenza di collaborazione diretta;\nb) interazione uomo-macchina.", "pages": [53, 53], "tags": ["generale"], "always": false, "standards": ["EN ISO 14120:2015", "EN ISO 13857:2019", "EN ISO 13854:2019"]}, {"id": "MR-III-1.3.8", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.3. Misure di protezione contro i rischi meccanici", "ref": "All. III, punto 1.3.8", "title": "Scelta di una protezione contro i rischi dovuti a elementi mobili", "text": "I ripari o i dispositivi di protezione progettati contro i rischi dovuti a elementi mobili devono essere scelti in funzione del tipo di rischio. Per la scelta si deve ricorrere alle linee guida seguenti.", "pages": [53, 53], "tags": ["generale"], "always": false, "standards": ["EN ISO 14120:2015", "EN ISO 14119:2025 + A11:2026", "EN ISO 13857:2019", "EN ISO 13855:2024"]}, {"id": "MR-III-1.3.8.1", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.3. Misure di protezione contro i rischi meccanici", "ref": "All. III, punto 1.3.8.1", "title": "Elementi mobili di trasmissione", "text": "I ripari progettati per proteggere le persone dai pericoli creati dagli elementi mobili di trasmissione devono essere:\na) ripari fissi di cui al punto 1.4.2.1; oppure\nb) ripari mobili interbloccati, di cui al punto 1.4.2.2.\nSe si prevedono interventi frequenti, si deve ricorrere a ripari mobili interbloccati.", "pages": [53, 53], "tags": ["generale"], "always": false, "standards": ["EN ISO 14120:2015", "EN ISO 14119:2025 + A11:2026", "EN ISO 13857:2019", "EN ISO 13855:2024"]}, {"id": "MR-III-1.3.8.2", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.3. Misure di protezione contro i rischi meccanici", "ref": "All. III, punto 1.3.8.2", "title": "Elementi mobili che partecipano alla lavorazione", "text": "I ripari o i dispositivi di protezione progettati per proteggere le persone dai pericoli creati dagli elementi mobili che partecipano alla lavorazione devono essere:\na) ripari fissi di cui al punto 1.4.2.1; oppure\nb) ripari mobili interbloccati, di cui al punto 1.4.2.2. oppure\nc) dispositivi di protezione di cui al punto 1.4.3; oppure\nd) una combinazione di quanto sopra.\nTuttavia, se taluni elementi mobili che partecipano direttamente alla lavorazione non possono essere resi interamente inaccessibili durante il loro funzionamento a causa di operazioni che richiedono l'intervento dell'operatore, tali elementi devono essere muniti di:\na) ripari fissi o di ripari mobili interbloccati, che impediscano l'accesso alle parti degli elementi non utilizzate per la lavorazione; e\nb) ripari regolabili di cui al punto 1.4.2.3, che limitino l'accesso alle parti degli elementi mobili cui è necessario accedere.", "pages": [54, 54], "tags": ["generale"], "always": false, "standards": ["EN ISO 14120:2015", "EN ISO 14119:2025 + A11:2026", "EN ISO 13857:2019", "EN ISO 13855:2024"]}, {"id": "MR-III-1.3.9", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.3. Misure di protezione contro i rischi meccanici", "ref": "All. III, punto 1.3.9", "title": "Rischi di movimenti incontrollati", "text": "Quando un elemento della macchina o del prodotto correlato è stato arrestato, la sua deriva dalla posizione di arresto, per qualsiasi causa che non sia l'azionamento di dispositivi di comando, deve essere impedita o essere tale da non presentare un rischio.", "pages": [54, 54], "tags": ["generale"], "always": false, "standards": ["EN ISO 14118:2018", "EN ISO 13849-1:2023"]}, {"id": "MR-III-1.4.1", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.4. Caratteristiche richieste per i ripari ed i dispositivi di protezione", "ref": "All. III, punto 1.4.1", "title": "Requisiti generali", "text": "I ripari e i dispositivi di protezione:\na) devono essere di costruzione robusta;\nb) devono essere fissati solidamente;\nc) non devono provocare pericoli supplementari;\nd) non devono essere facilmente elusi o resi inefficaci;\ne) devono essere situati ad una distanza sufficiente dalla zona pericolosa;\nf) non devono limitare più del necessario l'osservazione del ciclo di lavoro; e\ng) devono permettere gli interventi indispensabili per l'installazione e/o la sostituzione degli utensili e per i lavori di manutenzione, limitando però l'accesso soltanto al settore in cui deve essere effettuato il lavoro e, se possibile, senza smontare il riparo o senza disattivare il dispositivo di protezione.\nInoltre, se possibile, i ripari devono proteggere dalla caduta e dalla proiezione di materiali o oggetti e dalle emissioni provocate dalla macchina o dal prodotto correlato.", "pages": [54, 54], "tags": ["generale"], "always": false, "standards": ["EN ISO 14120:2015", "EN ISO 14119:2025 + A11:2026", "EN ISO 13857:2019", "EN ISO 13855:2024"]}, {"id": "MR-III-1.4.2.1", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.4. Caratteristiche richieste per i ripari ed i dispositivi di protezione", "ref": "All. III, punto 1.4.2.1", "title": "Ripari fissi", "text": "Il fissaggio dei ripari fissi deve essere ottenuto con sistemi che richiedono l'uso di utensili per la loro apertura o smontaggio.\nI sistemi di fissaggio devono rimanere attaccati ai ripari o alla macchina o al prodotto correlato quando i ripari sono rimossi.\nSe possibile, i ripari non devono poter rimanere al loro posto in mancanza dei loro mezzi di fissaggio.", "pages": [54, 54], "tags": ["generale"], "always": false, "standards": ["EN ISO 14120:2015", "EN ISO 14119:2025 + A11:2026", "EN ISO 13857:2019", "EN ISO 13855:2024"]}, {"id": "MR-III-1.4.2.2", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.4. Caratteristiche richieste per i ripari ed i dispositivi di protezione", "ref": "All. III, punto 1.4.2.2", "title": "Ripari mobili interbloccati", "text": "I ripari mobili interbloccati devono:\na) per quanto possibile restare uniti alla macchina o al prodotto correlato quando siano aperti;\nb) essere progettati e costruiti in modo che la loro regolazione richieda un intervento volontario.\nI ripari mobili interbloccati devono essere associati ad un dispositivo di interblocco che:\na) impedisca l'avviamento di funzioni pericolose della macchina o del prodotto correlato fin quando i ripari sono chiusi; e\nb) dia un comando di arresto non appena i ripari non sono più chiusi.\nSe un operatore può raggiungere la zona pericolosa prima che sia cessato il rischio dovuto alle funzioni pericolose della macchina o del prodotto correlato, i ripari mobili devono essere associati ad un dispositivo di bloccaggio del riparo, oltre che ad un dispositivo di interblocco che:\na) impedisca l'avviamento delle funzioni pericolose della macchina o del prodotto correlato fin quando il riparo non è chiuso e bloccato; e\nb) tenga il riparo chiuso e bloccato fin quando non è cessato il rischio di lesioni dovuto alle funzioni pericolose della macchina o del prodotto correlato.\nI ripari mobili interbloccati devono essere progettati in modo che la mancanza o il guasto di uno dei loro elementi impedisca l'avviamento o provochi l'arresto delle funzioni pericolose della macchina o del prodotto correlato.", "pages": [55, 55], "tags": ["generale"], "always": false, "standards": ["EN ISO 14120:2015", "EN ISO 14119:2025 + A11:2026", "EN ISO 13857:2019", "EN ISO 13855:2024"]}, {"id": "MR-III-1.4.2.3", "law": "MR", "section": "MR-III", "group": "Allegato III — 1.4. Caratteristiche richieste per i ripari ed i dispositivi di protezione", "ref": "All. III, punto 1.4.2.3", "title": "Ripari regolabili che limitano l'accesso", "text": "I ripari regolabili che limitano l'accesso alle parti degli elementi mobili indispensabili alla lavorazione devono:\na) poter

 della macchina deve essere compatibile con l'andatura del conducente.\nSulle macchine che possono essere munite di un utensile rotante, quest'ultimo non deve potere essere azionato quando il comando di retromarcia è inserito, salvo che lo spostamento della macchina risulti dal movimento dell'utensile. In quest'ultimo caso la velocità in retromarcia deve essere sufficientemente ridotta, in modo da non presentare rischi per il conducente.", "pages": [70, 70], "tags": ["mobilita"], "always": false, "standards": ["EN ISO 4254-1:2015 + A1:2021", "EN 474-1:2022", "EN ISO 3691-1:2015 + A1:2020", "EN 16307-1:2020"]}, {"id": "MR-III-3.3.5", "law": "MR", "section": "MR-III", "group": "Allegato III — 3.3. Sistemi di comando", "ref": "All. III, punto 3.3.5", "title": "Guasto del circuito di comando", "text": "In caso di guasto dell'alimentazione del servosterzo, la macchina deve poter essere guidata per il tempo necessario ad arrestarla.\nNel caso di una macchina mobile autonoma, un guasto del meccanismo di sterzo non deve incidere sulla sicurezza della macchina.", "pages": [70, 70], "tags": ["mobilita"], "always": false, "standards": ["EN ISO 4254-1:2015 + A1:2021", "EN 474-1:2022", "EN ISO 3691-1:2015 + A1:2020", "EN 16307-1:2020"]}, {"id": "MR-III-3.4.1", "law": "MR", "section": "MR-III", "group": "Allegato III — 3.4. Misure di protezione contro i rischi meccanici", "ref": "All. III, punto 3.4.1", "title": "Movimenti incontrollati", "text": "Le macchine o i prodotti correlati devono essere progettati, costruiti ed eventualmente montati su un supporto mobile in modo che al momento dello spostamento le oscillazioni incontrollate del baricentro non ne pregiudichino la stabilità né comportino sforzi eccessivi per la struttura.", "pages": [70, 70], "tags": ["mobilita"], "always": false, "standards": ["EN ISO 4254-1:2015 + A1:2021", "EN 474-1:2022", "EN ISO 3691-1:2015 + A1:2020", "EN 16307-1:2020"]}, {"id": "MR-III-3.4.2", "law": "MR", "section": "MR-III", "group": "Allegato III — 3.4. Misure di protezione contro i rischi meccanici", "ref": "All. III, punto 3.4.2", "title": "Elementi mobili di trasmissione", "text": "In deroga al punto 1.3.8.1, nel caso dei motori, i ripari mobili che impediscono l'accesso agli elementi mobili del compartimento motore non devono essere provvisti di dispositivi di interblocco, a condizione che la loro apertura sia possibile soltanto con l'impiego di un utensile o di una chiave, oppure dopo aver azionato un comando situato sulla postazione di guida, se quest'ultima si trova in una cabina completamente chiusa con una serratura per impedire l'accesso non autorizzato.", "pages": [70, 70], "tags": ["mobilita"], "always": false, "standards": ["EN ISO 4254-1:2015 + A1:2021", "EN 474-1:2022", "EN ISO 3691-1:2015 + A1:2020", "EN 16307-1:2020"]}, {"id": "MR-III-3.4.3", "law": "MR", "section": "MR-III", "group": "Allegato III — 3.4. Misure di protezione contro i rischi meccanici", "ref": "All. III, punto 3.4.3", "title": "Ribaltamento o rovesciamento laterale", "text": "Quando per una macchina semovente con conducente, operatore/i o altra/e persona/e trasportati esiste il rischio di ribaltamento o rovesciamento laterale, tale macchina deve essere munita di una struttura di protezione appropriata, a meno che ciò non accresca i rischi.\nDetta struttura deve essere tale da garantire alle persone trasportate, in caso di ribaltamento o rovesciamento laterale, un adeguato volume limite di deformazione.\nAl fine di verificare che la struttura soddisfi il requisito di cui al secondo comma, il fabbricante deve effettuare, o far effettuare, prove appropriate per ciascun tipo di struttura.", "pages": [70, 70], "tags": ["mobilita"], "always": false, "standards": ["EN ISO 4254-1:2015 + A1:2021", "EN 474-1:2022", "EN ISO 3691-1:2015 + A1:2020", "EN 16307-1:2020"]}, {"id": "MR-III-3.4.4", "law": "MR", "section": "MR-III", "group": "Allegato III — 3.4. Misure di protezione contro i rischi meccanici", "ref": "All. III, punto 3.4.4", "title": "Caduta di oggetti", "text": "Quando per una macchina semovente con conducente, operatore/i altra/e o persona/e trasportati esistono rischi dovuti alla caduta di oggetti o di materiali, essa deve essere progettata e costruita in modo da tenere conto di tali rischi; essa deve inoltre essere munita, se le sue dimensioni lo consentono, di una struttura di protezione appropriata.\nDetta struttura deve esser tale che in caso di caduta di oggetti o di materiali sia garantito alla persona o alle persone trasportate un adeguato volume limite di deformazione.\nAl fine di verificare che la struttura soddisfi il requisito di cui al secondo comma, il fabbricante deve effettuare, o far effettuare, prove appropriate per ciascun tipo di struttura.", "pages": [71, 71], "tags": ["mobilita"], "always": false, "standards": ["EN ISO 4254-1:2015 + A1:2021", "EN 474-1:2022", "EN ISO 3691-1:2015 + A1:2020", "EN 16307-1:2020"]}, {"id": "MR-III-3.4.5", "law": "MR", "section": "MR-III", "group": "Allegato III — 3.4. Misure di protezione contro i rischi meccanici", "ref": "All. III, punto 3.4.5", "title": "Mezzi di accesso", "text": "Mezzi di appoggio o di sostegno devono essere progettati, costruiti e disposti in modo che gli operatori li utilizzino istintivamente e non ricorrano ai dispositivi di comando per facilitare l'accesso.", "pages": [71, 71], "tags": ["mobilita"], "always": false, "standards": ["EN ISO 4254-1:2015 + A1:2021", "EN 474-1:2022", "EN ISO 3691-1:2015 + A1:2020", "EN 16307-1:2020"]}, {"id": "MR-III-3.4.6", "law": "MR", "section": "MR-III", "group": "Allegato III — 3.4. Misure di protezione contro i rischi meccanici", "ref": "All. III, punto 3.4.6", "title": "Dispositivi di traino", "text": "Ogni macchina utilizzata per trainare o destinata ad essere trainata deve essere munita di dispositivi di rimorchio o di traino progettati, costruiti e disposti in modo da garantire che il collegamento e lo sganciamento possano essere effettuati facilmente e in modo sicuro e da impedire uno sganciamento accidentale durante l'utilizzazione.\nQualora il carico sul timone lo richieda, tali macchine devono essere munite di un supporto con una superficie d'appoggio adattata al carico e al terreno.", "pages": [71, 71], "tags": ["mobilita"], "always": false, "standards": ["EN ISO 4254-1:2015 + A1:2021", "EN 474-1:2022", "EN ISO 3691-1:2015 + A1:2020", "EN 16307-1:2020"]}, {"id": "MR-III-3.4.7", "law": "MR", "section": "MR-III", "group": "Allegato III — 3.4. Misure di protezione contro i rischi meccanici", "ref": "All. III, punto 3.4.7", "title": "Trasmissione di potenza tra la macchina semovente (o il trattore) e la macchina azionata", "text": "I dispositivi amovibili di trasmissione meccanica che collegano una macchina semovente (o un trattore) al primo supporto fisso di una macchina azionata devono essere progettati e costruiti in modo che tutte le parti in movimento durante il funzionamento siano protette per tutta la lunghezza.\nSul lato della macchina semovente o del trattore, la presa di forza alla quale è correlato il dispositivo amovibile di trasmissione meccanica deve essere protetta da un riparo fisso correlato alla macchina semovente (o al trattore) oppure da qualsiasi altro dispositivo che garantisca una protezione equivalente.\nDeve essere possibile aprire tale riparo per accedere al dispositivo amovibile di trasmissione. Una volta collocata, deve esservi abbastanza spazio per impedire all'albero motore di danneggiare il riparo quando la macchina (o il trattore) è in movimento.\nSul lato della macchina azionata, l'albero comandato deve essere chiuso in un carter di protezione fissato sulla macchina.\nLa presenza di un limitatore di coppia o di una ruota libera è autorizzata per la trasmissione cardanica soltanto sul lato in cui avviene il collegamento con la macchina azionata. In tal caso occorre indicare sul dispositivo amovibile di trasmissione meccanica il senso del montaggio.\nOgni macchina azionata il cui funzionamento implica la presenza di un dispositivo amovibile di trasmissione meccanica che la colleghi ad una macchina semovente (o a un trattore) deve possedere un sistema di aggancio del dispositivo amovibile di trasmissione meccanica tale che, quando la macchina è staccata, il dispositivo amovibile di trasmissione meccanica e il suo riparo non vengano danneggiati dal contatto con il suolo o con un elemento della macchina.\nGli elementi esterni del riparo devono essere progettati, costruiti e disposti in modo da non poter ruotare con il dispositivo amovibile di trasmissione meccanica. Il riparo deve coprire l'albero di trasmissione fino alle estremità delle ganasce interne nel caso di giunti cardanici semplici e almeno fino al centro del giunto o dei giunti esterni nel caso di cardani detti a grandangolo.\nSe sono previsti accessi alle postazioni di lavoro in prossimità del dispositivo amovibile di trasmissione meccanica, essi devono essere progettati e costruiti in modo da evitare che i ripari di tali alberi possano servire da predellini, a meno che non siano progettati e costruiti a tal fine.", "pages": [71, 71], "tags": ["mobilita"], "always": false, "standards": ["EN ISO 4254-1:2015 + A1:2021", "EN 474-1:2022", "EN ISO 3691-1:2015 + A1:2020", "EN 16307-1:2020"]}, {"id": "MR-III-3.5.1", "law": "MR", "section": "MR-III", "group": "Allegato III — 3.5. Misure di protezione contro altri rischi", "ref": "All. III, punto 3.5.1", "title": "Batteria d'accumulatori", "text": "L'alloggiamento della batteria deve essere progettato e costruito in modo da impedire la proiezione dell'elettrolita sull'operatore in caso di ribaltamento o rovesciamento laterale e da evitare l'accumulo di vapori vicino ai posti occupati dagli operatori.\nLe macchine o i prodotti correlati devono essere progettati e costruiti in modo che la batteria possa essere disinserita con un dispositivo facilmente accessibile previsto a tal fine.\nLe batterie con ricarica automatica per macchine mobili o prodotti correlati, tra cui macchine o prodotti correlati mobili autonomi, sono progettate per prevenire i pericoli di cui ai punti 1.3.8.2 e 1.5.1, compresi i rischi di contatto o di urto della macchina o del prodotto correlato con una persona o un'altra macchina o un altro prodotto correlato quando la macchina o i prodotti correlati si muovono autonomamente verso la stazione di ricarica.", "pages": [72, 72], "tags": ["mobilita"], "always": false, "standards": ["EN ISO 4254-1:2015 + A1:2021", "EN 474-1:2022", "EN ISO 3691-1:2015 + A1:2020", "EN 16307-1:2020"]}, {"id": "MR-III-3.5.2", "law": "MR", "section": "MR-III", "group": "Allegato III — 3.5. Misure di protezione contro altri rischi", "ref": "All. III, punto 3.5.2", "title": "Incendio", "text": "A seconda dei pericoli previsti dal fabbricante la macchina deve, qualora le dimensioni lo consentano:\na) permettere l'installazione di estintori facilmente accessibili; oppure\nb) essere munita di sistemi di estinzione che siano parte integrante della macchina.", "pages": [72, 72], "tags": ["mobilita"], "always": false, "standards": ["EN ISO 4254-1:2015 + A1:2021", "EN 474-1:2022", "EN ISO 3691-1:2015 + A1:2020", "EN 16307-1:2020"]}, {"id": "MR-III-3.5.3", "law": "MR", "section": "MR-III", "group": "Allegato III — 3.5. Misure di protezione contro altri rischi", "ref": "All. III, punto 3.5.3", "title": "Emissioni di sostanze pericolose", "text": "Il punto 1.5.13, secondo e terzo comma, non si applica quando la funzione principale della macchina è l'applicazione di sostanze pericolose. Tuttavia l'operatore deve essere protetto dal rischio di esposizione a tali emissioni pericolose.\nLe macchine mobili che trasportano il conducente aventi come loro funzione principale l'applicazione di sostanze pericolose devono essere dotate di cabine di filtrazione o misure di sicurezza equivalenti.", "pages": [72, 72], "tags": ["mobilita"], "always": false, "standards": ["EN ISO 4254-1:2015 + A1:2021", "EN 474-1:2022", "EN ISO 3691-1:2015 + A1:2020", "EN 16307-1:2020"]}, {"id": "MR-III-3.5.4", "law": "MR", "section": "MR-III", "group": "Allegato III — 3.5. Misure di protezione contro altri rischi", "ref": "All. III, punto 3.5.4", "title": "Rischio di contatto con linee elettriche aeree sotto tensione", "text": "A seconda della loro altezza, in relazione all’uso previsto, una macchina o un prodotto correlato mobile devono essere progettati, costruiti ed equipaggiati in maniera tale da prevenire il rischio di contatto con una linea elettrica aerea sotto tensione o il rischio di creare un arco elettrico tra qualsiasi parte della macchina o un operatore che conduce la macchina e una linea elettrica aerea sotto tensione.\nQuando il rischio di contatto con una linea elettrica aerea sotto tensione non può essere evitato completamente per le persone che operano la macchina, le macchine o i prodotti correlati mobili devono essere progettati, costruiti ed equipaggiati in maniera tale da prevenire qualsiasi pericolo elettrico.", "pages": [72, 72], "tags": ["mobilita"], "always": false, "standards": ["EN ISO 4254-1:2015 + A1:2021", "EN 474-1:2022", "EN ISO 3691-1:2015 + A1:2020", "EN 16307-1:2020"]}, {"id": "MR-III-3.6.1", "law": "MR", "section": "MR-III", "group": "Allegato III — 3.6. Informazioni e indicazioni", "ref": "All. III, punto 3.6.1", "title": "Iscrizioni, segnalazioni e avvertimenti", "text": "Le macchine o i prodotti correlati devono essere tutti provvisti di iscrizioni e/o di targhe con le istruzioni per l'uso, la regolazione e la manutenzione, ovunque necessario, per garantire la tutela della salute e la sicurezza delle persone. Tali mezzi devono essere scelti, progettati e realizzati in modo da essere chiaramente visibili e indelebili.\nFatte salve le disposizioni relative alla circolazione stradale, le macchine o i prodotti correlati con conducente trasportato devono essere dotati dell’attrezzatura seguente:\na) un avvisatore acustico che consenta di avvertire le persone;\nb) un sistema di segnalazione luminosa che tenga conto delle condizioni di impiego previste; ciò non si applica alle macchine o ai prodotti correlati destinati esclusivamente ai lavori sotterranei e sprovvisti di alimentazione elettrica;\nc) all'occorrenza, vi deve essere un appropriato sistema di collegamento tra il rimorchio e la macchina o un prodotto correlato per l'azionamento dei segnali.\nLe macchine o i prodotti correlati dotati di telecomando, le cui condizioni di impiego normali espongono le persone a rischi di urto o di schiacciamento, devono essere muniti di mezzi adeguati per segnalare i loro spostamenti o di mezzi per proteggere le persone contro tali rischi. Lo stesso vale per le macchine o i prodotti correlati la cui utilizzazione implica la ripetizione sistematica di avanzamento e arretramento lungo uno stesso asse e il cui conducente non ha visibilità posteriore diretta.\nLe macchine o i prodotti correlati devono essere costruiti in modo tale che i dispositivi di avvertimento e di segnalazione non possano essere disinseriti involontariamente. Laddove indispensabile ai fini della sicurezza, tali dispositivi devono essere muniti di mezzi di controllo del buon funzionamento e un loro guasto deve essere reso apparente all'operatore.\nQualora il movimento delle macchine o dei loro utensili sia particolarmente pericoloso, devono essere previste indicazioni sulle macchine stesse che avvertano di non avvicinarsi alle macchine durante il lavoro; tali indicazioni devono essere leggibili a distanza sufficiente per garantire la sicurezza delle persone che operano nei pressi delle macchine.", "pages": [72, 73], "tags": ["mobilita"], "always": false, "standards": ["EN ISO 4254-1:2015 + A1:2021", "EN 474-1:2022", "EN ISO 3691-1:2015 + A1:2020", "EN 16307-1:2020"]}, {"id": "MR-III-3.6.2", "law": "MR", "section": "MR-III", "group": "Allegato III — 3.6. Informazioni e indicazioni", "ref": "All. III, punto 3.6.2", "title": "Marcatura", "text": "1) Le macchine o i prodotti correlati devono tutti recare, in modo leggibile e indelebile, le indicazioni seguenti:\na) la potenza nominale espressa in chilowatt (kW);\nb) la massa, nella configurazione più usuale, in chilogrammi (kg);\n2) Inoltre, se del caso, le macchine o i prodotti correlati devono tutti recare, in modo leggibile e indelebile, le indicazioni seguenti:\na) lo sforzo massimo di trazione previsto dal fabbricante al gancio di traino in newton (N);\nb) lo sforzo verticale massimo previsto sul gancio di traino in newton (N).", "pages": [73, 73], "tags": ["mobilita"], "always": false, "standards": ["EN ISO 4254-1:2015 + A1:2021", "EN 474-1:2022", "EN ISO 3691-1:2015 + A1:2020", "EN 16307-1:2020"]}, {"id": "MR-III-3.6.3.1", "law": "MR", "section": "MR-III", "group": "Allegato III — 3.6. Informazioni e indicazioni", "ref": "All. III, punto 3.6.3.1", "title": "Vibrazioni", "text": "Le istruzioni per l'uso devono fornire le indicazioni seguenti relative alle vibrazioni, espresse come accelerazione (m/s2), trasmesse dalla macchina o dai prodotti correlati al sistema mano-braccio o a tutto il corpo:\na) il valore totale delle vibrazioni continue a cui è sottoposto il sistema mano-braccio;\nb) il valore medio dell'ampiezza di picco dell'accelerazione ottenuto da vibrazioni da urti ripetuti, cui è sottoposto il sistema mano-braccio;\nc) il valore quadratico medio massimo dell'accelerazione ponderata cui è esposto tutto il corpo, quando superi 0,5 m/s2. Se tale livello è inferiore o pari a 0,5 m/s2, deve essere indicato;\nd) l'incertezza delle misurazioni.\nI suddetti valori devono essere quelli misurati effettivamente sulla macchina o sul prodotto correlato in questione, oppure quelli stabiliti sulla base di misurazioni effettuate su una macchina o su prodotti correlati tecnicamente comparabili rappresentativi della macchina o dei prodotti correlati da produrre.\nQualora non possano essere applicate le norme armonizzate o le specifiche comuni adottate dalla Commissione conformemente all'articolo 20, paragrafo 3, le vibrazioni devono essere misurate usando il codice di misurazione più appropriato adeguato alla macchina o ai prodotti correlati interessati.\nDevono essere descritte le condizioni di funzionamento durante la misurazione e il codice di misurazione utilizzato per effettuarla.", "pages": [73, 73], "tags": ["mobilita"], "always": false, "standards": ["EN ISO 4254-1:2015 + A1:2021", "EN 474-1:2022", "EN ISO 3691-1:2015 + A1:2020", "EN 16307-1:2020"]}, {"id": "MR-III-3.6.3.2", "law": "MR", "section": "MR-III", "group": "Allegato III — 3.6. Informazioni e indicazioni", "ref": "All. III, punto 3.6.3.2", "title": "Usi molteplici", "text": "Le istruzioni per l'uso di una macchina o di un prodotto correlato che consente vari usi a seconda dell'attrezzatura impiegata e le istruzioni per l'uso delle attrezzature intercambiabili devono contenere le informazioni necessarie a consentire il montaggio e l'impiego in sicurezza della macchina o del prodotto correlato di base nonché delle attrezzature intercambiabili che possono esservi montate.", "pages": [73, 73], "tags": ["mobilita"], "always": false, "standards": ["EN ISO 4254-1:2015 + A1:2021", "EN 474-1:2022", "EN ISO 3691-1:2015 + A1:2020", "EN 16307-1:2020"]}, {"id": "MR-III-3.6.3.3", "law": "MR", "section": "MR-III", "group": "Allegato III — 3.6. Informazioni e indicazioni", "ref": "All. III, punto 3.6.3.3", "title": "Macchine o prodotti correlati mobili autonomi", "text": "Le istruzioni per l'uso di macchine o prodotti correlati mobili autonomi devono specificare le caratteristiche delle loro zone di spostamento e di lavoro nonché delle zone pericolose.", "pages": [74, 74], "tags": ["mobilita"], "always": false, "standards": ["EN ISO 4254-1:2015 + A1:2021", "EN 474-1:2022", "EN ISO 3691-1:2015 + A1:2020", "EN 16307-1:2020"]}, {"id": "MR-III-4.1.2.1", "law": "MR", "section": "MR-III", "group": "Allegato III — 4.1. Considerazioni generali", "ref": "All. III, punto 4.1.2.1", "title": "Rischi dovuti alla mancanza di stabilità", "text": "Le macchine o i prodotti correlati devono essere progettati e costruiti in modo che la stabilità prescritta al punto 1.3.1 sia mantenuta sia in servizio che fuori servizio, incluse tutte le fasi di trasporto, montaggio e smontaggio, in caso di guasti prevedibili di componenti e durante le prove effettuate in conformità delle istruzioni per l'uso. A tal fine il fabbricante deve utilizzare i metodi di verifica appropriati.", "pages": [74, 74], "tags": ["sollevamento"], "always": false, "standards": ["EN 13001-2:2021"]}, {"id": "MR-III-4.1.2.2", "law": "MR", "section": "MR-III", "group": "Allegato III — 4.1. Considerazioni generali", "ref": "All. III, punto 4.1.2.2", "title": "Macchine o prodotti correlati che si spostano lungo guide o su vie di scor", "text": "rimento Le macchine o i prodotti correlati devono essere muniti di dispositivi che agiscono sulle guide o vie di scorrimento in modo da evitare i deragliamenti.\nSe, nonostante la presenza di simili dispositivi, permane un rischio di deragliamento o di guasto di un organo di guida o di scorrimento, si devono prevedere dispositivi che impediscano la caduta di attrezzature, di componenti o del carico, nonché il ribaltamento della macchina.", "pages": [74, 74], "tags": ["sollevamento"], "always": false, "standards": ["EN 13001-3-3:2014"]}, {"id": "MR-III-4.1.2.3", "law": "MR", "section": "MR-III", "group": "Allegato III — 4.1. Considerazioni generali", "ref": "All. III, punto 4.1.2.3", "title": "Resistenza meccanica", "text": "Le macchine o i prodotti correlati, inclusi gli accessori di sollevamento e i relativi componenti, devono poter resistere alle sollecitazioni cui sono soggetti nel corso della loro intera vita, durante il funzionamento e, se del caso, anche quando sono fuori servizio, nelle condizioni di installazione e di esercizio previste e in tutte le relative configurazioni, tenendo conto eventualmente degli effetti degli agenti atmosferici e degli sforzi esercitati dalle persone. Questo requisito deve essere soddisfatto anche durante il trasporto, il montaggio e lo smontaggio.\nLe macchine o i prodotti correlati, inclusi gli accessori di sollevamento, devono essere progettati e costruiti in modo tale da evitare guasti dovuti alla fatica e all'usura tenuto conto dell'uso previsto e di qualsiasi uso scorretto ragionevolmente prevedibile.\nI materiali utilizzati devono essere scelti tenendo conto degli ambienti di esercizio previsti, soprattutto per quanto riguarda la corrosione, l'abrasione, gli urti, le temperature estreme, la fatica, la fragilità, le radiazioni e l'invecchiamento.\nLa macchina o i prodotti correlati, inclusi gli accessori di sollevamento, devono essere progettati e costruiti in modo tale da sopportare i sovraccarichi applicati nelle prove statiche senza presentare deformazioni permanenti né disfunzioni manifeste. Il calcolo della resistenza deve tenere conto del valore del coefficiente di prova statica che è scelto in modo tale da garantire un livello adeguato di sicurezza. In generale, tale coefficiente ha i valori seguenti:\na) macchine o prodotti correlati mossi dalla forza umana, inclusi accessori di sollevamento: 1,5;\nb) altre macchine o altri prodotti correlati: 1,25.\nLe macchine o i prodotti correlati devono essere progettati e costruiti in modo tale da sopportare perfettamente le prove dinamiche effettuate con il carico massimo di utilizzazione moltiplicato per il coefficiente di prova dinamica. Il coefficiente di prova dinamica è scelto in modo da garantire un livello di sicurezza adeguato; tale coefficiente è, in generale, pari a 1,1. Le prove sono generalmente eseguite alle velocità nominali previste. Qualora il circuito di comando della macchina o del prodotto correlato autorizzi più movimenti simultanei le prove devono essere effettuate nelle condizioni più sfavorevoli, in generale combinando i relativi movimenti.", "pages": [75, 75], "tags": ["sollevamento"], "always": false, "standards": ["EN 13001-1:2015", "EN 13001-2:2021", "EN 13001-3-1:2025"]}, {"id": "MR-III-4.1.2.4", "law": "MR", "section": "MR-III", "group": "Allegato III — 4.1. Considerazioni generali", "ref": "All. III, punto 4.1.2.4", "title": "Pulegge, tamburi, rulli, funi e catene", "text": "I diametri delle pulegge, dei tamburi e dei rulli devono essere compatibili con le dimensioni delle funi o delle catene di cui possono essere muniti.\nI tamburi e i rulli devono essere progettati, costruiti ed installati in modo che le funi o le catene di cui sono muniti possano avvolgersi senza lasciare lateralmente l'alloggiamento previsto.\nLe funi utilizzate direttamente per il sollevamento o il supporto del carico non devono comportare alcuna impiombatura a parte quelle alle loro estremità. Le impiombature sono tuttavia tollerate negli impianti destinati per progettazione ad essere modificati regolarmente in funzione delle esigenze di utilizzazione.\nIl coefficiente di utilizzazione dell'insieme fune e terminale deve essere scelto in modo tale da garantire un livello adeguato di sicurezza. Questo coefficiente è, in generale, pari a 5.\nIl coefficiente di utilizzazione delle catene di sollevamento deve essere scelto in modo tale da garantire un livello adeguato di sicurezza. Questo coefficiente è, in generale, pari a 4.\nAl fine di verificare che sia stato raggiunto il coefficiente di utilizzazione adeguato, il fabbricante deve effettuare, o far effettuare, prove appropriate per ciascun tipo di catena e di fune utilizzato direttamente per il sollevamento del carico e per ciascun tipo di terminale di fune.", "pages": [75, 75], "tags": ["sollevamento"], "always": false, "standards": ["EN 13001-3-2:2014", "EN 12385-4:2002+A1:2008"]}, {"id": "MR-III-4.1.2.5", "law": "MR", "section": "MR-III", "group": "Allegato III — 4.1. Considerazioni generali", "ref": "All. III, punto 4.1.2.5", "title": "Accessori di sollevamento e relativi componenti", "text": "Gli accessori di sollevamento e i relativi componenti devono essere dimensionati tenendo conto dei fenomeni di fatica e di invecchiamento per un numero di cicli di funzionamento conforme alla durata di vita prevista alle condizioni di funzionamento specificate per l'applicazione prevista.\nInoltre:\na) il coefficiente di utilizzazione degli insiemi fune metallico e terminale deve essere scelto in modo tale da garantire un livello adeguato di sicurezza; questo coefficiente è, in generale, pari a 5. Le funi non devono comportare nessun intreccio o anello diverso da quelli delle estremità;\nb) allorché sono utilizzate catene a maglie saldate, queste devono essere del tipo a maglie corte. Il coefficiente di utilizzazione delle catene deve essere scelto in modo tale da garantire un livello adeguato di sicurezza; questo coefficiente è, in generale, pari a 4;\nc) il coefficiente di utilizzazione delle funi, delle imbracature o delle cinghie di fibre tessili dipende dal materiale, dal processo di fabbricazione, dalle dimensioni e dall'utilizzazione. Questo coefficiente deve essere scelto in modo da garantire un livello di sicurezza adeguato; esso è, in generale, pari a 7, a condizione che i materiali utilizzati siano di ottima qualità controllata e che il processo di fabbricazione sia adeguato all'uso previsto. In caso contrario, il coefficiente è in generale più elevato per garantire un livello di sicurezza equivalente. Le funi, le imbracature o le cinghie di fibre tessili non devono presentare alcun nodo, impiombatura o collegamento, a parte quelli dell'estremità dell'imbracatura o della chiusura di un'imbracatura senza estremità;\nd) il coefficiente d'utilizzazione di tutti i componenti metallici di un'imbracatura o utilizzati con un'imbracatura deve essere scelto in modo da garantire un livello adeguato di sicurezza; questo coefficiente è, in generale, pari a 4;\ne) il carico massimo di utilizzazione di una braca a trefoli è stabilito tenendo conto del coefficiente di utilizzazione del trefolo più debole, del numero di trefoli e di un fattore di riduzione che dipende dal tipo di imbracatura;\nf) al fine di verificare che sia stato raggiunto il coefficiente di utilizzazione adeguato, il fabbricante deve effettuare, o far effettuare, prove appropriate per ciascun tipo di componente di cui alle lettere da a) a d).", "pages": [75, 76], "tags": ["sollevamento"], "always": false, "standards": ["EN 13155:2020+A1:2025", "EN 1677-1:2000+A1:2008"]}, {"id": "MR-III-4.1.2.6", "law": "MR", "section": "MR-III", "group": "Allegato III — 4.1. Considerazioni generali", "ref": "All. III, punto 4.1.2.6", "title": "Comando dei movimenti", "text": "I dispositivi di controllo dei movimenti devono agire in modo da mantenere in condizioni di sicurezza la macchina o il prodotto correlato su cui sono installati.\na) Le macchine o i prodotti correlati devono essere progettati, costruiti o attrezzati con dispositivi che mantengono l'ampiezza dei movimenti dei loro componenti entro i limiti previsti. L'attività di questi dispositivi deve essere preceduta eventualmente da un segnale;\nb) Se più macchine o prodotti correlati fissi o traslanti su rotaie possono compiere evoluzioni simultanee con rischio di urti, tali macchine devono essere progettate e costruite per poter essere equipaggiate di sistemi che consentano di evitare tali rischi.\nc) Le macchine o i prodotti correlati devono essere progettati e costruiti in modo che i carichi non possano derivare pericolosamente o cadere improvvisamente in caduta libera anche in caso di interruzione parziale o totale di energia o quando cessa l'azione dell'operatore.\nd) Tranne che per le macchine o i prodotti correlati il cui lavoro richieda una siffatta applicazione, nelle normali condizioni di esercizio non deve essere possibile abbassare il carico soltanto sotto il controllo di un freno a frizione.\ne) Gli organi di presa devono essere progettati e costruiti in modo da evitare la caduta improvvisa dei carichi.", "pages": [76, 76], "tags": ["sollevamento"], "always": false, "standards": ["EN 13557:2024", "EN 12077-2:2024", "EN 60204-32:2008"]}, {"id": "MR-III-4.1.2.7", "law": "MR", "section": "MR-III", "group": "Allegato III — 4.1. Considerazioni generali", "ref": "All. III, punto 4.1.2.7", "title": "Movimenti di carichi durante la movimentazione", "text": "La postazione di manovra della macchina deve essere posizionata in modo tale da assicurare la più ampia visuale possibile delle traiettorie degli elementi mobili, per evitare la possibilità di urtare persone, materiali o altre macchine che possono funzionare simultaneamente e quindi presentare un pericolo.\nLe macchine a carico guidato devono essere progettate e costruite in modo tale da prevenire lesioni alle persone dovute ai movimenti del carico, del supporto del carico o degli eventuali contrappesi.", "pages": [76, 76], "tags": ["sollevamento"], "always": false, "standards": []}, {"id": "MR-III-4.1.2.8.1", "law": "MR", "section": "MR-III", "group": "Allegato III — 4.1. Considerazioni generali", "ref": "All. III, punto 4.1.2.8.1", "title": "Movimenti del supporto del carico", "text": "Il movimento del supporto del carico delle macchine che collegano piani definiti deve essere a guida rigida verso e ai piani. Anche i sistemi a forbice sono considerati a guida rigida.", "pages": [76, 76], "tags": ["sollevamento"], "always": false, "standards": ["EN 81-31:2024", "EN 12158-1:2021"]}, {"id": "MR-III-4.1.2.8.2", "law": "MR", "section": "MR-III", "group": "Allegato III — 4.1. Considerazioni generali", "ref": "All. III, punto 4.1.2.8.2", "title": "Accesso al supporto del carico", "text": "Se al supporto del carico hanno accesso persone, la macchina deve essere progettata e costruita in modo da garantire che il supporto del carico resti immobile durante l'accesso, in particolare al momento del carico o dello scarico.\nLa macchina deve essere progettata e costruita in modo da garantire che il dislivello tra il supporto del carico e il piano servito non crei rischi di inciampo.", "pages": [77, 77], "tags": ["sollevamento"], "always": false, "standards": ["EN 81-31:2024", "EN 12158-1:2021"]}, {"id": "MR-III-4.1.2.8.3", "law": "MR", "section": "MR-III", "group": "Allegato III — 4.1. Considerazioni generali", "ref": "All. III, punto 4.1.2.8.3", "title": "Rischi dovuti al contatto con il supporto del carico in movimento", "text": "Se necessario, per soddisfare i requisiti di cui al punto 4.1.2.7, secondo comma, il percorso del supporto del carico deve essere reso inaccessibile durante il funzionamento normale.\nLaddove, durante l'ispezione o la manutenzione, vi sia il rischio che le persone situate al di sotto o al di sopra del supporto del carico siano schiacciate tra il supporto del carico e le parti fisse, deve essere lasciato spazio libero sufficiente tramite volumi di rifugio o dispositivi meccanici di blocco del movimento del supporto del carico.", "pages": [77, 77], "tags": ["sollevamento"], "always": false, "standards": ["EN 81-31:2024", "EN 12158-1:2021"]}, {"id": "MR-III-4.1.2.8.4", "law": "MR", "section": "MR-III", "group": "Allegato III — 4.1. Considerazioni generali", "ref": "All. III, punto 4.1.2.8.4", "title": "Rischio di caduta del carico dal supporto del carico", "text": "In caso di rischio di caduta del carico dal supporto del carico, la macchina deve essere progettata e costruita in modo da prevenire tale rischio.", "pages": [77, 77], "tags": ["sollevamento"], "always": false, "standards": ["EN 81-31:2024", "EN 12158-1:2021"]}, {"id": "MR-III-4.1.2.8.5", "law": "MR", "section": "MR-III", "group": "Allegato III — 4.1. Considerazioni generali", "ref": "All. III, punto 4.1.2.8.5", "title": "Piani", "text": "Devono essere prevenuti i rischi dovuti al contatto delle persone ai piani con il supporto del carico in movimento o altri elementi mobili.\nIn caso di rischio di caduta di persone nel percorso del supporto del carico quando quest'ultimo non è presente ai piani, devono essere installati ripari per prevenire tale rischio. Detti ripari non devono aprirsi in direzione del percorso del supporto del carico. Devono essere montati con un dispositivo di interblocco controllato dalla posizione del supporto del carico che impedisce:\na) movimenti pericolosi del supporto del carico finché i ripari non sono chiusi e bloccati;\nb) l'apertura pericolosa di un riparo finché il supporto del carico non si sia arrestato al piano corrispondente.", "pages": [77, 77], "tags": ["sollevamento"], "always": false, "standards": ["EN 81-31:2024", "EN 12158-1:2021"]}, {"id": "MR-III-4.1.3", "law": "MR", "section": "MR-III", "group": "Allegato III — 4.1. Considerazioni generali", "ref": "All. III, punto 4.1.3", "title": "Idoneità all'impiego", "text": "Il fabbricante si accerta, all'atto dell'immissione sul mercato o della prima messa in servizio delle macchine di sollevamento o dei prodotti correlati, inclusi gli accessori di sollevamento, con adeguate misure che egli adotta o fa adottare, che le macchine di sollevamento o i prodotti correlati, inclusi gli accessori di sollevamento, pronti ad essere utilizzati, a operazione manuale o a operazione motorizzata, possano svolgere le funzioni previste in condizioni di sicurezza.\nLe prove statiche e dinamiche di cui al punto 4.1.2.3 devono essere eseguite su tutte le macchine di sollevamento o prodotti correlati pronti per essere messi in servizio.\nSe le macchine o i prodotti correlati non possono essere montati nei locali del fabbricante le misure appropriate devono essere adottate sul luogo dell'utilizzazione dal fabbricante. In caso contrario, esse possono essere adottate tanto nei locali del fabbricante quanto sul luogo dell'utilizzazione.", "pages": [77, 77], "tags": ["sollevamento"], "always": false, "standards": ["EN 15011:2020", "EN 14492-1:2006+A1:2009", "EN 14492-2:2006+A1:2009", "EN 13000:2010+A1:2014"]}, {"id": "MR-III-4.2.1", "law": "MR", "section": "MR-III", "group": "Allegato III — 4.2. Requisiti per le macchine o i prodotti correlati mossi da energia diversa da quella umana", "ref": "All. III, punto 4.2.1", "title": "Comando dei movimenti", "text": "Devono essere utilizzati dispositivi di comando ad azione mantenuta per il comando della macchina o dei prodotti correlati o delle loro attrezzature. Tuttavia, per i movimenti, parziali o totali, per i quali non si corre il rischio di urto da parte del carico o della macchina o del prodotto correlato, si possono sostituire detti comandi con dispositivi di comando che consentono movimenti con arresti automatici a posizioni preselezionate senza dover mantenere l'azionamento da parte dell'operatore.", "pages": [77, 77], "tags": ["sollevamento"], "always": false, "standards": ["EN 13557:2024", "EN 60204-32:2008"]}, {"id": "MR-III-4.2.2", "law": "MR", "section": "MR-III", "group": "Allegato III — 4.2. Requisiti per le macchine o i prodotti correlati mossi da energia diversa da quella umana", "ref": "All. III, punto 4.2.2", "title": "Controllo delle sollecitazioni", "text": "Le macchine o i prodotti correlati con un carico massimo di utilizzazione pari almeno a 1 000 kg o il cui momento di rovesciamento è pari almeno a 40 000 Nm devono essere dotati di dispositivi che avvertano il conducente e impediscano i movimenti pericolosi in caso:\na) di sovraccarico sia per eccesso di carico massimo di utilizzazione, sia per superamento del momento massimo di utilizzazione dovuto a tale carico; o\nb) di superamento del momento di rovesciamento.", "pages": [78, 78], "tags": ["sollevamento"], "always": false, "standards": ["EN 12077-2:2024"]}, {"id": "MR-III-4.2.3", "law": "MR", "section": "MR-III", "group": "Allegato III — 4.2. Requisiti per le macchine o i prodotti correlati mossi da energia diversa da quella umana", "ref": "All. III, punto 4.2.3", "title": "Impianti guidati da funi", "text": "Le funi portanti, traenti o portanti e traenti devono essere tese da contrappesi o da un dispositivo che consente di controllare in permanenza la tensione.", "pages": [78, 78], "tags": ["sollevamento"], "always": false, "standards": []}, {"id": "MR-III-4.3.1", "law": "MR", "section": "MR-III", "group": "Allegato III — 4.3. Informazioni e marcatura", "ref": "All. III, punto 4.3.1", "title": "Catene, funi e cinghie", "text": "Ogni lunghezza di catena, fune o cinghia di sollevamento che non faccia parte di un insieme deve recare una marcatura o, se ciò non è possibile, una targa o un anello inamovibile con i riferimenti del fabbricante e l'identificazione della relativa attestazione.\nL'attestazione sopra menzionata deve contenere almeno le indicazioni seguenti:\na) il nome e indirizzo del fabbricante;\nb) la descrizione della catena o della fune comprendente:\ni) le dimensioni nominali;\nii) la costruzione;\niii) il materiale di fabbricazione; e\niv) qualsiasi trattamento metallurgico speciale subito dal materiale;\nc) il metodo di prova impiegato;\nd) il carico massimo che deve essere sopportato, durante il funzionamento, dalla catena o dalla fune. Una forcella di valori può essere indicata in funzione delle applicazioni previste.", "pages": [78, 78], "tags": ["sollevamento"], "always": false, "standards": ["EN 818-2:1996+A1:2008", "EN 818-4:1996+A1:2008", "EN 1492-1:2000+A1:2008", "EN 1492-2:2000+A1:2008"]}, {"id": "MR-III-4.3.2", "law": "MR", "section": "MR-III", "group": "Allegato III — 4.3. Informazioni e marcatura", "ref": "All. III, punto 4.3.2", "title": "Accessori di sollevamento", "text": "Gli accessori di sollevamento devono recare le indicazioni seguenti:\na) l’identificazione del materiale, qualora tale informazione sia necessaria per la sicurezza di utilizzo;\nb) il carico di utilizzazione massimo.\nPer gli accessori di sollevamento sui quali la marcatura è materialmente impossibile, le indicazioni di cui al primo comma devono essere riportate su una targa o un altro mezzo equivalente fissato saldamente all'accessorio.\nLe indicazioni devono essere leggibili e situate in un punto in cui non rischino di scomparire per effetto dell'usura né di compromettere la resistenza dell'accessorio.", "pages": [78, 78], "tags": ["sollevamento"], "always": false, "standards": ["EN 13155:2020+A1:2025", "EN 1677-1:2000+A1:2008", "EN 818-4:1996+A1:2008", "EN 1492-1:2000+A1:2008"]}, {"id": "MR-III-4.3.3", "law": "MR", "section": "MR-III", "group": "Allegato III — 4.3. Informazioni e marcatura", "ref": "All. III, punto 4.3.3", "title": "Macchine di sollevamento o prodotti correlati", "text": "Il carico massimo di utilizzazione deve essere marcato in modo ben visibile sulla macchina di sollevamento o sul prodotto correlato. Questa marcatura deve essere leggibile, indelebile e chiara.\nSe il carico massimo di utilizzazione dipende dalla configurazione della macchina di sollevamento o del prodotto correlato, ogni postazione di lavoro deve essere munita di una targa dei carichi che indichi sotto forma di tabelle o di diagrammi i carichi di utilizzazione consentiti per ogni singola configurazione.\nLe macchine o i prodotti correlati destinati al sollevamento di sole cose, munite di un supporto del carico accessibile alle persone, devono recare un'avvertenza chiara ed indelebile che vieti il sollevamento di persone. Tale avvertenza deve essere visibile da ciascun posto da cui è possibile l'accesso.", "pages": [78, 79], "tags": ["sollevamento"], "always": false, "standards": ["EN 15011:2020", "EN 14492-1:2006+A1:2009", "EN 14492-2:2006+A1:2009"]}, {"id": "MR-III-4.4.1", "law": "MR", "section": "MR-III", "group": "Allegato III — 4.4. Istruzioni per l'uso", "ref": "All. III, punto 4.4.1", "title": "Accessori di sollevamento", "text": "Ogni accessorio di sollevamento, o ciascuna partita di accessori di sollevamento commercialmente indivisibile, deve essere accompagnato da istruzioni che forniscano almeno le indicazioni seguenti:\na) l'uso previsto;\nb) i limiti di utilizzazione (in particolare per gli accessori di sollevamento quali ventose magnetiche o a vuoto che non soddisfano pienamente le disposizioni di cui al punto 4.1.2.6, lettera e));\nc) le istruzioni per il montaggio, l'uso e la manutenzione;\nd) il coefficiente di prova statica utilizzato.", "pages": [79, 79], "tags": ["sollevamento"], "always": false, "standards": ["EN 13155:2020+A1:2025", "EN 818-4:1996+A1:2008", "EN 1492-1:2000+A1:2008", "EN 1492-2:2000+A1:2008"]}, {"id": "MR-III-4.4.2", "law": "MR", "section": "MR-III", "group": "Allegato III — 4.4. Istruzioni per l'uso", "ref": "All. III, punto 4.4.2", "title": "Macchine di sollevamento o prodotti correlati", "text": "Le macchine di sollevamento o i prodotti correlati devono essere accompagnati da istruzioni per l'uso che forniscano le informazioni seguenti:\na) le caratteristiche tecniche della macchina di sollevamento o del prodotto correlato, in particolare:\ni) il carico massimo di utilizzazione ed eventualmente un richiamo alla targa dei carichi o alla tabella dei carichi di cui al punto 4.3.3, secondo comma;\nii) le reazioni sugli appoggi o sugli incastri e, se del caso, le caratteristiche delle guide;\niii) se del caso, la definizione ed i mezzi di installazione delle zavorre;\nb) il contenuto del registro di controllo della macchina di sollevamento, se non è fornito insieme a quest'ultima;\nc) le raccomandazioni per l'uso, in particolare per ovviare alle insufficienze della visione diretta del carico da parte dell'operatore;\nd) se del caso, una relazione di prova che descriva dettagliatamente le prove statiche e dinamiche effettuate dal fabbricante, o per suo conto;\ne) per le macchine di sollevamento o i prodotti correlati che non sono montati presso il fabbricante nella loro configurazione di utilizzazione, le istruzioni necessarie per attuare le disposizioni di cui al punto 4.1.3 prima della loro prima messa in servizio.", "pages": [79, 79], "tags": ["sollevamento"], "always": false, "standards": ["EN 15011:2020", "EN 14492-1:2006+A1:2009", "EN 14492-2:2006+A1:2009", "EN 13000:2010+A1:2014"]}, {"id": "MR-III-5.1", "law": "MR", "section": "MR-III", "group": "Allegato III — 5. REQUISITI ESSENZIALI SUPPLEMENTARI DI SICUREZZA E DI TUTELA DELLA SALUTE PER LE MACCHINE O I PRODOTTI CORRELATI DESTINATI AD ESSERE UTILIZZATI IN LAVORI SOTTERRANEI", "ref": "All. III, punto 5.1", "title": "Rischi dovuti alla mancanza di stabilità", "text": "Le armature semoventi devono essere progettate e costruite in modo da permettere un adeguato orientamento, quando vengono spostate, e non devono ribaltarsi prima e durante la messa sotto pressione e dopo la decompressione. Devono disporre di ancoraggi per la piastra di testa dei raccordi idraulici individuali.", "pages": [79, 79], "tags": ["sotterraneo"], "always": false, "standards": ["EN ISO 19296:2018", "EN 16191:2014", "EN 1804-1:2020"]}, {"id": "MR-III-5.2", "law": "MR", "section": "MR-III", "group": "Allegato III — 5. REQUISITI ESSENZIALI SUPPLEMENTARI DI SICUREZZA E DI TUTELA DELLA SALUTE PER LE MACCHINE O I PRODOTTI CORRELATI DESTINATI AD ESSERE UTILIZZATI IN LAVORI SOTTERRANEI", "ref": "All. III, punto 5.2", "title": "Circolazione", "text": "Le armature semoventi devono permettere alle persone di circolare senza intralci.", "pages": [79, 79], "tags": ["sotterraneo"], "always": false, "standards": ["EN ISO 19296:2018", "EN 16191:2014"]}, {"id": "MR-III-5.3", "law": "MR", "section": "MR-III", "group": "Allegato III — 5. REQUISITI ESSENZIALI SUPPLEMENTARI DI SICUREZZA E DI TUTELA DELLA SALUTE PER LE MACCHINE O I PRODOTTI CORRELATI DESTINATI AD ESSERE UTILIZZATI IN LAVORI SOTTERRANEI", "ref": "All. III, punto 5.3", "title": "Dispositivi di comando", "text": "I dispositivi di comando dell'acceleratore e dei freni che consentono di spostare le macchine che scorrono su rotaia devono essere azionati a mano. Tuttavia i dispositivi di consenso possono essere a pedale.\nI dispositivi di comando delle armature semoventi devono essere progettati, costruiti e disposti in modo da permettere che, durante l'operazione di avanzamento, gli operatori siano protetti da un'armatura fissa. I dispositivi di comando devono essere protetti da qualsiasi azionamento involontario.", "pages": [79, 80], "tags": ["sotterraneo"], "always": false, "standards": ["EN ISO 19296:2018", "EN 16191:2014", "EN 1804-3:2020"]}, {"id": "MR-III-5.4", "law": "MR", "section": "MR-III", "group": "Allegato III — 5. REQUISITI ESSENZIALI SUPPLEMENTARI DI SICUREZZA E DI TUTELA DELLA SALUTE PER LE MACCHINE O I PRODOTTI CORRELATI DESTINATI AD ESSERE UTILIZZATI IN LAVORI SOTTERRANEI", "ref": "All. III, punto 5.4", "title": "Arresto dello spostamento", "text": "Le locomotive destinate ad essere impiegate nei lavori sotterranei devono essere munite di un dispositivo di consenso che agisca sul circuito di comando dello spostamento della macchina di modo che si arresti, se il conducente non è più in grado di comandarlo.", "pages": [80, 80], "tags": ["sotterraneo"], "always": false, "standards": ["EN ISO 19296:2018", "EN 16191:2014"]}, {"id": "MR-III-5.5", "law": "MR", "section": "MR-III", "group": "Allegato III — 5. REQUISITI ESSENZIALI SUPPLEMENTARI DI SICUREZZA E DI TUTELA DELLA SALUTE PER LE MACCHINE O I PRODOTTI CORRELATI DESTINATI AD ESSERE UTILIZZATI IN LAVORI SOTTERRANEI", "ref": "All. III, punto 5.5", "title": "Incendio", "text": "La lettera b) del punto 3.5.2 è obbligatoria per le macchine o i prodotti correlati comprendenti parti ad alto rischio di infiammabilità.\nIl sistema di frenatura delle macchine o dei prodotti correlati destinati ad essere impiegati nei lavori sotterranei deve essere progettato e costruito in modo da non produrre scintille o essere causa di incendio.\nLe macchine o i prodotti correlati a motore a combustione interna destinati ad essere impiegati in lavori sotterranei devono essere dotati esclusivamente di motore che utilizzi un combustibile a bassa tensione di vapore che escluda qualsiasi scintilla di origine elettrica.", "pages": [80, 80], "tags": ["sotterraneo"], "always": false, "standards": ["EN ISO 19296:2018", "EN 16191:2014"]}, {"id": "MR-III-5.6", "law": "MR", "section": "MR-III", "group": "Allegato III — 5. REQUISITI ESSENZIALI SUPPLEMENTARI DI SICUREZZA E DI TUTELA DELLA SALUTE PER LE MACCHINE O I PRODOTTI CORRELATI DESTINATI AD ESSERE UTILIZZATI IN LAVORI SOTTERRANEI", "ref": "All. III, punto 5.6", "title": "Emissioni di gas di scarico", "text": "I gas di scarico emessi da motori a combustione interna non devono essere evacuati verso l'alto.", "pages": [80, 80], "tags": ["sotterraneo"], "always": false, "standards": ["EN ISO 19296:2018", "EN 16191:2014"]}, {"id": "MR-III-6.1.1", "law": "MR", "section": "MR-III", "group": "Allegato III — 6.1. Considerazioni generali", "ref": "All. III, punto 6.1.1", "title": "Resistenza meccanica", "text": "Il supporto del carico, incluse eventuali botole, deve essere progettato e costruito in modo da offrire lo spazio e la resistenza corrispondenti al numero massimo di persone consentito nel supporto del carico e al carico massimo di utilizzazione.\nI coefficienti di utilizzazione dei componenti di cui ai punti 4.1.2.4 e 4.1.2.5 non sono sufficienti per le macchine o i prodotti correlati destinati al sollevamento di persone e devono, come regola generale, essere raddoppiati. Le macchine o i prodotti correlati destinati al sollevamento di persone o di persone e cose devono essere muniti di un sistema di sospensione o di sostegno del supporto del carico, progettato e costruito in modo tale da garantire un adeguato livello globale di sicurezza e di evitare il rischio di caduta del supporto del carico.\nSe per sospendere il supporto del carico sono utilizzate funi o catene, come regola generale sono richieste almeno due funi o catene indipendenti, ciascuna con il proprio ancoraggio.", "pages": [80, 80], "tags": ["sollevamento_persone"], "always": false, "standards": ["EN 280-1:2022", "EN 1808:2015", "EN 81-41:2024", "EN 12159:2024"]}, {"id": "MR-III-6.1.2", "law": "MR", "section": "MR-III", "group": "Allegato III — 6.1. Considerazioni generali", "ref": "All. III, punto 6.1.2", "title": "Controllo delle sollecitazioni per le macchine o i prodotti correlati mossi da una forza diversa dalla forza umana", "text": "I requisiti di cui al punto 4.2.2 si applicano a prescindere dal carico massimo di utilizzazione e dal momento di rovesciamento, a meno che il fabbricante possa dimostrare che non vi sono rischi di sovraccarico o di rovesciamento.", "pages": [80, 80], "tags": ["sollevamento_persone"], "always": false, "standards": ["EN 280-1:2022", "EN 1808:2015", "EN 81-41:2024", "EN 12159:2024"]}, {"id": "MR-III-6.2", "law": "MR", "section": "MR-III", "group": "Allegato III — 6. REQUISITI ESSENZIALI SUPPLEMENTARI DI SICUREZZA E DI TUTELA DELLA SALUTE PER LE MACCHINE O I PRODOTTI CORRELATI CHE PRESENTANO PERICOLI PARTICOLARI DOVUTI AL SOLLEVAMENTO DI PERSONE", "ref": "All. III, punto 6.2", "title": "Dispositivi di comando", "text": "Se i requisiti di sicurezza non impongono altre soluzioni, come regola generale il supporto del carico deve essere progettato e costruito in modo che le persone che vi si trovano dispongano di dispositivi di comando dei movimenti di salita e discesa e, se del caso, di altri movimenti del supporto del carico.\nTali dispositivi di comando devono avere la precedenza sugli altri dispositivi di comando dello stesso movimento salvo sui dispositivi di arresto di emergenza.\nI dispositivi di comando per i movimenti di cui al primo comma devono essere del tipo ad azione mantenuta, tranne quando il supporto del carico è completamente chiuso. Se non vi è alcun rischio per le persone o le cose che si trovano sul supporto del carico in caso di urto o caduta e se non vi è alcun rischio dovuto a movimenti verso l'alto e verso il basso del supporto del carico, si possono utilizzare dispositivi di comando che consentono movimenti con arresti automatici a posizioni preselezionate, anziché dispositivi di comando di tipo ad azione mantenuta.", "pages": [80, 81], "tags": ["sollevamento_persone"], "always": false, "standards": ["EN 280-1:2022", "EN 1808:2015", "EN 81-41:2024", "EN 12159:2024"]}, {"id": "MR-III-6.3.1", "law": "MR", "section": "MR-III", "group": "Allegato III — 6.3. Rischi per le persone che si trovano nel supporto del carico o sopra di esso", "ref": "All. III, punto 6.3.1", "title": "Rischi dovuti ai movimenti del supporto del carico", "text": "Le macchine o i prodotti correlati per il sollevamento di persone devono essere progettati, costruiti e attrezzati in modo tale che le accelerazioni o le decelerazioni del supporto del carico non generino rischi per le persone.", "pages": [81, 81], "tags": ["sollevamento_persone"], "always": false, "standards": ["EN 280-1:2022", "EN 1808:2015", "EN 81-41:2024", "EN 12159:2024"]}, {"id": "MR-III-6.3.2", "law": "MR", "section": "MR-III", "group": "Allegato III — 6.3. Rischi per le persone che si trovano nel supporto del carico o sopra di esso", "ref": "All. III, punto 6.3.2", "title": "Rischio di caduta delle persone dal supporto del carico", "text": "Il supporto del carico non deve inclinarsi tanto da comportare un rischio di caduta per i suoi occupanti, anche durante i movimenti della macchina o del prodotto correlato e del supporto del carico.\nSe il supporto del carico è progettato per fungere da postazione di lavoro, devono essere adottate disposizioni per garantirne la stabilità e impedire movimenti pericolosi.\nSe le misure di cui al punto 1.5.15 non sono sufficienti, i supporti del carico devono essere muniti di ancoraggi appropriati in numero adeguato al numero di persone consentito nel supporto del carico. I punti di ancoraggio devono essere sufficientemente resistenti per l'uso di attrezzature per la protezione individuale contro le cadute dall'alto.\nEventuali botole nel pavimento o nel soffitto o portelli laterali devono essere progettati e costruiti in modo da impedire l'apertura involontaria e devono aprirsi in senso contrario al rischio di caduta in caso di apertura inopinata.", "pages": [81, 81], "tags": ["sollevamento_persone"], "always": false, "standards": ["EN 280-1:2022", "EN 1808:2015", "EN 81-41:2024", "EN 12159:2024"]}, {"id": "MR-III-6.3.3", "law": "MR", "section": "MR-III", "group": "Allegato III — 6.3. Rischi per le persone che si trovano nel supporto del carico o sopra di esso", "ref": "All. III, punto 6.3.3", "title": "Rischio dovuto alla caduta di oggetti sul supporto del carico", "text": "In caso di rischio di caduta di oggetti sul supporto del carico con conseguente pericolo per le persone, il supporto del carico deve essere munito di una copertura di protezione.", "pages": [81, 81], "tags": ["sollevamento_persone"], "always": false, "standards": ["EN 280-1:2022", "EN 1808:2015", "EN 81-41:2024", "EN 12159:2024"]}, {"id": "MR-III-6.4.1", "law": "MR", "section": "MR-III", "group": "Allegato III — 6.4. Macchine o prodotti correlati che collegano piani definiti", "ref": "All. III, punto 6.4.1", "title": "Rischi per le persone che si trovano nel supporto del carico o sopra di esso", "text": "Il supporto del carico deve essere progettato e costruito in modo da prevenire i rischi dovuti al contatto tra le persone e/o le cose, che si trovano nel supporto del carico o sopra di esso, con elementi fissi o mobili. Se necessario, per soddisfare questo requisito, il supporto del carico stesso deve essere completamente chiuso e con porte munite di un dispositivo di interblocco che impedisca movimenti pericolosi del supporto del carico, se le porte non sono chiuse. Le porte devono restare chiuse se il supporto del carico si arresta tra i piani, qualora vi sia il rischio di caduta dal supporto del carico.\nLa macchina o i prodotti correlati devono essere progettati, costruiti e, se necessario, muniti di dispositivi in modo da impedire movimenti incontrollati in salita o in discesa del supporto del carico. Tali dispositivi devono essere in grado di arrestare il supporto del carico in condizioni di carico di utilizzazione massimo e di velocità massima prevedibile.\nL'azione di arresto non deve causare decelerazioni dannose per gli occupanti, in qualsiasi condizione di carico.", "pages": [81, 81], "tags": ["sollevamento_persone"], "always": false, "standards": ["EN 280-1:2022", "EN 1808:2015", "EN 81-41:2024", "EN 12159:2024"]}, {"id": "MR-III-6.4.2", "law": "MR", "section": "MR-III", "group": "Allegato III — 6.4. Macchine o prodotti correlati che collegano piani definiti", "ref": "All. III, punto 6.4.2", "title": "Comandi ai piani", "text": "I comandi ai piani, ad eccezione di quelli di emergenza, non devono avviare movimenti del supporto del carico quando:\na) i dispositivi di comando nel supporto del carico sono azionati;\nb) il supporto del carico non si trova a un piano.", "pages": [81, 81], "tags": ["sollevamento_persone"], "always": false, "standards": ["EN 280-1:2022", "EN 1808:2015", "EN 81-41:2024", "EN 12159:2024"]}, {"id": "MR-III-6.4.3", "law": "MR", "section": "MR-III", "group": "Allegato III — 6.4. Macchine o prodotti correlati che collegano piani definiti", "ref": "All. III, punto 6.4.3", "title": "Accesso al supporto del carico", "text": "I ripari ai piani e sul supporto del carico devono essere progettati e costruiti in modo da garantire il trasferimento in condizioni di sicurezza verso il supporto del carico e viceversa, tenuto conto della gamma prevedibile di cose e persone da sollevare.", "pages": [82, 82], "tags": ["sollevamento_persone"], "always": false, "standards": ["EN 280-1:2022", "EN 1808:2015", "EN 81-41:2024", "EN 12159:2024"]}, {"id": "MR-III-6.5", "law": "MR", "section": "MR-III", "group": "Allegato III — 6. REQUISITI ESSENZIALI SUPPLEMENTARI DI SICUREZZA E DI TUTELA DELLA SALUTE PER LE MACCHINE O I PRODOTTI CORRELATI CHE PRESENTANO PERICOLI PARTICOLARI DOVUTI AL SOLLEVAMENTO DI PERSONE", "ref": "All. III, punto 6.5", "title": "Marcature", "text": "Nel supporto del carico devono figurare le informazioni necessarie per garantire la sicurezza, inclusi:\na) il numero di persone consentito nel supporto del carico;\nb) il carico di utilizzazione massimo.", "pages": [82, 82], "tags": ["sollevamento_persone"], "always": false, "standards": ["EN 280-1:2022", "EN 1808:2015", "EN 81-41:2024", "EN 12159:2024"]}, {"id": "MR-ART10-1", "law": "MR", "section": "MR-OBB", "group": "Art. 10 — Obblighi dei fabbricanti di macchine e di prodotti correlati", "ref": "Art. 10, par. 1", "title": "Obblighi dei fabbricanti di macchine e di prodotti correlati", "text": "All'atto dell'immissione sul mercato o della messa in servizio di una macchina o di un prodotto correlato, i fabbricanti garantiscono che siano stati progettati e fabbricati conformemente ai requisiti essenziali di sicurezza e di tutela della salute di cui all'allegato III.", "pages": [18, 18], "tags": ["macchina"], "always": false, "standards": []}, {"id": "MR-ART10-2", "law": "MR", "section": "MR-OBB", "group": "Art. 10 — Obblighi dei fabbricanti di macchine e di prodotti correlati", "ref": "Art. 10, par. 2", "title": "Obblighi dei fabbricanti di macchine e di prodotti correlati", "text": "Prima dell'immissione sul mercato o della messa in servizio di una macchina o di un prodotto correlato, i fabbricanti redigono la documentazione tecnica di cui all'allegato IV, parte A, ed eseguono o fanno eseguire la pertinente procedura di valutazione della conformità di cui all'articolo 25.\nSe la conformità della macchina o di un prodotto correlato rispetto ai requisiti essenziali di sicurezza e di tutela della salute di cui all'allegato III è stata dimostrata da tale procedura di valutazione della conformità, i fabbricanti redigono la dichiarazione di conformità UE conformemente all'articolo 21 e appongono la marcatura CE conformemente all' articolo 24.", "pages": [18, 18], "tags": ["macchina"], "always": false, "standards": []}, {"id": "MR-ART10-3", "law": "MR", "section": "MR-OBB", "group": "Art. 10 — Obblighi dei fabbricanti di macchine e di prodotti correlati", "ref": "Art. 10, par. 3", "title": "Obblighi dei fabbricanti di macchine e di prodotti correlati", "text": "I fabbricanti mantengono la documentazione tecnica e la dichiarazione di conformità UE a disposizione delle autorità di vigilanza del mercato per un periodo di almeno 10 anni dalla data di immissione sul mercato o dalla messa in servizio della macchina o del prodotto correlato. Se pertinente, il codice sorgente o la logica di programmazione integrati nella documentazione tecnica, su richiesta motivata da parte delle autorità nazionali competenti, sono messi a disposizione di tali autorità a condizione che tale codice sorgente o logica di programmazione siano necessari affinché esse siano in grado di verificare il rispetto dei requisiti essenziali di sicurezza e di tutela della salute di cui all'allegato III.", "pages": [18, 18], "tags": ["macchina"], "always": false, "standards": []}, {"id": "MR-ART10-4", "law": "MR", "section": "MR-OBB", "group": "Art. 10 — Obblighi dei fabbricanti di macchine e di prodotti correlati", "ref": "Art. 10, par. 4", "title": "Obblighi dei fabbricanti di macchine e di prodotti correlati", "text": "I fabbricanti garantiscono che siano predisposte le procedure necessarie affinché le macchine o i prodotti correlati fabbricati nell'ambito di una produzione in serie rimangano conformi al presente regolamento. Le modifiche del processo produttivo o della progettazione o delle caratteristiche delle macchine o dei prodotti correlati, nonché le modifiche delle norme armonizzate, di altre specifiche tecniche o delle specifiche comuni di cui all'articolo 20 con riferimento alle quali è dichiarata la conformità delle macchine o dei prodotti correlati devono essere tenute debitamente in considerazione.\nLaddove ritenuto necessario in considerazione dei rischi presentati dalle macchine o dai prodotti correlati, al fine di proteggere la salute e la sicurezza degli utilizzatori, i fabbricanti effettuano una prova a campione delle macchine o dei prodotti correlati messi a disposizione sul mercato e ne esaminano i risultati. Se del caso, i fabbricanti mantengono un registro dei reclami, delle macchine o dei prodotti correlati non conformi e dei richiami di macchine e di prodotti correlati, e informano i distributori di tale monitoraggio.", "pages": [19, 19], "tags": ["macchina"], "always": false, "standards": []}, {"id": "MR-ART10-5", "law": "MR", "section": "MR-OBB", "group": "Art. 10 — Obblighi dei fabbricanti di macchine e di prodotti correlati", "ref": "Art. 10, par. 5", "title": "Obblighi dei fabbricanti di macchine e di prodotti correlati", "text": "I fabbricanti garantiscono che sulle macchine o sui prodotti correlati da loro immessi sul mercato o messi in servizio siano apposti almeno una designazione del modello della macchina o del prodotto correlato, della serie o del tipo, l'anno di costruzione, vale a dire l'anno in cui il processo di fabbricazione si è concluso, nonché, eventualmente, un numero di lotto o di serie oppure qualsiasi altro elemento che ne consenta l'identificazione, oppure, qualora le dimensioni o la natura della macchina o del prodotto correlato non lo consentano, garantiscono che le informazioni prescritte siano fornite sull'imballaggio o in un documento di accompagnamento della macchina o del prodotto correlato.", "pages": [19, 19], "tags": ["macchina"], "always": false, "standards": []}, {"id": "MR-ART10-6", "law": "MR", "section": "MR-OBB", "group": "Art. 10 — Obblighi dei fabbricanti di macchine e di prodotti correlati", "ref": "Art. 10, par. 6", "title": "Obblighi dei fabbricanti di macchine e di prodotti correlati", "text": "I fabbricanti indicano il proprio nome, la propria denominazione commerciale registrata o il proprio marchio registrato, nonché l'indirizzo postale e il sito internet, l'indirizzo di posta elettronica o altri contatti digitali ai quali possono essere contattati sulla macchina o sul prodotto correlato oppure, ove ciò non sia possibile, sull'imballaggio o in un documento di accompagnamento della macchina o del prodotto correlato. L'indirizzo indica un unico recapito presso il quale il fabbricante può essere contattato. Le informazioni relative al contatto sono in una lingua facilmente comprensibile dagli utilizzatori e le autorità di vigilanza del mercato.", "pages": [19, 19], "tags": ["macchina"], "always": false, "standards": []}, {"id": "MR-ART10-7", "law": "MR", "section": "MR-OBB", "group": "Art. 10 — Obblighi dei fabbricanti di macchine e di prodotti correlati", "ref": "Art. 10, par. 7", "title": "Obblighi dei fabbricanti di macchine e di prodotti correlati", "text": "I fabbricanti garantiscono che le macchine o i prodotti correlati siano accompagnati dalle istruzioni per l’uso e dalle informazioni di cui all’allegato III. Le istruzioni possono essere fornite in formato digitale. Tali istruzioni e informazioni descrivono chiaramente il modello di prodotto al quale corrispondono.\nQuando le istruzioni per l’uso sono fornite in formato digitale, il fabbricante deve:\na) indicare sulla macchina o sul prodotto correlato, oppure, ove ciò non sia possibile, sull’imballaggio o in un documento di accompagnamento, le modalità di accesso alle istruzioni in formato digitale;\nb) presentare le istruzioni per l’uso in un formato che consenta all’utilizzatore di stamparle e scaricarle, nonché di salvarle su un dispositivo elettronico in maniera da potervi accedere in qualsiasi momento, in particolare in caso di avaria della macchina o del prodotto correlato; tale requisito si applica anche quando le istruzioni per l’uso sono integrate nel software della macchina o del prodotto correlato;\nc) renderle accessibili online durante il ciclo di vita previsto della macchina o del prodotto correlato e per un periodo di almeno 10 anni dopo l’immissione sul mercato della macchina o del prodotto correlato.\nTuttavia, su richiesta dell’utilizzatore al momento dell’acquisto, il fabbricante fornisce gratuitamente le istruzioni per l’uso in formato cartaceo entro un mese.\nNel caso di una macchina o di un prodotto correlato destinati a utilizzatori non professionali o che possono, in condizioni ragionevolmente prevedibili, essere utilizzati da utilizzatori non professionali, anche se non ad essi destinati, il fabbricante fornisce, in formato cartaceo, le informazioni sulla sicurezza essenziali per mettere in servizio la macchina o il prodotto correlato e per utilizzarli in modo sicuro.\nLe istruzioni per l’uso, le informazioni sulla sicurezza e le informazioni di cui all'allegato III sono redatte in una lingua facilmente comprensibile dagli utilizzatori, secondo quanto stabilito dallo Stato membro interessato, e sono chiare, comprensibili e leggibili.", "pages": [19, 19], "tags": ["macchina"], "always": false, "standards": []}, {"id": "MR-ART10-8", "law": "MR", "section": "MR-OBB", "group": "Art. 10 — Obblighi dei fabbricanti di macchine e di prodotti correlati", "ref": "Art. 10, par. 8", "title": "Obblighi dei fabbricanti di macchine e di prodotti correlati", "text": "I fabbricanti garantiscono che la macchina o il prodotto correlato siano accompagnati dalla dichiarazione di conformità UE di cui all'allegato V, parte A, o, in alternativa, i fabbricanti forniscono l'indirizzo internet o codici a lettura ottica dove è possibile accedere a tale dichiarazione di conformità UE nelle istruzioni per l'uso e nelle informazioni di cui all'allegato III.\nLe dichiarazioni di conformità UE digitali sono rese accessibili online per il ciclo di vita previsto della macchina o del prodotto correlato e, in ogni caso, per un periodo di almeno 10 anni dopo l'immissione sul mercato o la messa in servizio della macchina o del prodotto correlato.", "pages": [19, 19], "tags": ["macchina"], "always": false, "standards": []}, {"id": "MR-ART10-9", "law": "MR", "section": "MR-OBB", "group": "Art. 10 — Obblighi dei fabbricanti di macchine e di prodotti correlati", "ref": "Art. 10, par. 9", "title": "Obblighi dei fabbricanti di macchine e di prodotti correlati", "text": "I fabbricanti che ritengono o hanno motivo di ritenere che una macchina o un prodotto correlato da essi immesso sul mercato o messo in servizio non sia conforme al presente regolamento adottano immediatamente le azioni correttive necessarie per rendere conforme tale macchina o prodotto correlato, ritirarli o richiamarli, a seconda dei casi. Inoltre, se la macchina o il prodotto correlato presentano un rischio per la salute e la sicurezza delle persone nonché, all’occorrenza, degli animali domestici e per la tutela dei beni e, se del caso, dell'ambiente, i fabbricanti ne informano immediatamente le autorità nazionali competenti degli Stati membri in cui hanno messo a disposizione la macchina o il prodotto correlato sul mercato o li hanno messi in servizio, dando in particolare informazioni dettagliate sulla non conformità e su eventuali azioni correttive adottate.", "pages": [20, 20], "tags": ["macchina"], "always": false, "standards": []}, {"id": "MR-ART10-10", "law": "MR", "section": "MR-OBB", "group": "Art. 10 — Obblighi dei fabbricanti di macchine e di prodotti correlati", "ref": "Art. 10, par. 10", "title": "Obblighi dei fabbricanti di macchine e di prodotti correlati", "text": "A seguito di una richiesta motivata da parte di un'autorità nazionale competente, i fabbricanti forniscono a tale autorità, in formato cartaceo o digitale, tutte le informazioni e la documentazione necessarie a dimostrare la conformità delle macchine o dei prodotti correlati rispetto al presente regolamento, in una lingua facilmente comprensibile da tale autorità. Essi cooperano con tale autorità, su sua richiesta, a qualsiasi azione intrapresa per eliminare i rischi presentati dalle macchine o dai prodotti correlati che hanno immesso sul mercato o messo in servizio.", "pages": [20, 20], "tags": ["macchina"], "always": false, "standards": []}, {"id": "MR-ART11-1", "law": "MR", "section": "MR-OBB", "group": "Art. 11 — Obblighi dei fabbricanti di quasi-macchine", "ref": "Art. 11, par. 1", "title": "Obblighi dei fabbricanti di quasi-macchine", "text": "All'atto dell'immissione sul mercato di una quasi-macchina, i fabbricanti garantiscono che sia stata progettata e fabbricata conformemente ai pertinenti requisiti essenziali di sicurezza e di tutela della salute di cui all'allegato III.", "pages": [20, 20], "tags": ["quasi_macchina"], "always": false, "standards": []}, {"id": "MR-ART11-2", "law": "MR", "section": "MR-OBB", "group": "Art. 11 — Obblighi dei fabbricanti di quasi-macchine", "ref": "Art. 11, par. 2", "title": "Obblighi dei fabbricanti di quasi-macchine", "text": "Prima dell'immissione sul mercato di una quasi-macchina, i fabbricanti redigono la documentazione tecnica di cui all'allegato IV, parte B.\nSe la conformità della quasi-macchina rispetto ai pertinenti requisiti essenziali di sicurezza e di tutela della salute di cui all'allegato III è stata dimostrata nella documentazione tecnica di cui all'allegato IV, parte B, i fabbricanti redigono la dichiarazione di incorporazione UE conformemente all'articolo 22.", "pages": [20, 20], "tags": ["quasi_macchina"], "always": false, "standards": []}, {"id": "MR-ART11-3", "law": "MR", "section": "MR-OBB", "group": "Art. 11 — Obblighi dei fabbricanti di quasi-macchine", "ref": "Art. 11, par. 3", "title": "Obblighi dei fabbricanti di quasi-macchine", "text": "I fabbricanti mantengono la documentazione tecnica e la dichiarazione di incorporazione UE a disposizione delle autorità di vigilanza del mercato per un periodo di almeno 10 anni dalla data di immissione sul mercato della quasi-macchina. Se pertinente, il codice sorgente o la logica di programmazione integrati nella documentazione tecnica, su richiesta motivata da parte delle autorità nazionali competenti, sono messi a disposizione di tali autorità a condizione che tale codice sorgente o logica di programmazione siano necessari affinché esse siano in grado di verificare il rispetto dei pertinenti requisiti essenziali di sicurezza e di tutela della salute di cui all'allegato III.", "pages": [20, 20], "tags": ["quasi_macchina"], "always": false, "standards": []}, {"id": "MR-ART11-4", "law": "MR", "section": "MR-OBB", "group": "Art. 11 — Obblighi dei fabbricanti di quasi-macchine", "ref": "Art. 11, par. 4", "title": "Obblighi dei fabbricanti di quasi-macchine", "text": "I fabbricanti si assicurano che siano predisposte le procedure necessarie affinché la quasi-macchina fabbricata nell'ambito di una produzione in serie continui a essere conforme al presente regolamento. Si tiene debitamente conto delle modifiche del processo produttivo o della progettazione o delle caratteristiche delle quasi-macchine, nonché delle modifiche delle norme armonizzate o di altre specifiche tecniche, o delle specifiche comuni di cui all'articolo 20, con riferimento alle quali è dichiarata o è verificata la conformità delle quasi-macchine.", "pages": [20, 20], "tags": ["quasi_macchina"], "always": false, "standards": []}, {"id": "MR-ART11-5", "law": "MR", "section": "MR-OBB", "group": "Art. 11 — Obblighi dei fabbricanti di quasi-macchine", "ref": "Art. 11, par. 5", "title": "Obblighi dei fabbricanti di quasi-macchine", "text": "I fabbricanti garantiscono che sulle quasi-macchine da loro immesse sul mercato siano apposti almeno una designazione della quasi-macchina, l'anno di costruzione, vale a dire l'anno in cui il processo di fabbricazione si è concluso, il modello e la serie o il tipo nonché, eventualmente, un numero di lotto o di serie oppure qualsiasi altro elemento che ne consenta l'identificazione, oppure, qualora le dimensioni o la natura della quasi-macchina non lo consentano, garantiscono che le informazioni prescritte siano fornite sull'imballaggio o in un documento di accompagnamento della quasi-macchina.", "pages": [20, 20], "tags": ["quasi_macchina"], "always": false, "standards": []}, {"id": "MR-ART11-6", "law": "MR", "section": "MR-OBB", "group": "Art. 11 — Obblighi dei fabbricanti di quasi-macchine", "ref": "Art. 11, par. 6", "title": "Obblighi dei fabbricanti di quasi-macchine", "text": "I fabbricanti indicano il proprio nome, la propria denominazione commerciale registrata o il proprio marchio registrato, nonché l'indirizzo postale e il sito internet, l'indirizzo di posta elettronica o altri contatti digitali ai quali possono essere contattati sulla quasi-macchina oppure, ove ciò non sia possibile, sull'imballaggio o in un documento di accompagnamento della quasi-macchina. L'indirizzo indica un unico recapito presso il quale il fabbricante può essere contattato. Le informazioni relative al contatto sono scritte in una lingua facilmente comprensibile dalla persona incaricata dell'incorporazione della quasi-macchina e per le autorità di vigilanza del mercato.", "pages": [20, 20], "tags": ["quasi_macchina"], "always": false, "standards": []}, {"id": "MR-ART11-7", "law": "MR", "section": "MR-OBB", "group": "Art. 11 — Obblighi dei fabbricanti di quasi-macchine", "ref": "Art. 11, par. 7", "title": "Obblighi dei fabbricanti di quasi-macchine", "text": "I fabbricanti garantiscono che le quasi-macchine siano accompagnate dalle istruzioni per l'assemblaggio di cui all'allegato XI.\nLe istruzioni per l'assemblaggio possono essere fornite dal fabbricante in formato digitale.\nQuando le istruzioni per l'assemblaggio vengono fornite in formato digitale, il fabbricante deve:\na) indicare sulla quasi-macchina, oppure, ove ciò non sia possibile, sull'imballaggio o in un documento di accompagnamento le modalità di accesso alle istruzioni per l'assemblaggio in formato digitale;\nb) presentare le istruzioni per l'assemblaggio in un formato che consenta alla persona incaricata dell'incorporazione della quasi-macchina di stamparle e scaricarle, nonché di salvarle su un dispositivo elettronico in maniera da potervi accedere in qualsiasi momento, in particolare in caso di avaria della quasi-macchina; tale requisito si applica anche quando le istruzioni per l'assemblaggio sono integrate nel software della quasi-macchina;\nc) renderle accessibili online per un periodo di almeno 10 anni dopo l'immissione sul mercato della quasi-macchina.\nTuttavia, su richiesta della persona incaricata dell'incorporazione della quasi-macchina al momento dell'acquisto, il fabbricante fornisce gratuitamente le istruzioni per l'assemblaggio in formato cartaceo entro un mese.\nLe istruzioni per l'assemblaggio sono redatte in una lingua facilmente comprensibile dalla persona incaricata dell'incorporazione della quasi-macchina, secondo quanto stabilito dallo Stato membro interessato, e sono chiare, comprensibili e leggibili.", "pages": [20, 21], "tags": ["quasi_macchina"], "always": false, "standards": []}, {"id": "MR-ART11-8", "law": "MR", "section": "MR-OBB", "group": "Art. 11 — Obblighi dei fabbricanti di quasi-macchine", "ref": "Art. 11, par. 8", "title": "Obblighi dei fabbricanti di quasi-macchine", "text": "I fabbricanti garantiscono che la quasi-macchina sia accompagnata dalla dichiarazione di incorporazione UE di cui all'allegato V, parte B, o, in alternativa, i fabbricanti forniscono l'indirizzo internet o il codice ottico dove è possibile accedere a tale dichiarazione di incorporazione UE nelle istruzioni per l'assemblaggio di cui all'allegato XI.\nLe dichiarazioni di incorporazione UE digitali sono rese accessibili online per un periodo di almeno 10 anni dopo l'immissione sul mercato della quasi-macchina.", "pages": [21, 21], "tags": ["quasi_macchina"], "always": false, "standards": []}, {"id": "MR-ART11-9", "law": "MR", "section": "MR-OBB", "group": "Art. 11 — Obblighi dei fabbricanti di quasi-macchine", "ref": "Art. 11, par. 9", "title": "Obblighi dei fabbricanti di quasi-macchine", "text": "I fabbricanti che ritengono o hanno motivo di ritenere che la quasi-macchina che hanno immesso sul mercato non sia conforme al presente regolamento adottano immediatamente le azioni correttive necessarie a renderla conforme, ritirarla o richiamarla, a seconda dei casi. Inoltre, se la quasi-macchina presenta un rischio per quanto riguarda i pertinenti requisiti essenziali di sicurezza e di tutela della salute, i fabbricanti ne informano immediatamente le autorità nazionali competenti degli Stati membri in cui hanno messo a disposizione la quasi-macchina sul mercato, dando in particolare informazioni dettagliate sulla non conformità e su eventuali azioni correttive intraprese.", "pages": [21, 21], "tags": ["quasi_macchina"], "always": false, "standards": []}, {"id": "MR-ART11-10", "law": "MR", "section": "MR-OBB", "group": "Art. 11 — Obblighi dei fabbricanti di quasi-macchine", "ref": "Art. 11, par. 10", "title": "Obblighi dei fabbricanti di quasi-macchine", "text": "A seguito di una richiesta motivata da parte di un'autorità nazionale competente, i fabbricanti forniscono a tale autorità, in formato cartaceo o digitale, tutte le informazioni e la documentazione necessarie a dimostrare la conformità della quasi-macchina rispetto al presente regolamento, in una lingua facilmente comprensibile da tale autorità. Essi cooperano con tale autorità, su sua richiesta, a qualsiasi azione intrapresa per eliminare i rischi relativi ai pertinenti requisiti essenziali di sicurezza e di tutela della salute presentati dalla quasi-macchina che hanno immesso sul mercato.", "pages": [21, 21], "tags": ["quasi_macchina"], "always": false, "standards": []}, {"id": "MR-ART21-1", "law": "MR", "section": "MR-OBB", "group": "Art. 21 — Dichiarazione di conformità UE per le macchine e i prodotti correlati", "ref": "Art. 21, par. 1", "title": "Dichiarazione di conformità UE per le macchine e i prodotti correlati", "text": "La dichiarazione di conformità UE attesta che la conformità ai requisiti essenziali di sicurezza e di tutela della salute applicabili di cui all'allegato III è stata dimostrata.", "pages": [26, 26], "tags": ["macchina"], "always": false, "standards": ["EN ISO/IEC 17050-1:2010"]}, {"id": "MR-ART21-2", "law": "MR", "section": "MR-OBB", "group": "Art. 21 — Dichiarazione di conformità UE per le macchine e i prodotti correlati", "ref": "Art. 21, par. 2", "title": "Dich

server {
 listen 80;
 server_name localhost;
 root /usr/share/nginx/html;
 client_max_body_size 21m;
 gzip on;
 gzip_proxied any;
 gzip_min_length 1024;
 gzip_types application/json text/csv text/css application/javascript;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
 location / { try_files $uri $uri/ /index.html; }
 location /api/ { proxy_pass http://backend:8080; proxy_read_timeout 900s; proxy_send_timeout 900s; }
}

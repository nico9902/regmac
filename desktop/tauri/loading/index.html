<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>RegMac</title>
<style>
:root{--bg:#0B1F3A;--fg:#F8FAFC;--mute:#A9B6C9;--brand:#155EEF}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.c{height:100%;display:grid;place-items:center;text-align:center}
img{width:72px;height:72px;border-radius:16px}
h1{font-size:22px;margin:14px 0 6px;font-weight:650}
p{color:var(--mute);margin:0}
.bar{width:220px;height:4px;border-radius:3px;background:#1F3A5F;margin:22px auto 0;overflow:hidden}
.bar i{display:block;width:40%;height:100%;background:var(--brand);border-radius:3px;animation:m 1.2s ease-in-out infinite}
@keyframes m{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
.err{display:none;max-width:760px;margin:18px auto 0;color:#FCA5A5;text-align:left;white-space:pre-wrap;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;background:#132B4D;border:1px solid #1F3A5F;border-radius:8px;padding:12px 14px;max-height:50vh;overflow:auto;user-select:text;-webkit-user-select:text}
button{margin-top:12px;border:0;border-radius:8px;padding:8px 14px;background:#155EEF;color:#fff;font:inherit;cursor:pointer}
</style>
</head>
<body>
<div class="c"><div>
  <img src="logo.png" alt="">
  <h1>RegMac</h1>
  <p id="msg">Avvio del motore…</p>
  <div class="bar" id="bar"><i></i></div>
  <p class="err" id="err"></p>
  <button id="copy" style="display:none" onclick="navigator.clipboard.writeText(document.getElementById('err').textContent);this.textContent='Copiato'">Copia il messaggio</button>
</div></div>
<script>
window.showError = function (m) {
  document.getElementById('bar').style.display = 'none';
  document.getElementById('msg').textContent = 'Avvio non riuscito';
  var e = document.getElementById('err'); e.textContent = m; e.style.display = 'block';
  document.getElementById('copy').style.display = 'inline-block';
};
window.slow = function () {
  document.getElementById('msg').textContent = 'Avvio del motore… al primo avvio può richiedere fino a un minuto';
};
</script>
</body>
</html>
